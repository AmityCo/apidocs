message.didAddReaction:
  get:
    tags:
      - "Webhook event"
    security: []
    summary: "Message Didaddreaction webhook event"
    description: "Send updated message whenever add reaction to this message."
    responses:
      200:
        $ref: "../../v3/message/response.yaml#/message-add-reaction-with-reactor-webhook-response"
message.didClearflag:
  get:
    security: []
    tags:
      - "Webhook event"
    summary: "Message Didclearflag webhook event"
    description: "Send updated message whenever all message flags are cleared."
    responses:
      200:
        description: "messages is messages information. users is list of all user relate to this messages"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                event:
                  type: "string"
                  enum:
                    - "message.didClearflag"
                data:
                  type: "object"
                  properties:
                    messages:
                      type: "array"
                      items:
                        $ref: "../../schema/message.yaml#/Message"
                    users:
                      type: "array"
                      items:
                        $ref: "../../schema/user.yaml#/User"
