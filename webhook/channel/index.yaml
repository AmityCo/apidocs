channel.didAddUsers:
  get:
    tags:
      - "Webhook event"
    description: "Send user added event information whenever new member got added to a channel."
    responses:
      "200":
        description: "channel is channel information. userIds is a list of added userId. adderId is user who add other user to channel users is a list of user."
        content:
          application/json:
            schema:
              type: "object"
              properties:
                event:
                  type: "string"
                  enum:
                    - "channel.didAddUsers"
                data:
                  type: "object"
                  properties:
                    channel:
                      type: "array"
                      items:
                        $ref: "#/components/schemas/Channel"
                    users:
                      type: "array"
                      items:
                        $ref: "./schema/user.yaml#/User"
                    userIds:
                      type: "array"
                      items:
                        type: "string"
                    adderId:
                      type: "string"

channel.didBan:
  get:
    tags:
      - "Webhook event"
    description: "Send channel banned event whenever a channel got banned."
    responses:
      "200":
