comment.didAddReaction:
  get:
    tags:
      - "Webhook event"
    security:
      - BearerAuth: []
    description: "This is called when reaction of comment is added.\n"
    responses:
      "200":
        $ref: "./v3/comment/response.yaml#/CommentWithReactorWebhookResponse"
