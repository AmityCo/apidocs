follow.didAcceptRequest:
  get:
    tags:
      - "Webhook event"
    security:
      - BearerAuth: []
    description: "This is called when a user accepts a follow request from another user.\n"
    responses:
      200:
        description: "Follow Object"
        $ref: "../../v4/follow/response.yaml#/follow-webhook-response"
follow.didCancelRequest:
  get:
    tags:
      - "Webhook event"
    security:
      - BearerAuth: []
    description: "This is called when a user cancels a request to follow another user.\n"
    responses:
      200:
        description: "Follow Object"
        $ref: "../../v4/follow/response.yaml#/follow-webhook-response"
