user.didBlock:
  get:
    tags:
      - "Webhook event"
    summary: "User Didblock webhook event"
    security:
      - BearerAuth: []
    description: "This is called when a user blocks another user.\n"
    responses:
      200:
        description: "Block event information. data contains the follow relationship (from, to, status), users is a list of userInfo, files is a list of file information"
        $ref: "../../v4/follow/response.yaml#/follow-webhook-response"
user.didClearFlag:
  get:
    tags:
      - "Webhook event"
    summary: "User Didclearflag webhook event"
    security:
      - BearerAuth: []
    description: "This is called when the user flags are cleared\n"
    responses:
      200:
        description: "User flag cleared event information. users is a list of userInfo. files is a list of file information"
        $ref: "../../v1/user/response.yaml#/user-webhook-response"
user.didCreate:
  get:
    tags:
      - "Webhook event"
    summary: "User Didcreate webhook event"
    security:
      - BearerAuth: []
    description: "This is called when a user is created\n"
    responses:
      200:
        description: "User created event information. users is a list of userInfo. files is a list of file information"
        $ref: "../../v1/user/response.yaml#/user-webhook-response"
user.didFlag:
  get:
    tags:
      - "Webhook event"
    summary: "User Didflag webhook event"
    security:
      - BearerAuth: []
    description: "This is called when a user is flagged. Each userInfo includes a `flags` array with the report entries (reportType, reason, comment, reporter userId) plus moderation detail.\n"
    responses:
      200:
        description: "User flag event information. users is a list of userInfo (each with the flags/report entries and moderation detail). files is a list of file information"
        $ref: "../../v1/user/response.yaml#/user-flag-webhook-response"
user.didUnblock:
  get:
    tags:
      - "Webhook event"
    summary: "User Didunblock webhook event"
