        $ref: "../../v4/follow/response.yaml#/follow-webhook-response"
user.didUnflag:
  get:
    tags:
      - "Webhook event"
    summary: "User Didunflag webhook event"
    security:
      - BearerAuth: []
    description: "This is called when a user is unflagged. Each userInfo includes the remaining `flags` entries plus moderation detail.\n"
    responses:
      200:
        description: "User unflag event information. users is a list of userInfo (each with remaining flags/report entries and moderation detail). files is a list of file information"
        $ref: "../../v1/user/response.yaml#/user-flag-webhook-response"
