poll.didCreate:
  get:
    tags:
      - "Webhook event"
    summary: "Poll Didcreate webhook event"
    security:
      - BearerAuth: []
    description: "This is called when poll is created\n"
    responses:
      200:
        $ref: "../../v3/poll/response.yaml#/poll-webhook-response"
poll.didUpdate:
  get:
    tags:
      - "Webhook event"
    summary: "Poll Didupdate webhook event"
    security:
      - BearerAuth: []
    description: "This is called when poll is updated\n"
    responses:
      200:
        $ref: "../../v3/poll/response.yaml#/poll-webhook-response"
poll.didVote:
  get:
    tags:
      - "Webhook event"
    summary: "Poll Didvote webhook event"
    security:
      - BearerAuth: []
    description: "This is called when vote is created in poll\n"
    responses:
      200:
        $ref: "../../v3/poll/response.yaml#/poll-webhook-response"
