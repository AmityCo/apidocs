    ValidationError:
      description: Put a wrong request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            code: 500000
            message: Parameters error.
            data:
              detail:
                - The 'data.text' field length must be less than or equal to 20000 characters long.
    token-post-response-200:
      description: Response payload
      content:
        text/plain:
          schema:
            type: string
            example: s9qne0wEqVb2e05271177748659f574a4e8ab85e08
            description: Use this token when create sessions
    token-post-response-401:
      description: Unauthorized. Server key is invalid.
      content:
        text/plain:
          schema:
            type: string
            example: Unauthorized
            description: Server key is invalid
    token-post-response-403:
      description: Forbidden. Possibly that secure mode is disabled
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
              message:
                type: string
              code:
                type: number
              data:
                type: object
                description: error detail
    token-post-response-422:
      description: Parameters validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
              message:
                type: string
              code:
                type: number
              data:
                type: object
                description: error detail
