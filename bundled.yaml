      properties:
        _id:
          type: string
          description: Unique identifier of the actor
        publicId:
          type: string
          description: Public identifier of the actor
        lastActedAt:
          type: string
          format: date-time
          description: Timestamp when the actor last performed the action
    TrayItemData:
      oneOf:
        - type: object
          required:
            - communityName
          properties:
            communityName:
              type: string
              description: Name of the community where the action occurred
        - type: object
          required:
            - reactionName
          properties:
            reactionName:
              type: array
              items:
                type: string
              description: List of reaction names used
    NotificationTrayItem:
      type: object
      description: Represents a single notification item in the notification tray
      required:
        - _id
        - lastOccurredAt
        - lastSeenAt
        - actors
        - actorsCount
        - actionType
        - targetId
        - targetType
        - text
        - templatedText
        - daySegment
      properties:
        _id:
          type: string
          description: Unique identifier of the notification tray item
        daySegment:
          type: string
          format: date-time
          description: Timestamp indicating which day this notification belongs to for grouping purposes
        lastSeenAt:
          type: string
          format: date-time
          description: Timestamp when the user last saw this notification
        lastOccurredAt:
          type: string
          format: date-time
          description: Timestamp when the notification last occurred
        actors:
          type: array
          description: List of users who performed the action (limited to 3 most recent)
          items:
            $ref: '#/components/schemas/NotificationTrayItemActor'
        actorsCount:
          type: integer
          description: Total count of actors who performed the action
        actionType:
          type: string
          description: Type of action that triggered the notification
          enum:
            - post
            - poll
            - comment
            - reaction
            - mention
            - reply
        trayItemCategory:
          type: string
          description: More specific category for certain action types
          enum:
            - mention_in_poll
            - mention_in_post
            - mention_in_comment
            - mention_in_reply
            - reaction_on_post
            - reaction_on_comment
            - reaction_on_reply
        targetId:
          type: string
          description: Identifier of the content being acted upon
        targetType:
          type: string
          description: Type of content being acted upon
        referenceId:
          type: string
          description: Optional identifier of related content for context
        referenceType:
          type: string
          description: Optional type of the referenced content
        actionReferenceId:
          type: string
          description: Optional identifier of the specific action object
        parentId:
          type: string
          description: Optional identifier of parent content
        data:
          deprecated: true
          $ref: '#/components/schemas/TrayItemData'
        text:
          type: string
          description: Human-readable notification text
          example: Alice and 5 others reacted to your post.
        templatedText:
          type: string
          description: Notification text with template variables for client-side processing
          example: '{{ userId: 67f4e40030a5dea19d8a187f }} replied to your comment in {{ communityId: 67f4e4c07af04a145b1e684a }}'
    NotificationSetting:
      type: object
      properties:
        isPushNotifiable:
          type: boolean
          description: on/off notification
        isUserEnabled:
          type: boolean
          description: enable/disable notification from user level(for community level)
        notifiableEvents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum:
                  - channel.created
                  - channel.joined
                  - conversation-channel.joined
                  - text-mention-message.created
                  - message.created
                  - conversation-message.created
                  - conversation-text-message.created
                  - conversation-image-message.created
                  - conversation-file-message.created
                  - post.created
                  - post.approved
                  - post.need-reviewing
                  - text-mention-post.created
                  - text-mention-user-feed-post.created
                  - video-streaming-post.created
                  - post.reacted
                  - comment.created
                  - text-mention-comment.created
                  - text-mention-user-feed-comment.created
                  - comment.replied
                  - text-mention-comment.replied
                  - text-mention-user-feed-comment.replied
                  - comment.reacted
                  - follow.created
                  - follow.requested
                  - follow.accepted
                  - community.roleAdded
                  - community.updated
                  - story.created
                  - story-comment.created
                  - video-streaming.didStart
              moduleName:
                type: string
                enum:
                  - chat
                  - video-streaming
                  - social
              eventName:
                type: string
              isPushNotifiable:
                type: boolean
                description: on/off notification of event
              parameters:
                type: array
                items:
                  type: string
                description: place holders
              titleTemplate:
                type: string
                description: title of template
              bodyTemplate:
                type: string
                description: body of template
              listenFromRoleIds:
                type: array
                items:
                  type: string
                description: specific roles for get notify by event creator who has roles only
              ignoreFromRoleIds:
                type: array
                items:
                  type: string
                description: specific roles for ignore notify by event creator who has roles only
              isNetworkEnabled:
                type: boolean
                description: enable/disable notification from network level(for community level)
