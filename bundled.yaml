                type: string
                maxLength: 900
              mentionees:
                type: array
                description: The object of the mentions type and user who get a notification from the post.
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      example: user
                      description: |
                        type: * `user` - need to specific userIds and notification mentions individual user
                      enum:
                        - user
                    userIds:
                      type: array
                      example:
                        - userId1
                        - userId2
                      description: Array of UserId. if the mention type is a channel, doesn't send userIds
                      items:
                        type: string
              createdAt:
                type: string
                description: The date/time when a comment is created.
                format: date-time
                example: '2022-07-07T04:24:20.444Z'
              attachments:
                type: array
                description: The attachments/medias to be included in the comment
                items:
                  $ref: '#/components/schemas/CommentAttachment'
            required:
              - referenceId
    _commentId-put-request-payload:
      description: |
        comment information.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  text:
                    type: string
                    maxLength: 50000
              metadata:
                type: object
              mentionees:
                type: array
                description: The object of the mentions type and user who get a notification from the post.
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      example: user
                      description: |
                        type: * `user` - need to specific userIds and notification mentions individual user
                      enum:
                        - user
                    userIds:
                      type: array
                      example:
                        - userId1
                        - userId2
                      description: Array of UserId. if the mention type is a channel, doesn't send userIds
                      items:
                        type: string
              attachments:
                type: array
                description: The attachments/medias to be included in the comment
                items:
                  $ref: '#/components/schemas/CommentAttachment'
    _commentId-flag-request-payload:
      description: |
        information of a comment to be flagged.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              commentId:
                type: string
                maxLength: 900
            required:
              - commentId
    request_root-post-request-payload-2:
      description: |
        information of a community to be created.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              displayName:
                type: string
                minLength: 1
                maxLength: 1000
              isPublic:
                type: boolean
                default: true
              isOfficial:
                type: boolean
                default: false
              onlyAdminCanPost:
                type: boolean
                default: false
              description:
                type: string
                minLength: 1
                maxLength: 5000
              tags:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: string
                  minLength: 1
                  maxLength: 100
              metadata:
                type: object
              avatarFileId:
                type: string
                maxLength: 50
                minLength: 1
              userIds:
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  type: string
                  minLength: 1
                  maxLength: 900
              categoryIds:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: string
                  minLength: 1
                  maxLength: 50
              isUniqueDisplayName:
                type: boolean
                default: false
              needApprovalOnPostCreation:
                type: boolean
                default: false
              allowCommentInStory:
                type: boolean
                default: true
              notificationMode:
                type: string
                enum:
                  - default
                  - silent
                  - subscribe
                description: |
                  Notification Mode:
                    * `default` - Auto register push notification.
                    * `silent` - Do not send notification.
                    * `subscribe` - Send notification to subscribed users only.
            required:
              - displayName
    _communityId-put-request-payload:
      description: |
        community information.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              communityId:
                type: string
                minLength: 1
                maxLength: 900
              displayName:
                type: string
                minLength: 1
                maxLength: 1000
              isPublic:
                type: boolean
              isOfficial:
                type: boolean
              onlyAdminCanPost:
                type: boolean
              description:
                type: string
                minLength: 0
                maxLength: 5000
              tags:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: string
                  minLength: 1
                  maxLength: 100
              metadata:
                type: object
              avatarFileId:
                type: string
                maxLength: 50
                minLength: 1
              categoryIds:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: string
                  minLength: 1
                  maxLength: 50
              isUniqueDisplayName:
                type: boolean
                default: false
              needApprovalOnPostCreation:
                type: boolean
                default: false
              allowCommentInStory:
                type: boolean
                default: true
              notificationMode:
                type: string
                enum:
                  - default
                  - silent
                  - subscribe
                description: |
                  Notification Mode:
                    * `default` - Auto register push notification.
                    * `silent` - Do not send notification.
                    * `subscribe` - Send notification to subscribed users only.
            required:
              - communityId
    _communityId-users-post-request-payload:
      description: |
        information of a community.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userIds:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 50
            required:
              - userIds
    _communityId-users-put-request-payload:
      description: |
        condition for querying
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userIds:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 900
            required:
              - userIds
    _communityId-users-roles-post-request-payload:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              role:
                type: string
                minLength: 1
                maxLength: 100
              userIds:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 50
            required:
              - userIds
              - role
    request_root-post-request-payload-3:
      description: |
        information of a community category to be created.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                maxLength: 1000
              metadata:
                type: object
              avatarFileId:
                type: string
                maxLength: 50
            required:
              - name
    _categoryId-put-request-payload:
      description: |
        community category information.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              categoryId:
                type: string
                maxLength: 50
              name:
                type: string
                maxLength: 1000
              metadata:
                type: object
              avatarFileId:
                type: string
                maxLength: 50
            required:
              - categoryId
    request_root-post-request-payload-4:
      description: |
        Information of file to be created. It will be applied to every attachment
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: array
                items:
                  type: string
                  format: binary
              fullImage:
                type: boolean
                nullable: true
              preferredFilename:
                type: string
                maxLength: 1024
              accessType:
                type: string
                description: File access type. `network` type requires authentication to download.
                enum:
                  - public
                  - network
                default: public
    message-feeds_messageFeedId-mark-delivering-request-payload:
      description: Mark delivering
      content:
        application/json:
          schema:
            type: object
