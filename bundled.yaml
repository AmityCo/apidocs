  parameters:
    channelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f\d]{24}$
        example: 60e4b1b4b3b2b5c4c4b3b2b5
    postId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f\d]{24}$
        example: 60e4b1b4b3b2b5c4c4b3b2b5
    token:
      name: token
      in: query
      schema:
        type: string
        maxLength: 1000
        example: eyJhZnRlciI6eyJfaWQiOnsicG9zdElkIjoiNjUxNjZlZTNlOTVlZTQ4YjkzZWVkMjQ1IiwidXNlcklkIjoiNjUxNjZlZTRlOTVlZTQzZjgzZWVkMjViIn0sIm5ldHdvcmtJZCI6IjYwNmYzN2EzYWU2MDFlZjM3NGViYWEwMSIsInJlYWNoZWRBdCI6IjIwMjMtMDktMjlUMDY6Mjk6NTQuOTQ4WiJ9fQ==
        description: token of the page that you need from either `next` or `prev` of `paging`
    limit:
      name: limit
      in: query
      schema:
        type: number
        default: 10
        description: number of user in a page
    storyId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f\d]{24}$
        example: 60e4b1b4b3b2b5c4c4b3b2b5
    x-server-key:
      name: x-server-key
      description: Server key to authenticate the request
      in: header
      required: true
      schema:
        type: string
        maxLength: 150
    userId:
      name: userId
      description: User ID to get token for
      in: query
      schema:
        type: string
        maxLength: 100
    parameter_channelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    query:
      name: query
      in: query
      required: true
      description: Keyword for searching
      schema:
        type: string
    exactMatch:
      name: exactMatch
      in: query
      required: false
      description: Flag to indicate exact match.
      schema:
        type: boolean
        default: false
    isMemberOnly:
      name: isMemberOnly
      in: query
      required: false
      description: Flag to filter only member-only channels.
      schema:
        type: boolean
        default: false
    types:
      name: types
      in: query
      required: false
      description: Array of channel types.
      schema:
        type: array
        items:
          type: string
          enum:
            - community
            - conversation
            - live
            - broadcast
    tags:
      name: tags
      in: query
      required: false
      description: Array of channel tags.
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          maxLength: 100
    options:
      name: options
      in: query
      required: false
      description: Additional search options.
      schema:
        type: object
        properties:
          limit:
            type: number
            minimum: 1
            maximum: 100
            default: 20
          orderBy:
            type: string
            default: desc
            enum:
              - desc
              - asc
          sortBy:
            type: string
            enum:
              - lastActivity
              - relevance
            default: relevance
          token:
            type: string
            maxLength: 100
    keyword:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 100
    isDeleted:
      name: isDeleted
      in: query
      schema:
        type: boolean
        default: null
      description: |
        isDeleted:
          * `null(default)` - Show both channel is actived and channel is inactived.
          * `true` - Show channel is inactived only.
          * `false` - Show channel is actived only.
    parameter_tags:
      name: tags
      in: query
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          maxLength: 100
      description: Used for querying channels by matching all specified tags. When a query includes multiple tags (e.g., `tags=['tag1', 'tag2', 'tag3']`), the system will return all channels that have all the specified tags.
    excludeTags:
      name: excludeTags
      in: query
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          maxLength: 100
      description: Used for querying channels by excluding all specified tags. When a query includes multiple tags (e.g., `excludeTags=['tag1', 'tag2', 'tag3']`), the system will return all channels that do not have any of the specified tags.
    excludeArchives:
      name: excludeArchives
      in: query
      schema:
        type: boolean
        default: false
      description: |
        excludeArchives:
          * `false(default)` - Show all channels.
          * `true` - Show channels that are not archived only.
    filter:
      name: filter
      in: query
      schema:
        type: string
        enum:
          - all
          - member
          - notMember
          - flagged
        default: all
    parameter_types:
      name: types
      in: query
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          enum:
            - standard
            - private
            - conversation
            - broadcast
            - live
            - community
    parameter_userId:
      name: userId
      in: query
      schema:
        type: string
        maxLength: 100
    sortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
          - lastActivity
          - lastCreated
          - firstCreated
          - displayName
        default: lastActivity
    parameter_options:
      name: options
      in: query
      style: deepObject
      schema:
        type: object
        properties:
          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          token:
            type: string
            maxLength: 100
    roles:
      name: roles
      in: query
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 900
      description: Role to filter
    users-filter:
      name: filter
      in: query
      schema:
        type: string
        enum:
          - all
          - muted
          - banned
          - member&banned
        default: all
    users-sortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
          - lastCreated
          - firstCreated
          - displayName
        default: lastCreated
    users-isDeleted:
      name: isDeleted
      in: query
      schema:
        type: boolean
        default: null
      description: filter deleted members if isDeleted is null, will return both deleted and non-deleted members
    userIds:
      in: query
      name: userIds
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: string
          minLength: 1
          maxLength: 50
      description: list of user id
    role:
      in: query
      name: role
      schema:
        type: string
        minLength: 1
        maxLength: 900
      description: User id for revocation
    channelIds:
      name: channelIds
      in: query
      required: true
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          maxLength: 50
    _channelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 900
    parameter_role:
      name: role
      in: query
      schema:
        type: array
        description: Role to filter
        minItems: 1
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 900
    parameter_sortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
          - lastCreated
          - firstCreated
        default: lastCreated
    memberships:
      name: memberships
      in: query
      schema:
        type: array
        description: |
          Member type to filter - member type: User is member of channel - banned type: User is banned member of channel - muted type: User is member of channel but isMuted is true
        minItems: 1
        maxItems: 3
        items:
          type: string
          enum:
            - muted
            - banned
            - member
        default:
          - member
    parameter_options-2:
      name: options
      in: query
      style: deepObject
      schema:
        type: object
        properties:
          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          token:
            type: string
            maxLength: 1000
      description: use updatedAt when sort by first/lastUpdated
    search:
      name: search
      in: query
      schema:
        type: string
        minLength: 0
        maxLength: 10000
    parameter_isDeleted:
      name: isDeleted
      in: query
      schema:
        type: boolean
        default: null
      description: filter deleted members if isDeleted is null, will return both deleted and non-deleted members
    isBrand:
      name: isBrand
      in: query
      schema:
        type: boolean
      description: |
        Filter brand user <br>
        ```undefined``` - return all user <br>
        ```true``` - return only brand user <br>
        ```false``` - return only non-brand user
    authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
    content-type:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
    referenceId:
      name: referenceId
      in: query
      schema:
        type: string
        maxLength: 900
      description: ID of the reference **(post, content, or story)**
    referenceType:
      name: referenceType
      in: query
      schema:
        type: string
        enum:
          - post
          - content
          - story
      description: Type of the reference **(post, content, or story)**
    filterByParentId:
      name: filterByParentId
      in: query
      schema:
        type: boolean
        default: true
      description: Whether to filter by parent ID **(defaults to true)**
    parentId:
      name: parentId
      in: query
      schema:
        type: string
        maxLength: 900
      description: ID of the parent comment **(when filterByParentId is true)**
    hasFlag:
      name: hasFlag
      in: query
      schema:
        type: boolean
        default: false
      description: Filter by flagged comments
    parameter_isDeleted-2:
      name: isDeleted
      in: query
      schema:
        type: boolean
        default: null
      description: Filter by deleted status
    parameter_sortBy-2:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
          - lastCreated
          - firstCreated
          - lastUpdated
          - firstUpdated
      description: Sort order for comments **(only for pagination type)**
    parameter_options-3:
      name: options
      in: query
      required: false
      schema:
        type: object
        properties:
          type:
            type: string
            enum:
              - scrollable
              - pagination
            default: scrollable
            example: options[type]=pagination
            description: |
              Type of pagination. **(default: scrollable)**
              * `scrollable(default)` - 'after', 'first', 'before' and 'last' will be set for page size with direction.
              * `pagination` - 'skip' and 'limit' will be the number of records to skip and max records size.
          limit:
            type: integer
            minimum: 1
            maximum: 100
            example: options[limit]=10
            description: Page size **(for pagination type)**
          skip:
            type: integer
            minimum: 0
            maximum: 100
            example: options[skip]=0
            description: Number of records to skip **(for pagination type)**
          after:
            type: integer
            minimum: 1
            example: options[after]=1
            description: Cursor value to get records after **(for scrollable type)**
          first:
            type: integer
            minimum: 1
            maximum: 100
            example: options[first]=10
            description: Number of records to fetch after cursor **(for scrollable type)**
          before:
            type: integer
            minimum: 1
            example: options[before]=1
            description: Cursor value to get records before **(for scrollable type)**
          last:
            type: integer
            minimum: 1
            maximum: 100
            example: options[last]=10
            description: Number of records to fetch before cursor **(for scrollable type)**
          token:
            type: string
            maxLength: 1000
            example: options[token]=eyJza2lwIjoyMCwibGlABDFRffewfQ==
            description: Pagination token
    dataTypes:
      name: dataTypes
      in: query
      schema:
        type: object
        properties:
          values:
            type: array
            items:
              type: string
              enum:
                - text
                - image
            example: dataTypes[values][]=text
            description: |
              The dataTypes values want to be contained in the comment (available values: `text`, `image`)
          matchType:
            type: string
            enum:
              - any
              - exact
            example: dataTypes[matchType]=any
            description: |
              How the dataTypes must be contained in the comment.
              * `any`: the dataTypes could match only partial of the provided field
              * `exact`: the dataTypes must contain exactly the same as provided in values
    commentId:
      name: commentId
      in: path
      required: true
      description: Get comment by ID.
      schema:
        type: string
    preserve-edited-at:
      name: preserve-edited-at
      in: header
      required: false
      description: |
        Preserve the `editedAt` value when updating a comment.
        If the value is `true`, the `editedAt` value will not be updated.
        If the value is `false`, the `editedAt` value will be updated.
      schema:
        type: boolean
