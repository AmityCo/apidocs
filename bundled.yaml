                  - user
              userIds:
                type: array
                description: Array of UserId.
                items:
                  type: string
              userPublicIds:
                type: array
                description: Array of UserPublicId.
                items:
                  type: string
              userInternalIds:
                type: array
                description: Array of UserInternalId.
                items:
                  type: string
        impression:
          type: integer
        reach:
          type: integer
      required:
