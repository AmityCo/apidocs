        - $ref: '#/components/parameters/roles'
        - $ref: '#/components/parameters/users-filter'
        - $ref: '#/components/parameters/users-sortBy'
        - $ref: '#/components/parameters/parameter_options'
        - $ref: '#/components/parameters/users-isDeleted'
