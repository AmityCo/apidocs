    message-feeds_messageFeedId-mark-read-request-payload:
      description: Mark read
      content:
        application/json:
          schema:
            type: object
            required:
              - readToSegment
            properties:
              readToSegment:
                type: number
                description: segment of message as read by user
    message-feeds-reading-request-payload:
      description: Message feed reading
      content:
        application/json:
          schema:
            type: object
            required:
              - messageFeedIds
            properties:
              messageFeedIds:
                type: array
                items:
                  type: string
                  description: message feed id (internal)
    sync-request-payload:
      description: Marker sync
      content:
        application/json:
          schema:
            type: object
            properties:
              deviceLastSyncAt:
                type: string
                description: The date/time when user device last sync.
                format: date-time
    blacklist-records-request-payload:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              regexs:
                type: array
                items:
                  type: string
            required:
              - regexs
    records-put-request-payload:
      description: |
        Rules information to be refreshed.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              regexs:
                type: array
                items:
                  type: string
            required:
              - regexs
    records-post-request-payload:
      description: |
        Rules information to be added.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              regexs:
                type: array
                items:
                  type: string
              isMatchExactWord:
                type: boolean
            required:
              - regexs
    records_ruleId-put-request-payload:
      description: |
        Rules information to be updated.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              ruleId:
                type: string
              isEnabled:
                type: boolean
            required:
              - ruleId
              - isEnabled
    settings-put-request-payload:
      description: |
        moderation setting information
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              maxRepetition:
                type: integer
                minimum: 0
              maxRepetitionTimeout:
                type: integer
                minimum: 0
              blacklistMuteTimeout:
                type: integer
                minimum: 0
              whitelistMuteTimeout:
                type: integer
                minimum: 0
              maxRepetitionMuteTimeout:
                type: integer
                minimum: 0
              enableImageModeration:
                type: boolean
              imageModeration:
                type: object
                properties:
                  nudity:
                    type: number
                    minimum: 0
                  suggestive:
                    type: number
                    minimum: 0
                  violence:
                    type: number
                    minimum: 0
                  disturbing:
                    type: number
                    minimum: 0
    allowlists-post-request-payload:
      description: |
        Rules information to be added.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              regexs:
                type: array
                minItems: 0
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
            required:
              - regexs
    blocklists-post-request-payload:
      description: |
        Rules information to be added.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              regexs:
                type: array
                minItems: 0
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
              isMatchExactWord:
                type: boolean
                default: false
            required:
              - regexs
    verify-request-payload:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                description: A list of URLs to be verified
                type: array
                items:
                  type: string
                  maxLength: 500
                maxItems: 10
                minItems: 1
    request_root-post-request-payload-5:
      description: |
        Information of message to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              channelId:
                type: string
                maxLength: 150
              messageId:
                type: string
                maxLength: 150
              type:
                type: string
                enum:
                  - text
                  - image
                  - file
                  - custom
                  - video
                  - audio
                  - imagemap
                default: text
              data:
                type: object
                properties:
                  text:
                    type: string
                    maxLength: 20000
              fileId:
                type: string
                maxLength: 50
              parentId:
                type: string
                maxLength: 150
              metadata:
                type: object
              tags:
                type: array
                maxItems: 10
                items:
                  type: string
                  maxLength: 30
              mentionees:
                type: array
                description: The object of the mentions type and user who get a notification for the message.
                maxItems: 2
                items:
                  $ref: '#/components/schemas/MentioneesRequest'
            required:
              - channelId
    _messageId-post-request-payload:
      description: |
        Information of message to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  text:
                    type: string
                    maxLength: 20000
              metadata:
                type: object
              tags:
                type: array
                maxItems: 10
                items:
                  type: string
                  maxLength: 30
              mentionees:
                type: array
                description: The object of the mentions type and user who get a notification for the message.
                maxItems: 2
                items:
                  $ref: '#/components/schemas/MentioneesRequest'
    root-put-request-payload:
      description: |
        information for a network setting
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              networkId:
                type: string
              tierHandler:
                type: string
                maxLength: 200
              socialEnabled:
                type: boolean
              videoStreamingEnabled:
                type: boolean
              chatEnabled:
                type: boolean
              isWhitelistEnabled:
                type: boolean
    chat-put-request-payload:
      description: |
        information for a network setting
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              isAllowMentionedChannelEnabled:
                type: boolean
                default: false
              messagePreviewSetting:
                type: object
                description: Message preview setting
                properties:
                  enabled:
                    type: boolean
                    default: false
                    description: message preview feature enable or disable
                  isIncludeDeleted:
                    type: boolean
                    default: false
                    description: message preview can be a deleted message, if false return message preview without a deleted message
                required:
                  - enabled
              isAllowAdminViewConversationMessage:
                type: boolean
                default: true
              isAllowAdminManageConversationMessage:
                type: boolean
                default: true
              allowMemberToUpdateConversationChannel:
                type: boolean
                default: false
                description: Allow conversation channel that has more than 2 member wide edit rights
    prehook-put-request-payload:
      description: |
        Information of a prehook to be updated.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              enabled:
                type: boolean
              callbackUrl:
                type: string
                maxLength: 900
              defaultAction:
                type: string
                enum:
                  - allow
                  - deny
              regenerateKey:
                type: boolean
                description: An option for regenerating the secret key.
    social-put-request-payload:
      description: |
        information for a network setting
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userPrivacySetting:
                type: string
                enum:
                  - public
                  - private
              isFollowWithRequestEnabled:
                type: boolean
                default: false
              isAllowEditPostWhenReviewingEnabled:
                type: boolean
              showOnlyMyFeed:
                type: boolean
                default: false
              showMyPost:
                type: boolean
              showEveryonePost:
                type: boolean
              showCommunityPost:
                type: boolean
              showFollowingPost:
                type: boolean
              isAllowMentionedChannelEnabled:
                type: boolean
              disallowNonMemberInteractInCommunity:
                type: boolean
              storyExpiryTimeMinutes:
                type: integer
                minimum: 60
                maximum: 1440
                default: 1440
              allowAllUserToCreateStory:
                type: boolean
                description: Allow all user to create story (default will allow only user that have permission to create story)
              allowJoinPrivateCommunity:
                type: boolean
                description: |
                  true - Allow user to join private community by themselves
                  false - User need to be added to join private community
              maxGlobalPinnedPost:
                description: Maximum number of global pinned post (only super admin)
                type: integer
                minimum: 1
                maximum: 20
                default: 1
    semantic-search-put-request-payload:
      description: |
        information for a network setting
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              postMinScore:
                type: number
                minimum: 0
                maximum: 1
              communityMinScore:
                type: number
                minimum: 0
                maximum: 1
    users-put-request-payload:
      description: |
        Information of a users to be updated.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              isAllowUpdateDisplayName:
                type: boolean
    webhook-put-request-payload:
      description: |
        information for a network setting
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              webhookEnabled:
                type: boolean
                description: |
                  `true` - User can register webhook for network and will receive a webhook.
                  `false` - User won't be able to register webhook and won't receive a webhook.
    request_root-post-request-payload-6:
      description: |
        information of a device to be registered.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              deviceId:
                type: string
                maxLength: 150
              platform:
                type: string
                enum:
                  - android
                  - ios
              token:
                type: string
                description: device token for push notification. For ios platform, the token length must be less than or equals 400 characters and they must be hexadecimal.
                maxLength: 1000
              userId:
                type: string
              provider:
                type: string
            required:
              - deviceId
              - platform
              - token
              - userId
    setting-post-request-payload:
      description: |
        Notification setting information to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              level:
                type: string
                enum:
                  - user
                  - channel
                  - community
                description: |
                  level:
                    * `user` - need to specific modules via notifiableEvents.
                    * `channel` - need to specific channelId.
                    * `community` - need to specific communityId and community event via notifiableEvents.
              isPushNotifiable:
                type: boolean
              channelId:
                type: string
                minLength: 1
                maxLength: 900
              communityId:
                type: string
                minLength: 1
                maxLength: 900
              notifiableEvents:
                type: array
                minItems: 1
                maxItems: 7
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      enum:
                        - channel.created
                        - channel.joined
                        - conversation-channel.joined
                        - text-mention-message.created
                        - message.created
                        - conversation-message.created
                        - conversation-text-message.created
                        - conversation-image-message.created
                        - conversation-file-message.created
                        - post.created
                        - post.approved
                        - post.need-reviewing
                        - text-mention-post.created
                        - text-mention-user-feed-post.created
                        - video-streaming-post.created
                        - post.reacted
                        - comment.created
                        - text-mention-comment.created
                        - text-mention-user-feed-comment.created
                        - comment.replied
                        - text-mention-comment.replied
                        - text-mention-user-feed-comment.replied
                        - comment.reacted
                        - follow.created
                        - follow.requested
                        - follow.accepted
                        - community.roleAdded
                        - community.updated
                        - video-streaming.didStart
                    moduleName:
                      type: string
                      enum:
                        - chat
                        - video-streaming
                        - social
                    isPushNotifiable:
                      type: boolean
                    titleTemplate:
                      type: string
                      maxLength: 1000
                    bodyTemplate:
                      type: string
                      maxLength: 5000
                    listenFromRoleIds:
                      type: array
                      maxItems: 10
                      items:
                        type: string
                        minLength: 1
                        maxLength: 900
                      description: specific roles for get notify by event creator who has roles only
                    ignoreFromRoleIds:
                      type: array
                      maxItems: 10
                      items:
                        type: string
                        minLength: 1
                        maxLength: 900
                      description: specific roles for ignore notify by event creator who has roles only
            required:
              - level
    request_root-post-request-payload-7:
      description: |
        Information of a poll to be created.
        ### Required
        - at least 2 options
        - dataType currently support only `text`
        - closedIn unit must be `milliseconds`
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              text:
                type: string
              question:
                type: string
                description: question.
              answers:
                type: array
                minimum: 2
                maxItems: 10
                items:
                  type: object
                  properties:
                    dataType:
                      description: Datatype of answer (current only string).
                      type: string
                      enum:
                        - text
                    data:
                      type: string
              answerType:
                description: single or multiple.
                type: string
                enum:
                  - single
                  - multiple
                  - null
                default: null
              closedIn:
                type: number
                description: Countdown time to close vote (milliseconds)
            required:
              - data
    _pollId-put-request-payload:
      description: |
        Information of a poll to be updated.
        ### Required
        - currently support only `closed`
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              text:
                type: string
              status:
                description: poll status
                type: string
                default: closed
            required:
              - data
    _pollId-votes-post-request-payload:
      description: |
        Information of a poll to be voted.
        ### Required
        - answerIds for vote the poll
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              answerIds:
                description: poll id
                type: array
                items:
                  type: string
            required:
              - data
    request_root-post-request-payload-8:
      description: |
        information of a post to be created.

        When `dataType` is set `data` payload can be anything but it will not support normal data capability (ex. images and files) and `data` payload size will be limit to `100kb`
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              text:
                type: string
                deprecated: true
              data:
                type: object
                description: require text or images or files (can't add images with files)
                properties:
                  text:
                    type: string
                  images:
                    type: array
                    items:
                      type: string
                  files:
                    type: array
                    items:
                      type: string
                required:
                  - text
              dataType:
                type: string
                example: upstra.customtype
                description: must be in namespace like format (ex. "upstra.customtype", "com.eko.birthday")
              targetType:
                type: string
                enum:
                  - user
                  - community
                  - content
                default: user
              targetId:
                type: string
                example: <userId>
              metadata:
                type: object
              postId:
                type: string
              tags:
                type: array
                minItems: 0
                maxItems: 5
                items:
                  type: string
                  maximum: 24
                  description: tags
              createdAt:
                type: string
                description: The date/time when a post is created.
                format: date-time
                example: '2022-07-07T04:24:20.444Z'
            required:
              - data
    _postId-put-request-payload:
      description: |
        information of a post to be updated.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              text:
                type: string
                deprecated: true
              data:
                type: object
                properties:
                  text:
                    type: string
                    maximum: 50000
                    description: For updating text in the post
                  fileId:
                    type: string
                    maximum: 100
                    description: Put file id to update file,image inside file, image post (video is not supported yet)
                  streamId:
                    type: string
                    maximum: 100
                    description: Put stream id to update live streaming post with new streaming
                  thumbnailFileId:
                    type: string
                    maximum: 100
                    description: Put image file id to update video file thumbnail in video post
              metadata:
                type: object
              tags:
                type: array
                minItems: 0
                maxItems: 5
                items:
                  type: string
                  maximum: 24
                  description: tags
            required:
              - postId
    settings-user-request-payload:
      content:
        application/json:
          schema:
            type: object
            properties:
              enabled:
                type: boolean
            required:
              - enabled
    request_root-post-request-payload-9:
      description: |
        reference ID and type with reaction name
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              referenceId:
                type: string
                maxLength: 900
              referenceType:
                type: string
                enum:
                  - message
                  - post
                  - comment
                  - story
              reactionName:
                type: string
                maxLength: 100
              referenceVersion:
                description: The API version of the document (Ex. If using with message v5, the referenceVersion will be 5)
                type: integer
            required:
              - referenceId
              - referenceType
              - reactionName
    request_root-put-request-payload:
      description: |
        Permission information to be added
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              publicIds:
                type: array
                description: The list of role public ids
                items:
                  type: string
              permissions:
                type: array
                description: The list of permission to be added. You can see all permissions at https://docs.amity.co/amity-sdk/core-concepts/user/user-permission#permissions
                items:
                  type: string
            required:
              - publicIds
              - permissions
    role-request-payload:
      description: |
        information of a role to be created.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              roleId:
                type: string
                description: role id
                minLength: 1
                maxLength: 100
              displayName:
                type: string
                description: display name of role
                minLength: 0
                maxLength: 100
              permissions:
                type: array
                items:
                  type: string
                description: The list of permission for this role. https://docs.amity.co/amity-sdk/core-concepts/user/user-permission#permissions
            required:
              - roleId
              - permissions
    request_root-post-request-payload-10:
      description: |
        Information about user and devices that he/she use to connect to. If displayName is provide, that user display is updated as well.

        If userId doesn't exists, new user will be created.

        authToken need to pass when network option is set to secure
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: string
                minLength: 1
                maxLength: 50
              deviceId:
                type: string
                minLength: 1
                maxLength: 150
              deviceInfo:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - ios
                      - android
                      - web
                      - node
                  model:
                    type: string
                    maxLength: 100
                  sdkVersion:
                    type: string
                    maxLength: 30
              displayName:
                type: string
                maxLength: 100
              authToken:
                type: string
                description: Authentication token from /api/v3/authentication/token
                minLength: 1
                maxLength: 100
            required:
              - userId
              - deviceId
    common-post-request-payload:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: string
            required:
              - userId
    request_root-put-request-payload-2:
      description: |
        User to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              userId:
                type: string
                maxLength: 50
              displayName:
                type: string
                maxLength: 100
              roles:
                type: array
                description: Only administrator can update system roles (moderator and admin)
                maxItems: 10
                items:
                  type: string
                  maxLength: 100
              metadata:
                type: object
                description: |
                  User metadata (max: 5,000 bytes)
              avatarFileId:
                type: string
                maxLength: 50
              avatarCustomUrl:
                type: string
                maxLength: 1000
              description:
                type: string
                maxLength: 500
    user-event-video-streaming-request-payload:
      description: A group of user activity on startTime, endTime and watchSeconds.
      required: true
      content:
        application/json:
          schema:
            required:
              - signature
              - nonceStr
              - timestamp
              - streams
            properties:
              signature:
                description: check detail signature algorithm at https://ekoapp.atlassian.net/wiki/spaces/UP/pages/1685750282/Billing#Signature-Algorithm%3A
                type: string
              nonceStr:
                description: unique string for each request, max length 50
                type: string
              timestamp:
                description: timestamp string in UTC format
                type: string
                example: '2021-03-10T03:07:16.127Z'
              streams:
                type: array
                items:
                  type: object
                  required:
                    - streamId
                    - startTime
                    - endTime
                    - watchSeconds
                    - resolution
                  properties:
                    sessionId:
                      description: unique sessionId for each user event, max length 50
                      type: string
                    streamId:
                      description: streamId of video streaming instance, max length 50
                      type: string
                    startTime:
                      description: timestamp string in UTC format
                      type: string
                      example: '2021-03-10T03:07:16.127Z'
                    endTime:
                      description: timestamp string in UTC format
                      type: string
                      example: '2021-03-10T03:07:16.127Z'
                    watchSeconds:
                      description: user's watching time in seconds
                      type: number
                      example: 120
    request_root-post-request-payload-11:
      description: |
        Information of video streaming to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                maxLength: 1000
              description:
                type: string
                maxLength: 5000
              thumbnailFileId:
                type: string
                maxLength: 50
              metadata:
                type: object
              isSecure:
                type: boolean
                default: false
              resolution:
                type: string
                enum:
                  - SD
                  - HD
                  - FHD
                default: SD
            required:
              - title
    _streamId-request-payload:
      description: |
        Information of video streaming to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                maxLength: 1000
              description:
                type: string
                maxLength: 5000
              thumbnailFileId:
                type: string
                maxLength: 50
              metadata:
                type: object
              resolution:
                type: string
                enum:
                  - SD
                  - HD
                  - FHD
                default: SD
            required:
              - title
  examples:
    ForbiddenAvatarError:
      summary: Put file type not image into avatar
      value:
        status: error
        code: 400300
        message: Avatar must be an image.
    PermissionDeniedError:
      summary: Permission denied.
      value:
        status: error
        code: 400301
        message: User is not a member of a channel
    ForbiddenError:
      summary: No permission to access this resource.
      value:
        status: error
        code: 400300
        message: Forbidden error.
    UserIsBannedError:
      summary: User is banned from a channel / community.
      value:
        status: error
        code: 400304
        message: User is banned from a channel / community.
    GenericPermissionDeniedError:
      summary: Permission denied.
      value:
        status: error
        code: 400301
        message: Permission denied
    DuplicateEntryError:
      summary: Data already exists
      value:
        status: error
        code: 400315
        message: Data already exists
    ExemptFromBanError:
      summary: Some users cannot be banned
      value:
        status: error
        code: 400306
        message: Some users cannot be banned
    UserIsUnbannedError:
      summary: User is unbanned from a channel / community.
      value:
        status: error
        code: 400316
        message: User is unbanned from a channel / community.
    UserIsMutedError:
      summary: User is muted from the channel.
      value:
        status: error
        code: 400302
        message: User is muted from the channel.
    ChannelIsMutedError:
      summary: Channel is muted.
      value:
        status: error
        code: 400303
        message: Channel is muted.
    MaxRepetitionExceed:
      summary: User create too many same messages in short period of times.
      value:
        status: error
        code: 400307
        message: Max Repetition Exceed
    BanWordFoundError:
      summary: Banned word are found in the messages.
      value:
        status: error
        code: 400308
        message: Data contain blacklist word
    LinkNotAllowedError:
      summary: Unallowed link are found in the messages.
      value:
        status: error
        code: 400309
        message: Data contain link that is not in whitelist
