        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: add channel users
      tags:
        - Channel
      security:
