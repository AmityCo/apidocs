components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Ads:
      type: object
      properties:
        adId:
          type: string
        advertiserId:
          type: string
          description: ID of an advertiser.
        name:
          type: string
          maxLength: 100
          description: Name of an ad.
        placements:
          type: array
          description: The placements of the advertisement.
          items:
            type: string
            enum:
              - feed
              - story
              - comment
              - chatList
              - chat
        headline:
          type: string
          maxLength: 70
        description:
          type: string
          maxLength: 40
        body:
          type: string
          maxLength: 180
          optional: true
        image1_1:
          type: string
          description: File ID of an image with 1:1 aspect ratio.
        image9_16:
          type: string
          description: File ID of an image with 9:16 aspect ratio.
        callToAction:
          type: string
          maxLength: 20
          description: The call to action text of the advertisement.
        callToActionUrl:
          type: string
          maxLength: 1000
          description: The URL of the call to action.
        targets:
          type: object
          properties:
            communityIds:
              type: array
              items:
                type: string
              maxItems: 20
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Advertiser:
      type: object
      properties:
        advertiserId:
          type: string
        name:
          type: string
          maxLength: 200
        companyName:
          type: string
          maxLength: 200
        avatarFileId:
          type: string
          description: File ID of an advertiser's avatar.
          required: false
        adsCount:
          type: number
          description: Number of ads created by the advertiser.
          default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    File:
      type: object
      properties:
        fileId:
          type: string
          description: Root file key on cloud storage.
        fileUrl:
          type: string
          description: Http link for download file
        type:
          type: enum
          description: File type.
          enum:
            - image
            - file
            - video
        createdAt:
          type: string
          description: The date/time when a file is uploaded.
          format: date-time
        updatedAt:
          type: string
          description: The date/time when a file is updated.
          format: date-time
        attributes:
          type: object
          properties:
            name:
              type: string
              description: File name.
            extension:
              type: string
              description: File format.
            size:
              type: number
              description: File size.
            mimeType:
              type: string
              description: File mime-type.
            metadata:
              type: object
              description: File image metadata (width, height etc.).
              properties:
                exif:
                  type: object
                gps:
                  type: object
                height:
                  type: number
                width:
                  type: number
                isFull:
                  type: boolean
    AdNetworkSetting:
      type: object
      properties:
        enabled:
          type: boolean
        maxActiveAds:
          type: number
          default: 500
        frequency:
          type: object
          properties:
            feed:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - fixed
                    - time-window
                value:
                  type: number
                  format: number
                  minimum: 1
                  maximum: 65535
                  default: 5
            story:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - fixed
                    - time-window
                value:
                  type: number
                  minimum: 1
                  maximum: 65535
                  default: 4
            comment:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - fixed
                    - time-window
                value:
                  type: number
                  minimum: 1
                  maximum: 65535
                  default: 10
    Error:
      type: object
      properties:
        status:
          type: string
        code:
          type: number
        message:
          type: string
        data:
          type: object
          properties:
            detail:
              oneOf:
                - type: array
                  items:
                    type: string
                - type: object
    PermissionEnum:
      type: string
      enum:
        - MUTE_CHANNEL
        - CLOSE_CHANNEL
        - EDIT_CHANNEL
        - EDIT_CHANNEL_RATELIMIT
        - EDIT_MESSAGE
        - DELETE_MESSAGE
        - BAN_USER_FROM_CHANNEL
        - MUTE_USER_INSIDE_CHANNEL
        - ADD_CHANNEL_USER
        - REMOVE_CHANNEL_USER
        - EDIT_CHANNEL_USER
        - ASSIGN_CHANNEL_USER_ROLE
        - BAN_USER
        - EDIT_USER
        - ASSIGN_USER_ROLE
        - EDIT_USER_FEED_POST
        - DELETE_USER_FEED_POST
        - EDIT_USER_FEED_COMMENT
        - DELETE_USER_FEED_COMMENT
        - ADD_COMMUNITY_USER
        - REMOVE_COMMUNITY_USER
        - EDIT_COMMUNITY_USER
        - BAN_COMMUNITY_USER
        - MUTE_COMMUNITY_USER
        - EDIT_COMMUNITY
        - DELETE_COMMUNITY
        - EDIT_COMMUNITY_POST
        - DELETE_COMMUNITY_POST
        - PIN_COMMUNITY_POST
        - EDIT_COMMUNITY_COMMENT
        - DELETE_COMMUNITY_COMMENT
        - ASSIGN_COMMUNITY_USER_ROLE
        - CREATE_COMMUNITY_CATEGORY
        - EDIT_COMMUNITY_CATEGORY
        - DELETE_COMMUNITY_CATEGORY
        - CREATE_ROLE
        - EDIT_ROLE
        - DELETE_ROLE
        - MANAGE_COMMUNITY_STORY
    UserV3:
      type: object
      properties:
        _id:
          type: string
          description: Private ID of a user. (for real-time event)
        path:
          type: string
          description: Path of a user. (for real-time event)
        userId:
          type: string
        userInternalId:
          type: string
        userPublicId:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionEnum'
        displayName:
