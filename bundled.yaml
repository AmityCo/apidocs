      content:
        application/json:
          schema:
            properties:
              status:
                type: string
              data:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelV3'
                  channelUsers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelUserV3'
                  messageFeedsInfo:
                    type: array
                    description: Depends on messagePreviews. if empty array will be empty array.
                    items:
                      $ref: '#/components/schemas/messageFeedsInfo'
                  messagePreviews:
                    type: array
                    description: Depends on messagePreviewId. if null will be empty array.
                    items:
                      $ref: '#/components/schemas/MessagePreviews'
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserV3'
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'
                  totalCount:
                    type: number
                  paging:
                    type: object
                    properties:
                      next:
                        type: string
                      prev:
                        type: string
                  search:
                    type: object
                    properties:
                      query:
                        type: string
                        description: The search query.
                      limit:
                        type: integer
                        description: Limit on the number of results.
                      sortBy:
                        type: string
                        description: Sorting criteria (e.g., "relevance").
                      orderBy:
                        type: string
                        description: Sorting order (e.g., "desc").
