channelId:
  name: "channelId"
  in: "path"
  required: true
  schema:
    type: "string"

query:
  name: query
  in: query
  required: true
  description: Keyword for searching
  schema:
    type: string

exactMatch:
  name: exactMatch
  in: query
  required: false
  description: Flag to indicate exact match.
  schema:
    type: boolean
    default: false

isMemberOnly:
  name: isMemberOnly
  in: query
  required: false
  description: Flag to filter only member-only channels.
  schema:
    type: boolean
    default: false

types:
  name: types
  in: query
  required: false
  description: Array of channel types.
  schema:
    type: array
    items:
      type: string
      enum:
        - community
        - conversation
        - live
        - broadcast

tags:
  name: tags
  in: query
  required: false
  description: Array of channel tags.
  schema:
    type: array
    maxItems: 10
    items:
      type: string
      maxLength: 100

options:
  name: options
  in: query
  required: false
  description: Additional search options.
  schema:
    type: object
    properties:
      limit:
        type: number
        minimum: 1
        maximum: 100
        default: 20
      orderBy:
        type: string
        default: desc
        enum:
          - desc
          - asc
      sortBy:
        type: string
        enum:
          - lastActivity
          - relevance
        default: relevance
      token:
        type: string
        maxLength: 100
