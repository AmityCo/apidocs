MessageResponse:
  description: Message information.
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: string
          data:
            type: object
            properties:
              messages:
                type: array
                items:
                  $ref: "../../schema/message.yaml#/Message"
              users:
                type: array
                items:
                  $ref: "../../schema/user.yaml#/User"
MessageCallbackResponse:
  description: Message information.
  content:
    application/json:
      schema:
        type: object
        properties:
          messages:
            type: array
            items:
              $ref: "../../schema/message.yaml#/MessageForRealtimeEvent"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/User"

search-messages-response-payload-200:
  description: Search messages response
  content:
    application/json:
      schema:
        properties:
          status:
            type: string
          data:
            type: object
            properties:
              messages:
                type: array
                items:
                  $ref: "../../schema/message.yaml#/MessageV3"
              messageFeeds:
                type: array
                items:
                  $ref: "../../schema/message-feed.yaml#/MessageFeed"
              channels:
                type: array
                items:
                  $ref: "../../schema/channel.yaml#/ChannelV3"
              users:
                type: array
                items:
                  $ref: "../../schema/user.yaml#/UserV3"
              files:
                type: array
                items:
                  $ref: "../../schema/file.yaml#/File"
              roles:
                type: array
                items:
                  $ref: "../../schema/role.yaml#/RoleV3"
              totalCount:
                type: number
              paging:
                type: object
                properties:
                  next:
                    type: string
                  prev:
                    type: string
              search:
                type: object
                properties:
                  query:
                    type: string
                    description: The search query.
                  limit:
                    type: integer
                    description: Limit on the number of results.
                  sortBy:
                    type: string
                    description: Sorting criteria (e.g., "relevance" or "createdAt").
                  orderBy:
                    type: string
                    description: Sorting order (e.g., "desc").

