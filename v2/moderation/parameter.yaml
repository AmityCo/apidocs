authorization:
  name: "Authorization"
  in: "header"
  required: true
  schema:
    type: "string"

content-type:
  name: "Content-Type"
  in: "header"
  required: true
  schema:
    type: "string"

regexs:
  name: "regexs"
  in: "query"
  schema:
    type: "array"
    items:
      type: "string"

ruleIds:
  in: query
  name: ruleIds
  description: "Rules information to be deleted.\n"
  schema:
    type: "array"
    items:
      type: "string"

ruleId:
  in: path
  name: ruleId
  description: "Rule ID to be updated."
  required: true
  schema:
    type: string

category:
  name: "category"
  in: "query"
  description: "The category of block words to export. Defaults to content."
  required: false
  schema:
    type: "string"
    enum:
      - "content"
      - "user"
    default: "content"

sortBy:
  name: "sortBy"
  in: "query"
  description: "Sort order for blacklist rules."
  required: false
  schema:
    type: "string"
    enum:
      - "firstCreated"
      - "lastCreated"
      - "lastUpdated"
    default: "firstCreated"
