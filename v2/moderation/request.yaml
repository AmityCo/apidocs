records-put-request-payload:
  description: >
    Rules information to be refreshed. Replaces every rule of the given
    category with the list sent.
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          regexs:
            type: "array"
            maxItems: 20000
            items:
              type: "string"
          category:
            type: "string"
            enum:
              - "content"
              - "user"
            default: "content"
            description: >
              Which rule set the words belong to. `content` rules are matched
              against user-generated content, `user` rules are matched against
              user profile fields.
        required:
          - "regexs"

whitelist-records-put-request-payload:
  description: "Rules information to be refreshed.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          regexs:
            type: "array"
            items:
              type: "string"
        required:
          - "regexs"

records-post-request-payload:
  description: "Rules information to be added.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          regexs:
            type: "array"
            minItems: 1
            maxItems: 20000
            items:
              type: "string"
          isMatchExactWord:
            type: "boolean"
          category:
            type: "string"
            enum:
              - "content"
              - "user"
            default: "content"
            description: >
              Which rule set the words belong to. `content` rules are matched
              against user-generated content, `user` rules are matched against
              user profile fields.
        required:
          - "regexs"

whitelist-records-post-request-payload:
  description: "Rules information to be added.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          regexs:
            type: "array"
            items:
              type: "string"
        required:
          - "regexs"

records_ruleId-put-request-payload:
  description: "Rules information to be updated.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          ruleId:
            type: "string"
          isEnabled:
            type: "boolean"
        required:
          - "ruleId"
          - "isEnabled"

settings-put-request-payload:
  description: "moderation setting information\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          maxRepetition:
            type: "integer"
            minimum: 0
          maxRepetitionTimeout:
            type: "integer"
            minimum: 0
            maximum: 86400
            description: "Seconds. Maximum 86400 (24 hours)."
          blacklistMuteTimeout:
            type: "integer"
            minimum: 0
            maximum: 86400
            description: "Seconds. Maximum 86400 (24 hours)."
          whitelistMuteTimeout:
            type: "integer"
            minimum: 0
            maximum: 86400
            description: "Seconds. Maximum 86400 (24 hours)."
          maxRepetitionMuteTimeout:
            type: "integer"
            minimum: 0
          enableImageModeration:
            type: "boolean"
          imageModeration:
            type: "object"
            properties:
              nudity:
                type: "integer"
                minimum: 0
                maximum: 100
              suggestive:
                type: "integer"
                minimum: 0
                maximum: 100
              violence:
                type: "integer"
                minimum: 0
                maximum: 100
              disturbing:
                type: "integer"
                minimum: 0
                maximum: 100
