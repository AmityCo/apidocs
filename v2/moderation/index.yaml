blacklist-records:
  get:
    summary: "get rules of blacklist."
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    description: "Get rules of blacklist.\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
      - $ref: "./parameter.yaml#/regexs"
      - $ref: "./parameter.yaml#/category"
      - $ref: "./parameter.yaml#/sortBy"
    responses:
      200:
        $ref: "./response.yaml#/blacklist-records-get-response-payload-200"
      404:
        $ref: "../../global/error.yaml#/NotFoundError404"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"
  put:
    summary: "refresh rules of blacklist."
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    description: "Refresh rules of blacklist.\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
    requestBody:
      $ref: "./request.yaml#/records-put-request-payload"
    responses:
      200:
        description: "OK"
      404:
        $ref: "../../global/error.yaml#/NotFoundError404"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"
  post:
    summary: "add rules to blacklist."
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    description: "Add rules to blacklist. Returns 422 if the network has reached the maximum limit of block words.\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
    requestBody:
      $ref: "./request.yaml#/records-post-request-payload"
    responses:
      200:
        description: "OK"
      404:
        $ref: "../../global/error.yaml#/NotFoundError404"
      422:
        $ref: "../../global/error.yaml#/UnProcessableError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"
  delete:
    summary: "delete rules from blacklist"
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    description: "Delete rule from blacklist\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
      - $ref: "./parameter.yaml#/ruleIds"
    responses:
      200:
        description: "OK"
      404:
        $ref: "../../global/error.yaml#/NotFoundError404"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"

blacklist-records_ruleId:
  put:
    summary: "update rule of blacklist."
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    description: "Update rule of blacklist.\n"
    parameters:
      - $ref: "./parameter.yaml#/ruleId"
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
    requestBody:
      $ref: "./request.yaml#/records_ruleId-put-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/blacklist-records_ruleId-put-response-payload-200"
      404:
        $ref: "../../global/error.yaml#/NotFoundError404"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"

blacklist-export:
  get:
    summary: "Export blacklist rules as a text file."
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    description: "Export all blacklist rules for the network as a plain-text file, one word per line. Filtered by category.\n\nRequires admin authentication with the `ManageModerationSetting` permission.\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/category"
    responses:
      200:
        description: "Plain-text file with one blacklist word per line."
        headers:
          Content-Disposition:
            schema:
              type: "string"
            example: "attachment; filename=\"block-words-content.txt\""
        content:
          text/plain:
            schema:
              type: "string"
              example: "badword1\nbadword2\nbadword3\n"
      401:
        $ref: "../../global/error.yaml#/UnAuthorizedError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      422:
        $ref: "../../global/error.yaml#/UnProcessableError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"

