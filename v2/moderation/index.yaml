settings:
  get:
    summary: "get a moderation setting"
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    parameters:
      - $ref: "./parameter.yaml#/authorization"
    description: "Get a moderation setting.\n"
    responses:
      200:
        $ref: "./response.yaml#/settings-get-response-payload-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError400"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"
  put:
    summary: "update a moderation setting"
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    description: "Update a moderation setting\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
    requestBody:
      $ref: "./request.yaml#/settings-put-request-payload"
    responses:
      200:
        description: OK
        content:
          application/json:
            schema:
              type: "object"
              properties:
                status:
                  type: "string"
                code:
                  type: "string"
              example:
                status: "success"
                code: 200
      400:
        $ref: "../../global/error.yaml#/BadRequestError400"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"
