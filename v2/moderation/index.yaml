        $ref: "../../global/error.yaml#/NotFoundError404"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"
  put:
    summary: "refresh rules of blacklist."
    tags:
      - "Moderation"
    security:
      - ApiKeyAuth: []
    description: "Refresh rules of blacklist.\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
    requestBody:
      $ref: "./request.yaml#/records-put-request-payload"
    responses:
      200:
        description: "OK"
      404:
        $ref: "../../global/error.yaml#/NotFoundError404"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError500"
