Poll:
  type: object
  properties:
    pollId:
      type: string
    userId:
      type: string
    userInternalId:
      type: string
      example: "64be1f6cb9b4106b5a6bbf3f"
    userPublicId:
      type: string
      example: "User123"
    title:
      type: string
      maxLength: 150
      description: Poll title with maximum 150 characters
    question:
      type: string
      description: question.
    answers:
      type: array
      maxItems: 10
      items:
        type: object
        properties:
          dataType:
            type: string
            enum:
              - text
              - image
          data:
            type: string
          fileId: 
            description: image fileId, required only when dataType is image
            type: string
          voteCount:
            type: number
            default: 0
          isVotedByUser:
            type: boolean
            default: false
          id:
            type: string
            description: Option id
    answerType:
      type: string
    closedAt:
      type: string
    createdAt:
      type: string
    isVoted:
      type: boolean
      default: false
    status:
      type: string
      default: open
    closedIn:
      type: number

UsersAnswered:
  type: object
  properties:
    userId:
      type: string
    pollId:
      type: string
    answerIds:
      description: answer id
      type: array
      items:
        type: string
    createdAt:
      type: string
