File:
  type: object
  properties:
    fileId:
      type: string
      description: Root file key on cloud storage.
    fileUrl:
      type: string
      description: Http link for download file
    type:
      type: string
      description: File type.
      enum:
        - image
        - file
        - video
    accessType:
      type: string
      description: File access type. `network` type requires authentication to download.
      enum:
        - public
        - network
      default: public
    altText:
      type: string
      description: Alternative text for the file.
      maxLength: 180
    createdAt:
      type: string
      description: The date/time when a file is uploaded.
      format: date-time
    updatedAt:
      type: string
      description: The date/time when a file is updated.
      format: date-time
    attributes:
      type: object
      properties:
        name:
          type: string
          description: File name.
        extension:
          type: string
          description: File format.
        size:
          type: number
          description: File size.
        mimeType:
          type: string
          description: File mime-type.
        metadata:
          type: object
          description: File image metadata (width, height etc.).
          properties:
            exif:
              type: object
            gps:
              type: object
            height:
              type: number
            width:
              type: number
            isFull:
              type: boolean

VideoMetadata:
  type: object
  description: Video metadata extracted from the original uploaded file.
  properties:
    video:
      type: object
      properties:
        codec_name:
          type: string
          description: Video codec of the original file.
          example: HEVC
        width:
          type: number
          description: Encoded width in pixels (before rotation is applied).
          example: 1920
        height:
          type: number
          description: Encoded height in pixels (before rotation is applied).
          example: 1080
        duration:
          type: number
          description: Duration in seconds.
          example: 12.5
        bit_rate:
          type: number
          description: Bit rate in bits per second.
        avg_frame_rate:
          type: number
          description: Average frame rate.
          example: 29.97
        display_aspect_ratio:
          type: number
          description: Display aspect ratio.
        colour_primaries:
          type: string
          description: Colour primaries of the video.
          example: BT.709
        rotation:
          type: number
          description: >
            Rotation in degrees from the original file's metadata (e.g. 90, -90, 180).
            Omitted when the video has no rotation or was uploaded before this field
            was introduced. Width/height are encoded dimensions — apply rotation to
            determine display orientation. Transcoded/streaming renditions already
            have rotation applied.
          example: 90
    audio:
      type: object
      properties:
        codec_name:
          type: string
          description: Audio codec of the original file.
          example: AAC
        sample_rate:
          type: string
          description: Sample rate in Hz.
          example: "44100"
        duration:
          type: string
          description: Duration in seconds.
        bit_rate:
          type: string
          description: Bit rate in bits per second.
