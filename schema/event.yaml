Event:
  type: object
  properties:
    eventId:
      type: string
      description: Unique identifier for the event
    userId:
      type: string
      description: Public user ID of the event creator
    userInternalId:
      type: string
      description: Internal user ID of the event creator
    userPublicId:
      type: string
      description: Public (customer-facing) user ID of the event creator
    publisherId:
      type: string
      description: Public user ID the event was published on behalf of (impersonation). Absent otherwise.
    publisherInternalId:
      type: string
      description: Internal user ID of the publisher
    publisherPublicId:
      type: string
      description: Public (customer-facing) user ID of the publisher
    title:
      type: string
      description: Event title
      minLength: 1
      maxLength: 60
    description:
      type: string
      description: Event description
      maxLength: 1000
    type:
      type: string
      enum:
        - virtual
        - in_person
      description: Event type (virtual or in-person)
    status:
      type: string
      enum:
        - scheduled
        - live
        - ended
        - cancelled
      description: Current status of the event
    startTime:
      type: string
      format: date-time
      description: Event start time (ISO 8601 format)
    endTime:
      type: string
      format: date-time
      description: Event end time (ISO 8601 format)
    location:
      type: string
      description: Physical location address (for in-person events)
      maxLength: 200
    externalUrl:
      type: string
      description: External URL for virtual events (e.g., Zoom, Teams)
    coverImageFileId:
      type: string
      description: File ID of the cover image
    originId:
      type: string
      description: ID of the origin (community ID, or user ID when `originType` is `user`)
    originType:
      type: string
      enum:
        - community
        - user
      description: Origin type of the event
    discussionCommunityId:
      type: string
      description: ID of the event discussion community
    postId:
      type: string
      description: ID of the livestream post backing a `virtual` event. Absent for `in_person` events.
    path:
      type: string
      description: Hierarchy path of the event
    isOriginPublic:
      type: boolean
      description: Whether the origin community is public
    rsvpCount:
      type: integer
      description: Number of users who RSVP'd as 'going'
    interestedCount:
      type: integer
      description: Number of users who RSVP'd as 'interested'
    tags:
      type: array
      items:
        type: string
        maxLength: 100
      description: Event tags for categorization
      maxItems: 10
    metadata:
      type: object
      description: Additional metadata
    isDeleted:
      type: boolean
      description: Whether the event is deleted
    createdAt:
      type: string
      format: date-time
      description: Event creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: Event last update timestamp

EventRSVP:
  type: object
  properties:
    eventId:
      type: string
      description: ID of the event
    userId:
      type: string
      description: Public user ID of the user who RSVP'd
    userInternalId:
      type: string
      description: Internal user ID of the user who RSVP'd
    userPublicId:
      type: string
      description: Public (customer-facing) user ID of the user who RSVP'd
    status:
      type: string
      enum:
        - going
        - interested
        - not_going
      description: RSVP status
    respondedAt:
      type: string
      format: date-time
      description: When the user responded
    createdAt:
      type: string
      format: date-time
      description: RSVP creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: RSVP last update timestamp
