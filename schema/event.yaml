Event:
  type: object
  properties:
    eventId:
      type: string
      description: Unique identifier for the event (same as publicId)
    userId:
      type: string
      description: ID of the user who created the event
    title:
      type: string
      description: Event title
      minLength: 1
      maxLength: 60
    description:
      type: string
      description: Event description
      maxLength: 1000
    type:
      type: string
      enum:
        - virtual
        - in_person
      description: Event type (virtual or in-person)
    status:
      type: string
      enum:
        - scheduled
        - live
        - ended
        - cancelled
      description: Current status of the event
    isInviteOnly:
      type: boolean
      description: Whether the event is invite-only
    startTime:
      type: string
      format: date-time
      description: Event start time (ISO 8601 format)
    endTime:
      type: string
      format: date-time
      description: Event end time (ISO 8601 format)
    location:
      type: string
      description: Physical location address (for in-person events)
      maxLength: 200
    externalUrl:
      type: string
      description: External URL for virtual events (e.g., Zoom, Teams)
    coverImageFileId:
      type: string
      description: File ID of the cover image
    originId:
      type: string
      description: ID of the origin (communityId or userId)
    originType:
      type: string
      enum:
        - community
        - user
      description: Origin type of the event
    livestreamId:
      type: string
      description: ID of the livestream (for virtual events)
    isLocationVisible:
      type: boolean
      description: Whether the location is visible to attendees
    isOriginPublic:
      type: boolean
      description: Whether the origin (community/user) is public
    rsvpCount:
      type: integer
      description: Number of users who RSVP'd as 'going'
    interestedCount:
      type: integer
      description: Number of users who RSVP'd as 'interested'
    tags:
      type: array
      items:
        type: string
      description: Event tags for categorization
      maxItems: 5
    metadata:
      type: object
      description: Additional metadata
    isDeleted:
      type: boolean
      description: Whether the event is deleted
    createdAt:
      type: string
      format: date-time
      description: Event creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: Event last update timestamp

EventRSVP:
  type: object
  properties:
    eventId:
      type: string
      description: ID of the event
    userId:
      type: string
      description: ID of the user who RSVP'd
    status:
      type: string
      enum:
        - going
        - interested
        - not_going
      description: RSVP status
    respondedAt:
      type: string
      format: date-time
      description: When the user responded
    createdAt:
      type: string
      format: date-time
      description: RSVP creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: RSVP last update timestamp
