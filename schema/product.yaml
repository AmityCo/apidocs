Product:
  type: object
  properties:
    productId:
      type: string
      maxLength: 100
      description: Unique identifier for the product
    productName:
      type: string
      maxLength: 200
      description: Display name of the product
    productUrl:
      type: string
      format: uri
      description: Valid URL to the product
    status:
      $ref: '#/ProductStatus'
      description: Current status of the product
    price:
      type: number
      format: double
      minimum: 0
      description: Optional price of the product
    currency:
      type: string
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      description: Optional 3-letter ISO currency code (e.g., USD, EUR, THB)
    thumbnailUrl:
      type: string
      format: uri
      description: Optional image URL for the product thumbnail
    thumbnailMode:
      $ref: '#/ProductThumbnailImageMode'
      description: Display mode for thumbnail. Required if thumbnailUrl is provided
    importSource:
      $ref: '#/ProductImportSource'
      description: Source from which the product was imported
    createdBy:
      type: string
      description: Admin user ID who created the product
    updatedBy:
      type: string
      description: Admin user ID who last updated the product
    isDeleted:
      type: boolean
      description: Soft delete flag
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the product was created
    updatedAt:
      type: string
      format: date-time
      description: Timestamp when the product was last updated

ProductImportSource:
  type: string
  enum:
    - manual
    - csv
  description: Source from which the product was imported

ProductStatus:
  type: string
  enum:
    - active
    - inactive
  description: Current status of the product

ProductThumbnailImageMode:
  type: string
  enum:
    - aspect_fit
    - aspect_fill
  description: Display mode for product thumbnail image