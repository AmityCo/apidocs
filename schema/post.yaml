CreatePost:
  type: "object"
  properties:
    data:
      type: "object"
      properties:
        title:
          type: "string"
          maxLength: 150
          description: "Title of a post."
        text:
          type: "string"
          description: "data for text in post parent"
          example: "example text"
        streamId:
          type: "string"
          description: "video streaming id for create live streaming post"
          example: "81559bcc3a5bb3b6bbd69a83b89d337e"
        pollId:
          type: "string"
          description: "poll id for create poll post"
          example: "53a9fd8b5aaa1af6c5a1bbd245ce4a9b1627373735551"
    attachments:
      type: "array"
      items:
        type: "object"
        description: "attachment info"
        properties:
          fileId:
            type: "string"
            example: "57b916d38eaf8010caddfb7759a2d06c"
            description: "file id for attachment"
          type:
            type: "string"
            description: "attachment type"
            enum:
              - "image"
              - "file"
              - "video"
              - "clip"
          displayMode:
            type: "string"
            enum: ["fill", "fit"]
            description: "displayMode of the clip"
            example: "fill"
          isMuted:
            type: "boolean"
            description: "Whether the clip should be muted or not"
            example: "true"
    dataType:
      type: "string"
      example: "upstra.customtype"
      description: 'Must be in dot separated string format or system defined format (ex. "upstra.customtype", "com.eko.birthday", "liveStream")'
    targetType:
      type: "string"
      enum:
        - "user"
        - "community"
        - "content"
      default: "user"
      description: "where to create post to"
    targetId:
      type: "string"
      example: "public_user_id"
      description: "Resource public id depends on target type (ex. target type is community, target id will be community public id)"
    metadata:
      type: "object"
      example:
        anything: "you want"
    postId:
      type: "string"
      example: "postidiwant"
      description: "for specify public post id on post creation"
    tags:
      type: "array"
      minItems: 0
      maxItems: 5
      items:
        type: "string"
        description: "tags"
        maximum: 24
    hashtags:
      type: "array"
      minItems: 0
      maxItems: 30
      items:
        type: "string"
        maxLength: 100
        example: "tech_news"
      example:
        ["tech_news", "startup_life", "product_launch", "innovation_2025"]
      description: "Hashtags for the post."
    mentionees:
      type: "array"
      description: "The object of the mentions type and user who get a notification from the post."
      items:
        type: "object"
        properties:
          type:
            type: "string"
            example: "user"
            description: "type: * `user` - need to specific userIds and notification mentions individual user\n"
            enum:
              - "user"
          userIds:
            type: "array"
            example:
              - "userId1"
              - "userId2"
            description: "Array of UserId. if the mention type is a channel, doesn't send userIds"
            items:
              type: "string"
    createdAt:
      type: "string"
