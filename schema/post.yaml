PostV5:
  type: object
  properties:
    _id:
      type: string
      description: Private ID of a post. (for real-time event)
    path:
      type: string
      description: Path of a post. (for real-time event)
    postId:
      type: string
      description: ID of a post.
    parentPostId:
      type: string
      description: ID of a parent post.
    postedUserId:
      type: string
      description: ID of a creator.
    postedUserPublicId:
      type: string
      description: Public ID of a creator.
    postedUserInternalId:
      type: string
      description: Internal ID of a creator.
    publisherId:
      type: string
      description: ID of an original publisher when creating a post as brand.
    publisherPublicId:
      type: string
      description: Public ID of an original publisher when creating a post as brand.
    sharedUserId:
      type: string
      description: ID of a shared owner.
    sharedCount:
      type: integer
      description: number of shared post.
    targetId:
      type: string
      description: ID of a target.
    targetPublicId:
      type: string
      description: Public ID of a target.
    targetInternalId:
      type: string
      description: Internal ID of a target.
    targetType:
      type: string
      enum:
        - user
        - community
        - content
      description: Type of a target (user, community, content).
    dataType:
      type: string
      enum:
        - text
        - image
        - file
        - video
        - liveStream
        - clip
        - event
      description: Type of a post (ex. text, image, file, video, clip or anything in namespace like format (a.b.c.d)).
      default: text
    data:
      description: Body of a post. Can be different types based on content type.
      oneOf:
        - type: object
          title: normal post
          description: Standard post data (text, image, file, video)
          properties:
            title:
              type: string
              description: Title of a post.
            text:
              type: string
              description: post text.
            fileId:
              type: string
              description: file key on cloud storage (for image, file post).
            thumbnailFileId:
              type: string
              description: video thumbnail file id (for video post).
            videoFileId:
              type: object
              description: video file id for each quality (for video post).
              properties:
                original:
                  type: string
                  description: original file id
                low:
                  type: string
                  description: low video quality file id
                medium:
                  type: string
                  description: medium video quality file id
                high:
                  type: string
                  description: high video quality file id
            streamId:
              type: string
              description: parent video streaming id (for video streaming post) - must be a parent stream
        - type: object
          title: clip post
          description: clip post data
          properties:
            fileId:
              type: string
              description: file key on cloud storage.
            thumbnailId:
              type: string
              description: thumbnail file id.
            isMuted:
              type: boolean
              description: whether the video is muted.
              default: false
            displayMode:
              type: string
              description: display mode for the video.
              enum: ["fill", "fit"]
              default: "fill"
        - type: object
          title: event post
          description: >
            Event post data, carried by the child post only (`dataType: event`). The parent post of an
            event post has `dataType: text` and `structureType: event`.
          properties:
            eventId:
              type: string
              description: >
                ID of the referenced event. Matches `eventId` in the `events` collection of the response.
                Absent from `events` when the event has been deleted.
    metadata:
      type: object
      description: Additional properties to support custom fields.
    flagCount:
      type: integer
      description: The number of users that has read this post.
    hashFlag:
      type: object
      description: The flag for checking internally that this post is reported or not.
      properties:
        bits:
          type: integer
        hashes:
          type: integer
        hash:
          type: array
          items:
            type: string
    editedAt:
      type: string
      description: The date/time when text or metadata of post is updated.
      format: date-time
    createdAt:
      type: string
      description: The date/time when a post is created.
      format: date-time
    updatedAt:
      type: string
      description: The date/time when a post is updated or deleted.
      format: date-time
    reactions:
      type: object
      description: The mapping of reaction with reactionCounter.
      example:
        like: 1
    reactionsCount:
      type: integer
      description: The number of all reactions for this post.
      example: 1
    myReactions:
      type: array
      items:
        type: string
        example: like
      description: The list of my reactions to this post.
    commentsCount:
      type: integer
      description: The number of all comments for this post.
      example: 1
    comments:
      type: array
      items:
        type: string
        description: ID of a comment.
    children:
      type: array
      items:
        type: string
        description: ID of a children post.
    childrenNumber:
      type: integer
      description: The number of all children posts for this post.
    isDeleted:
      type: boolean
      default: false
      description: A flag to deleted a post.
    hasFlaggedComment:
      type: boolean
      default: false
      description: The flag for checking internally that comments inside post is reported or not.
    hasFlaggedChildren:
      type: boolean
      default: false
      description: The flag for checking internally that children post is reported or not.
    feedId:
      type: string
      description: Feed public id
    tags:
      type: array
      minItems: 0
      maxItems: 5
      items:
        type: string
        maxLength: 24
    hashtags:
      type: array
      minItems: 0
      maxItems: 30
      items:
        type: string
        maxLength: 100
        example: "video_content"
      example:
        [
          "video_content",
          "clips_feature",
          "multimedia_posts",
          "next_gen_social",
        ]
      description: Hashtags associated with the post.
    mentionees:
      type: array
      description: The object of the mentions type and user who get a notification from the post.
      items:
        type: object
        properties:
          type:
            type: string
            description: >
              type:
              * `user` - need to specific userIds and notification mentions individual user
            enum:
              - user
          userIds:
            type: array
            description: Array of UserId.
            items:
              type: string
          userPublicIds:
            type: array
            description: Array of UserPublicId.
            items:
              type: string
          userInternalIds:
            type: array
            description: Array of UserInternalId.
            items:
              type: string
    impression:
      type: integer
    reach:
      type: integer
    structureType:
      $ref: './shared.yaml#/StructureType'
  required:
    - postId
    - data

CreatePost:
  type: "object"
  properties:
    data:
      type: "object"
      description: "Body of a post"
      properties:
        title:
          type: "string"
          maxLength: 150
          description: "Title of a post."
        text:
          type: "string"
          maxLength: 50000
          description: "Text content of the post."
          example: "example text"
        fileId:
          type: "string"
          maxLength: 100
          description: "File ID for image/file post."
          example: "57b916d38eaf8010caddfb7759a2d06c"
        pollId:
          type: "string"
          maxLength: 100
          description: "Poll ID for create poll post."
          example: "53a9fd8b5aaa1af6c5a1bbd245ce4a9b1627373735551"
        streamId:
          type: "string"
          maxLength: 100
          description: "Video streaming ID for create live streaming post."
          example: "81559bcc3a5bb3b6bbd69a83b89d337e"
        roomId:
          type: "string"
          maxLength: 100
          description: "Room ID for room post."
        eventId:
          type: "string"
          maxLength: 100
          description: "Event ID for event post. Required when `dataType` is `event`."
    attachments:
      type: "array"
      maxItems: 10
      description: "Array of attachments."
      items:
        type: "object"
        description: "Attachment info"
        required:
          - fileId
          - type
        properties:
          fileId:
            type: "string"
            maxLength: 100
            example: "57b916d38eaf8010caddfb7759a2d06c"
            description: "File ID for attachment."
          type:
            type: "string"
            description: "Attachment type."
            enum:
              - "image"
              - "file"
              - "video"
          displayMode:
            type: "string"
            enum: ["fill", "fit"]
            default: "fit"
            description: "Display mode for the clip."
            example: "fit"
          isMuted:
            type: "boolean"
            default: false
            description: "Whether the video should be muted or not."
            example: false
    dataType:
      type: "string"
      example: "upstra.customtype"
      description: 'Accept "liveStream", "poll", "room", "event" or Custom type. Custom type must be in dot separated string format or system defined format (ex. "some.customtype", "com.foo.bar").'
    targetType:
      type: "string"
      enum:
        - "user"
        - "community"
        - "content"
      default: "user"
      description: "Where to create post to (default: user)."
    targetId:
      type: "string"
      maxLength: 900
      example: "public_user_id"
      description: "Resource public ID depends on target type (ex. target type is community, target ID will be community public ID)."
    metadata:
      type: "object"
      description: "Additional properties to support custom fields."
      example:
        anything: "you want"
    links: 
      $ref: './shared.yaml#/links'
    postId:
      type: "string"
      maxLength: 900
      example: "postidiwant"
      description: "For specify public post ID on post creation."
    tags:
      type: "array"
      minItems: 0
      maxItems: 5
      description: "Tags for the post"
      items:
        type: "string"
        maxLength: 24
        description: "Tag string"
    hashtags:
      type: "array"
      minItems: 0
      maxItems: 30
      description: "Hashtags for the post"
      items:
        type: "string"
        maxLength: 100
        example: "tech_news"
      example:
        ["tech_news", "startup_life", "product_launch", "innovation_2025"]
    mentionees:
      type: "array"
      maxItems: 2
      description: "The object of the mentions type and user who get a notification from the post (optional, max 2 items)."
      items:
        type: "object"
        required:
          - type
        properties:
          type:
            type: "string"
            example: "user"
            description: "Type: * `user` - need to specify userIds and notification mentions individual user\n"
            enum:
              - "user"
          userIds:
            type: "array"
            example:
              - "userId1"
              - "userId2"
            description: "Array of UserId (required if type is 'user')."
            items:
              type: "string"
    createdAt:
      type: "string"
      description: "The date/time when a post is created."
      format: "date-time"
      example: "2022-07-07T04:24:20.444Z"
    isDiscoverable:
      type: "boolean"
      description: "Set whether the post is discoverable in search and hashtag feeds (optional, default: true)."
      default: true
    eventId:
      type: "string"
      maxLength: 24
      description: "Event reference for room posts."
      example: "507f1f77bcf86cd799439011"
  required:
    - "data"
