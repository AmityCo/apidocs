BlacklistRule:
  type: "object"
  properties:
    ruleId:
      type: "string"
    regex:
      type: "string"
      description: "Rule of blacklist."
    isMatchExactWord:
      type: "boolean"
    isEnabled:
      type: "boolean"
      description: "A flag to enabled a rule."
    isDeleted:
      type: "boolean"
      description: "A flag to deleted a rule."
    createdAt:
      type: "string"
      description: "The date/time when a rule is created."
      format: "date-time"
    updatedAt:
      type: "string"
      description: "The date/time when a rule is updated or deleted."
      format: "date-time"
  required:
    - "regex"

WhitelistRule:
  type: "object"
  properties:
    ruleId:
      type: "string"
    regex:
      type: "string"
      description: "Rule of whitelist."
    isEnabled:
      type: "boolean"
      description: "A flag to enabled a rule."
    isDeleted:
      type: "boolean"
      description: "A flag to deleted a rule."
    createdAt:
      type: "string"
      description: "The date/time when a rule is created."
      format: "date-time"
    updatedAt:
      type: "string"
      description: "The date/time when a rule is updated or deleted."
      format: "date-time"
  required:
    - "regex"

ModerationSetting:
  type: "object"
  properties:
    maxRepetition:
      type: "integer"
    maxRepetitionTimeout:
      type: "integer"
    blacklistMuteTimeout:
      type: "integer"
    whitelistMuteTimeout:
      type: "integer"
    maxRepetitionMuteTimeout:
      type: "integer"
    enableImageModeration:
      type: "boolean"
    imageModeration:
      type: "object"
      properties:
        nudity:
          type: "number"
        suggestive:
          type: "number"
        violence:
          type: "number"
        disturbing:
          type: "number"
    createdAt:
      type: "string"
      description: "The date/time when a rule is created."
      format: "date-time"
    updatedAt:
      type: "string"
      description: "The date/time when a rule is updated or deleted."
      format: "date-time"

CheckNotes:
  type: "array"
  items:
    type: "object"
    properties:
      noteId:
        type: "string"
        description: "Unique identifier for the check note"
      userId:
        type: "string"
        description: "ID of the admin who created the note"
      action:
        type: "string"
        enum:
          - check
          - need-follow-up
          - add-note
        description: "Action type of the check note"
      note:
        type: "string"
        maxLength: 250
        description: "Optional note text (max 250 characters)"
      createdAt:
        type: "string"
        format: "date-time"
        description: "When the check note was created"
      updatedAt:
        type: "string"
        format: "date-time"
        description: "When the check note was last updated"

CheckStatus:
  type: "string"
  enum:
    - to-check
    - follow-up-needed
    - checked
  description: "Current check status of the content"

CreateCheckNote:
  type: "object"
  required:
    - action
  properties:
    action:
      type: "string"
      enum:
        - check
        - need-follow-up
        - add-note
      description: |
        Action to take on the content:
        - `check`: Mark content as checked
        - `need-follow-up`: Mark content as needing follow-up
        - `add-note`: Add a note without changing status
    note:
      type: "string"
      maxLength: 250
      description: "Optional note text (max 250 characters)"
