targetId:
  name: targetId
  in: query
  schema:
    type: string
    maxLength: 900
  description: ID of the target.

targetIds:
  name: targetIds
  in: query
  schema:
    type: array
    items:
      type: string
      maxLength: 900
  description: IDs of multiple targets to filter by.

creatorIds:
  name: creatorIds
  in: query
  schema:
    type: array
    items:
      type: string
      maxLength: 900
  description: Filter posts by their creator user IDs.

targetType:
  name: targetType
  in: query
  required: true
  schema:
    type: string
    enum:
      - community
      - user
      - content
      - all
  description: |
    Type of the target.
    * `community` - Community
    * `user` - User
    * `content` - Content
    * `all` - All

sortBy:
  name: sortBy
  in: query
  schema:
    type: string
    enum:
      - lastCreated
      - firstCreated
      - lastUpdated
      - firstUpdated
    default: lastCreated
  description: Sort order for posts.

hasFlag:
  name: hasFlag
  in: query
  schema:
    type: boolean
    default: null
  description: Filter by flag status

isDeleted:
  name: isDeleted
  in: query
  schema:
    type: boolean
    default: null
  description: Filter by deleted status

options.limit:
  name: options[limit]
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10
    example: options[limit]=5
    description: Page size

options.after:
  name: options[after]
  in: query
  schema:
    type: string
    maxLength: 24
    description: Cursor value to get records after

options.before:
  name: options[before]
  in: query
  schema:
    type: string
    maxLength: 24
    description: Cursor value to get records before

options.updatedAt:
  name: options[updatedAt]
  in: query
  schema:
    type: string
    maxLength: 30
    description: Use updatedAt when sorting by first or last updated

options.token:
  name: options[token]
  in: query
  schema:
    type: string
    maxLength: 1000
    example: options[token]=eyJza2lwIjoyMCwibGlABDFRffewfQ==
    description: Pagination token

feedType:
  name: feedType
  in: query
  schema:
    type: string
    enum:
      - reviewing
      - published
      - declined
    example: published
  description: Feed type to filter

dataTypes:
  name: dataTypes
  in: query
  schema:
    type: array
    minItems: 1
    maxItems: 10
    items:
      type: string
      maxLength: 100
      enum:
        - text
        - video
        - image
        - file
        - liveStream
        - poll
        - clip
        - audio
        - room
        - event
  description: |
    Post data type to filter (include child posts too). A custom data type in `a.b` form is also accepted.

    `event` is accepted on v5 only. As with `poll`, `liveStream` and `room`, the filter matches the
    child post, so `matchingOnlyParentPost=false` is required — the parent of an event post has
    `dataType: text`. Follow `parentPostId` to get the parent.

tags:
  name: tags
  in: query
  schema:
    type: array
    minItems: 0
    maxItems: 5
    items:
      type: string
      maximum: 24
  description: tags

matchingOnlyParentPost:
  name: matchingOnlyParentPost
  in: query
  schema:
    type: boolean
    default: true
  description: |
    An option to filter only parent post. If `true` will return only parent post, else will return both parent and child posts

includeMixedStructure:
  name: includeMixedStructure
  in: query
  schema:
    type: boolean
    default: false
  description: |
    An option to include mixed structure posts (posts that have different data types in parent and child posts)

useKeySetPagination:
  name: useKeySetPagination
  in: query
  schema:
    type: boolean
    default: true
  description: Use keyset (cursor) pagination instead of skip/limit pagination.

includeModerationDetails:
  name: includeModerationDetails
  in: query
  schema:
    type: boolean
  description: Include moderation details in the response.

includePostedFeed:
  name: includePostedFeed
  in: query
  schema:
    type: array
    maxItems: 2
    items:
      type: string
      enum:
        - user
        - community
  description: |
    Also include posts from the given feeds.
    * `user` - posts posted on a user feed
    * `community` - posts posted on a community feed

excludeEventDiscussion:
  name: excludeEventDiscussion
  in: query
  schema:
    type: boolean
  description: Exclude posts that belong to an event discussion.

isHidden:
  name: isHidden
  in: query
  schema:
    type: boolean
  description: Filter by hidden status. Only honoured for admin callers; ignored otherwise.

startDate:
  name: startDate
  in: query
  schema:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    example: "2026-01-31"
  description: |
    Admin only. Inclusive start of the `createdAt` range, as a calendar date (`YYYY-MM-DD`)
    interpreted in `timeZone`. Non-admin callers passing this get a permission error.

endDate:
  name: endDate
  in: query
  schema:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    example: "2026-02-28"
  description: |
    Admin only. Inclusive end of the `createdAt` range, as a calendar date (`YYYY-MM-DD`)
    interpreted in `timeZone`. Non-admin callers passing this get a permission error.

timeZone:
  name: timeZone
  in: query
  schema:
    type: string
    example: "Asia/Bangkok"
  description: |
    Admin only. IANA time zone used to resolve `startDate` / `endDate` into instants.
    Defaults to `UTC` when omitted. Non-admin callers passing this get a permission error.
