targetId:
  name: targetId
  in: query
  schema:
    type: string
    maxLength: 900
  description: ID of the target.

targetType:
  name: targetType
  in: query
  required: true
  schema:
    type: string
    enum:
      - community
      - user
      - content
  description: |
    Type of the target.
    * `community` - Community
    * `user` - User
    * `content` - Content

sortBy:
  name: sortBy
  in: query
  schema:
    type: string
    enum:
      - lastCreated
      - firstCreated
      - lastUpdated
      - firstUpdated
    default: lastCreated
  description: Sort order for posts.

hasFlag:
  name: hasFlag
  in: query
  schema:
    type: boolean
    default: null
  description: Filter by flag status

isDeleted:
  name: isDeleted
  in: query
  schema:
    type: boolean
    default: null
  description: Filter by deleted status

options:
  name: options
  in: query
  schema:
    type: object
    properties:
      after:
        type: string
        maxLength: 24
        description: Cursor value to get records after
      before:
        type: string
        maxLength: 24
        description: Cursor value to get records before
      updatedAt:
        type: string
        maxLength: 30
        description: use updatedAt when sorting by first or last updated
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: options[limit]=5
        description: Page size
      token:
        type: string
        maxLength: 1000
        example: options[token]=eyJza2lwIjoyMCwibGlABDFRffewfQ==
        description: Pagination token

feedType:
  name: feedType
  in: query
  schema:
    type: string
    enum:
      - reviewing
      - published
      - declined
    example: published
  description: Feed type to filter

dataTypes:
  name: dataTypes
  in: query
  schema:
    type: array
    minItems: 1
    maxItems: 6
    items:
      type: string
      maxLength: 100
      enum:
        - video
        - image
        - file
        - liveStream
        - poll
        - clip
  description: Post data type to filter (include child posts too).

tags:
  name: tags
  in: query
  schema:
    type: array
    minItems: 0
    maxItems: 5
    items:
      type: string
      maximum: 24
  description: tags

matchingOnlyParentPost:
  name: matchingOnlyParentPost
  in: query
  schema:
    type: boolean
    default: true
  description: |
    An option to filter only parent post. If `true` will return only parent post, else will return both parent and child posts
