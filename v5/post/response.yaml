  content:
    application/json:
      schema:
        type: object
        properties:
          posts:
            type: array
            items:
              $ref: "../../schema/post.yaml#/PostV5"
          postChildren:
            type: array
            items:
              $ref: "../../schema/post.yaml#/PostV4"
          comments:
            type: array
            items:
