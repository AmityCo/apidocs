topicId:
  name: "topicId"
  in: "query"
  required: true
  description: "The topic's public id (the slug set when the topic was created and used in the widget embed code)."
  schema:
    type: "string"
    example: "summer-picks"

limit:
  name: "limit"
  in: "query"
  description: "Maximum number of posts to return."
  schema:
    type: "integer"
    minimum: 1
    maximum: 100
    default: 10
