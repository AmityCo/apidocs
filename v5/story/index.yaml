me-global-story-targets:
  get:
    summary: Get global story targets
    description: Get global story targets. Return a list of story targets
    tags:
      - Story
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/seenState"
      - $ref: "./parameter.yaml#/limit"
      - $ref: "./parameter.yaml#/token"
    responses:
      200:
        description: Global Story Information
        content:
          application/json:
            schema:
              $ref: "../../v4/story/response.yaml#/GlobalStoryTargetsResponsePayload"
      500:
        description: Unexpected error.
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 500000
              message: Unexpected error
