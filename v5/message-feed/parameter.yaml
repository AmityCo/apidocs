_messageFeedId:
  name: messageFeedId
  in: path
  required: true
  description: Message feed ID
  schema:
    $ref: "../../schema/message-feed.yaml#/MessageFeed_messageFeedId"

messageFeedIds:
  name: "messageFeedIds"
  in: "query"
  required: true
  description: "List of message feed ID that needs to find (max=10) [messageFeedIds[]=messageFeedId1&messageFeedIds[]=messageFeedId2]"
  schema:
    $ref: "../../schema/message-feed.yaml#/MessageFeed_messageFeedIds"

_channelId:
  name: "channelId"
  in: "path"
  required: true
  description: "channel ID of message feed that needs to be find"
  schema:
    $ref: "../../schema/message-feed.yaml#/MessageFeed_channelId"

_creatorId:
  name: "creatorId"
  in: "path"
  required: true
  description: "ID of message feed creator"
  schema:
    description: Creator's ID
    type: string
    maxLength: 30
    example: 8aa313c8dbb00af911b07672

paging-options:
  name: options
  in: query
  description: |
    Pagination options

    **after**: string(30) : return documents after this message feed id

    **before**: string(30) : return documents before this message feed id

    **limit**: number(0, 100) default=10

    **sortBy**: lastContentTimestampDesc

    **token**: string(100) : This token will be generated by server using encryption of after, before, limit, sortBy. It would be returned in response payload (paging.next, paging.previous). The caller can send only token for getting data from previous or next page easily.
  schema:
    $ref: "../../schema/message-feed.yaml#/MessageFeed_pageOptions"

isDeleted:
  name: isDeleted
  in: query
  description: deleted flag of message feed
  schema:
    type: boolean
    default: false

permanent:
  name: permanent
  in: query
  schema:
    $ref: "../../schema/generic.yaml#/Generic_permanent"
