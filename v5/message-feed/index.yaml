root:
  post:
    tags:
      - "Message Feed"
    summary: "Add a new message feed"
    security:
      - BearerAuth: []
    description: "Add a new message feed"
    requestBody:
      $ref: "./request.yaml#/root-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/message-feed-response-200"
      404:
        description: "Not found error"
      422:
        description: "Parameters validation error"

_messageFeedId:
  get:
    tags:
      - "Message Feed"
    summary: "Find a message feed by ID"
    security:
      - BearerAuth: []
    description: "Return a single message feed"
    parameters:
      - $ref: "./parameter.yaml#/_messageFeedId"
    responses:
      200:
        $ref: "./response.yaml#/message-feed-response-200"
      404:
        description: "Not found error"
      422:
        description: "Parameters validation error"
  put:
    tags:
      - "Message Feed"
    summary: "Update a message feed"
    description: "Update an existing message feed except the default message feed"
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/_messageFeedId"
    requestBody:
      $ref: "./request.yaml#/_messageFeedId-put-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/message-feed-response-200"
      403:
        description: "Forbidden error"
      404:
        description: "Not found error"
      422:
        description: "Parameters validation error"
  delete:
    tags:
      - "Message Feed"
    summary: "Delete a message feed"
    security:
      - BearerAuth: []
    description: "Delete an existing message feed except the default message feed"
    parameters:
      - $ref: "./parameter.yaml#/_messageFeedId"
      - $ref: "./parameter.yaml#/permanent"
    responses:
      200:
        description: "Successful operation"
      403:
        description: "Forbidden error"
      404:
        description: "Not found error"
      422:
        description: "Parameters validation error"

channel_channelId:
  get:
    tags:
      - "Message Feed"
    summary: "Finds message feeds by channelId and multiple conditions"
    description: "Multiple conditions can be provided by query string"
    security:
      - BearerAuth: []
    operationId: "findMessageFeedsByConditions"
    parameters:
      - $ref: "./parameter.yaml#/_channelId"
      - $ref: "./parameter.yaml#/isDeleted"
      - $ref: "./parameter.yaml#/paging-options"
    responses:
      200:
        $ref: "./response.yaml#/paginated-message-feed-response-200"
      404:
        description: "Not found error"
      422:
        description: "Parameters validation error"

list:
  get:
    tags:
      - "Message Feed"
    security:
      - BearerAuth: []
    summary: "Find message feeds by list of ID's"
    description: "Multiple message feed id values can be provided with array format"
    parameters:
      - $ref: "./parameter.yaml#/messageFeedIds"
    responses:
      200:
        $ref: "./response.yaml#/message-feed-response-200"
      404:
        description: "Not found error"
      422:
        description: "Parameters validation error"

user_creatorId:
  get:
    tags:
      - "Message Feed"
    security:
      - BearerAuth: []
    summary: "Finds message feeds by creatorId and multiple conditions"
    description: "Conditions can be provided in query string"
    operationId: "findMessageFeedsByCreatorId"
    parameters:
      - $ref: "./parameter.yaml#/_creatorId"
      - $ref: "./parameter.yaml#/isDeleted"
      - $ref: "./parameter.yaml#/paging-options"
    responses:
      200:
        $ref: "./response.yaml#/message-feed-response-200"
      404:
        description: "Not found error"
      422:
        description: "Parameters validation error"
