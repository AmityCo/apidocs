limit:
  name: "limit"
  in: "query"
  schema:
    type: "integer"
    minimum: 1
    maximum: 100
    default: 10

token:
  name: "token"
  in: "query"
  schema:
    type: "string"
    minLength: 1
    maxLength: 1000

dataTypes:
  name: "dataTypes"
  in: "query"
  schema:
    type: "array"
    minItems: 1
    maxItems: 2
    items:
      type: "string"
      enum:
        - "video"
        - "clip"
      description:
        "dataTypes to specified, if we send 'video' to the API the feed will be from
        post with dataType=video only"
    description: "Post `dataTypes` to filter"

includeMixedStructure:
  name: "includeMixedStructure"
  in: "query"
  schema:
    type: "boolean"
    default: false
  description:
    "An option to include mixed structure posts (posts that have different data types
    in parent and child posts)"
