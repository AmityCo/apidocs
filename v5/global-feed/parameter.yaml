limit:
  name: "limit"
  in: "query"
  schema:
    type: "integer"
    minimum: 1
    maximum: 100
    default: 10

token:
  name: "token"
  in: "query"
  schema:
    type: "string"
    minLength: 1
    maxLength: 1000

dataType:
  name: "dataType"
  in: "query"
  optional: true
  schema:
    type: "string"
    enum:
      - "video"
      - "clip"
    description: "optional dataType to specified, if we send 'video' to the API the feed will be from 
      post with dataType=video only"

