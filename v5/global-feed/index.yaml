root:
  get:
    summary: "Get global feed."
    tags:
      - "Feed"
    security:
      - BearerAuth: []
    description: "Get posts from your wall,
      people you follow and communities you join sorted by custom ranking algorithm\n"
    parameters:
      - $ref: "./parameter.yaml#/limit"
      - $ref: "./parameter.yaml#/token"
      - $ref: "./parameter.yaml#/dataTypes"
      - $ref: "./parameter.yaml#/includeMixedStructure"
    responses:
      200:
        $ref: "./response.yaml#/root-get-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
