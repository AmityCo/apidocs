_userId:
  get:
    summary: "Query user feed v5"
    tags:
      - "Feed"
    security:
      - BearerAuth: []
    description: |
      Query the posts published on one user's feed.

      Event posts are returned on v5 only — identify them by `structureType: event`, not by
      `dataType`, and filter for them with `dataTypes[values][]=event` together with
      `matchingOnlyParentPost=false`, because the filter matches the child post while the parent
      carries `dataType: text`.

      Posts that belong to an event discussion are always left out of this feed.
    parameters:
      - $ref: "./parameter.yaml#/_userId"
      - $ref: "../post/parameter.yaml#/sortBy"
      - $ref: "../post/parameter.yaml#/isDeleted"
      - $ref: "../post/parameter.yaml#/hasFlag"
      - $ref: "../post/parameter.yaml#/dataTypes"
      - $ref: "../post/parameter.yaml#/matchingOnlyParentPost"
      - $ref: "../post/parameter.yaml#/includePostedFeed"
      - $ref: "../post/parameter.yaml#/includeMixedStructure"
      - $ref: "../post/parameter.yaml#/options.limit"
      - $ref: "../post/parameter.yaml#/options.token"
    responses:
      200:
        $ref: "../post/response.yaml#/post-pagination-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
