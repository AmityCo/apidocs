root-post-request-payload:
  description: "Information about user and devices that they use to connect. If displayName is provided, the user's display name is updated as well.\n\nIf userId doesn't exist, a new user will be created.\n\nauthToken needs to be passed when network option is set to secure.\n\naccessToken expires in 30 days by default.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userId:
            type: "string"
            minLength: 1
            maxLength: 50
            description: "Unique identifier for the user. Cannot start with 'ADMIN_' or 'DELETED_' prefixes."
          deviceId:
            type: "string"
            minLength: 1
            maxLength: 150
            description: "Unique identifier for the device"
          deviceInfo:
            type: "object"
            description: "Optional device information for analytics and debugging"
            properties:
              kind:
                type: "string"
                enum:
                  - "ios"
                  - "android"
                  - "web"
                  - "node"
                description: "Type of device/platform"
              model:
                type: "string"
                maxLength: 300
                description: "Device model information"
              sdkVersion:
                type: "string"
                maxLength: 30
                description: "SDK version being used"
          displayName:
            type: "string"
            maxLength: 100
            description: "User's display name (optional, will update user if provided)"
          profileHandle:
            type: "string"
            maxLength: 100
            description: "User's profile handle (optional, will update user if provided)"
          authToken:
            type: "string"
            description: "Authentication token from /api/v3/authentication/token or /api/v4/authentication/token (required for secure networks)"
            minLength: 1
            maxLength: 100
          userType:
            type: "string"
            enum:
              - "normal"
              - "guest"
              - "bot"
            default: "normal"
            description: |
              Type of user. Can be 'normal', 'guest', or 'bot'. Default is 'normal'.
              - 'normal': Regular user with full access.
              - 'guest': Read-only access user, typically for read-only use.
              - 'bot': Read-only access user, used for SEO bots.
        required:
          - "userId"
          - "deviceId"

guest-post-request-payload:
  description: "Information about guest user and devices that they use to connect. Guest users have read-only access and cannot perform write operations.\n\nIf userId doesn't exist, a new guest user will be created.\n\naccessToken expires in 30 days by default.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          deviceId:
            type: "string"
            minLength: 1
            maxLength: 150
            description: "Unique identifier for the device"
          deviceInfo:
            type: "object"
            description: "Optional device information for analytics and debugging"
            properties:
              kind:
                type: "string"
                enum:
                  - "ios"
                  - "android"
                  - "web"
                  - "node"
                description: "Type of device/platform"
              model:
                type: "string"
                maxLength: 300
                description: "Device model information"
              sdkVersion:
                type: "string"
                maxLength: 30
                description: "SDK version being used"
        required:
          - "deviceId"

bot-post-request-payload:
  description: "Information about bot user and devices that they use to connect. Bot users have read-only access and are typically used for SEO crawlers and automated systems.\n\nIf userId doesn't exist, a new bot user will be created.\n\naccessToken expires in 30 days by default.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          deviceId:
            type: "string"
            minLength: 1
            maxLength: 150
            description: "Unique identifier for the device"
          deviceInfo:
            type: "object"
            description: "Optional device information for analytics and debugging"
            properties:
              kind:
                type: "string"
                enum:
                  - "ios"
                  - "android"
                  - "web"
                  - "node"
                description: "Type of device/platform"
              model:
                type: "string"
                maxLength: 300
                description: "Device model information"
              sdkVersion:
                type: "string"
                maxLength: 30
                description: "SDK version being used"
        required:
          - "deviceId"
