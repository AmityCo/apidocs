name: publish

on:
  pull_request:
    types: [closed]
    branches:
      - develop

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'chore-bump-')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: version
        id: version
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: create tag
        id: tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PLATFORM_CHORES_TOKEN }}
          script: |
            github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ steps.version.outputs.version }}',
              message: 'Social+ API Documentation release version ${{ steps.version.outputs.version }}',
              object: context.sha,
              type: 'commit',
              tagger: {
                name: 'platform-butler',
                email: 'platform+github@social.plus'
              }
            })

      - name: create ref
        id: ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PLATFORM_CHORES_TOKEN }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.version.outputs.version }}',
              sha: context.sha
            })
