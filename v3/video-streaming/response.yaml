common-response-200:
  description: video streaming information
  content:
    application/json:
      schema:
        properties:
          videoStreamings:
            type: array
            items:
              $ref: "../../schema/video-streaming.yml#/VideoStreaming"
          videoStreamModerations:
            type: array
            items:
              $ref: "../../schema/video-streaming.yml#/VideoStreamingModeration"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"

root-get-response-200:
  description: list of video streaming
  content:
    application/json:
      schema:
        properties:
          results:
            type: object
            properties:
              videoStreamings:
                type: array
                items:
                  $ref: "../../schema/video-streaming.yml#/VideoStreaming"
              videoStreamModerations:
                type: array
                items:
                  $ref: "../../schema/video-streaming.yml#/VideoStreamingModeration"
              users:
                type: array
                items:
                  $ref: "../../schema/user.yaml#/UserV3"
              files:
                type: array
                items:
                  $ref: "../../schema/file.yaml#/File"
          paging:
            type: object
            properties:
              next:
                type: string
              prev:
                type: string

video-streaming-custom-notification-response:
  description: video streaming information
  type: object
  properties:
    videoStreamings:
      type: array
      items:
        $ref: "../../schema/video-streaming.yml#/VideoStreamingCustom"
    users:
      type: array
      items:
        $ref: "../../schema/user.yaml#/UserV3"
    files:
      type: array
      items:
        $ref: "../../schema/file.yaml#/File"

video-streaming-webhook-response:
  description: video streaming information
  content:
    application/json:
      schema:
        type: "object"
        properties:
          event:
            type: "string"
          data:
            type: object
            properties:
              videoStreamings:
                type: array
                items:
                  $ref: "../../schema/video-streaming.yml#/VideoStreaming"
              users:
                type: array
                items:
                  $ref: "../../schema/user.yaml#/UserV3"
              files:
                type: array
                items:
                  $ref: "../../schema/file.yaml#/File"

user-event-video-streaming-response-200:
  description: event is processed successfully
  content:
    application/json:
      schema:
        properties:
          ok:
            type: boolean
            example: true

video-streaming-banned-users-response:
  description: "List of banned users"
  content:
    application/json:
      schema:
        type: "object"
        properties:
          videoStreamingBannedUsers:
            type: "array"
            items:
              type: "object"
              required:
                - userId
                - banBy
                - userPublicId
                - banByPublicId
                - createdAt
              properties:
                userId:
                  type: "string"
                banBy:
                  type: "string"
                userPublicId:
                  type: "string"
                banByPublicId:
                  type: "string"
                createdAt:
                  type: "string"
                  format: "date-time"
          videoStreamings: 
            $ref: "../../schema/video-streaming.yml#/VideoStreaming"
          videoStreamingModerations:
            $ref: "../../schema/video-streaming.yml#/VideoStreamingModeration"
          users:
            $ref: "../../schema/user.yaml#/User"
          communities:
            $ref: "../../schema/community.yaml#/Community"
          posts:
            $ref: "../../schema/post.yaml#/PostV5"
          files:
            $ref: "../../schema/file.yaml#/File"
          paging:
            type: "object"
            properties: 
              next: 
                type: string
