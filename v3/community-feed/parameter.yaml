_communityId:
  name: "communityId"
  in: "path"
  required: true
  schema:
    type: "string"

sortBy:
  name: "sortBy"
  in: "query"
  schema:
    type: "string"
    enum:
      - "firstCreated"
      - "lastCreated"
      - "lastUpdated"
      - "firstUpdated"
    default: "lastCreated"

hasFlag:
  name: "hasFlag"
  in: "query"
  schema:
    type: "boolean"
    default: false
  description: "hasFlag:\n  * `null(default)` - Show all posts.\n  * `true` - Show only flagged post(or children) or has flagged comment.\n  * `false` - Show only no flagged post(and children) and has no flagged comment.\n"

isDeleted:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null

options:
  name: "options"
  in: "query"
  style: "deepObject"
  schema:
    type: "object"
    properties:
      limit:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 10
      token:
        type: "string"
        maxLength: 1000

dataTypes:
  name: "dataTypes"
  in: "query"
  schema:
    type: "array"
    minItems: 1
    maxItems: 4
    items:
      type: "string"
      enum:
        - "video"
        - "image"
        - "file"
        - "liveStream"
    description: "post data type to filter"
