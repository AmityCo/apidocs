root-post-request-payload:
  description: "Information of file to be created. It will be applied to every attachment. `file` and `files` must not be provided at the same time.\n"
  content:
    multipart/form-data:
      schema:
        type: "object"
        properties:
          files:
            type: "array"
            items:
              type: "string"
              format: "binary"
              description: "A list of file data, `file` is optional when this is provided."
            deprecated: true
          file:
            type: "array"
            items:
              type: "string"
              format: "binary"
              description: "A list of file data, `files` is optional when this is provided."
          fullImage:
            type: "boolean"
            nullable: true
          preferredFilename:
            type: "string"
            maxLength: 1024
          accessType:
            type: string
            description: File access type. `network` type requires authentication to download.
            enum:
              - public
              - network
            default: public
        required:
          - "file"

update-file-data:
  description: "information of a file to be updated."
  content:
    application/json:
      schema:
        type: "object"
        properties:
          fileId:
            type: string
            description: The ID of the file to be updated.
            required: true
          isUsed:
            type: boolean
            description: Indicates if the file is currently in use.
          altText:
            type: string
            description: Alternative text for the file.
          status:
            type: string
            enum:
              - uploading
              - done
              - error
              - removed
            description: The status of the file.
          videoUrl:
            type: string
            description: URL of the video if applicable.
          thumbnailFileId:
            type: string
            description: The ID of the thumbnail file.