x-server-key:
  name: "x-server-key"
  description: "Server key to authenticate the request"
  in: "header"
  required: true
  schema:
    type: "string"
    maxLength: 150

userId:
  name: "userId"
  description: "User ID to get token for"
  in: "query"
  schema:
    type: "string"
    maxLength: 100
