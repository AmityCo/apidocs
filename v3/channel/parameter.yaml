keyword:
  name: "keyword"
  in: "query"
  schema:
    type: "string"
    maxLength: 100

isDeleted:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "isDeleted:\n  * `null(default)` - Show both channel is actived and channel is inactived.\n  * `true` - Show channel is inactived only.\n  * `false` - Show channel is actived only.\n"

users-isDeleted:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "filter deleted members if isDeleted is null, will return both deleted and non-deleted members"

tags:
  name: "tags"
  in: "query"
  schema:
    type: "array"
    maxItems: 10
    items:
      type: "string"
      maxLength: 100
  description: "Used for querying channels by matching all specified tags. When a query includes multiple tags (e.g., `tags=['tag1', 'tag2', 'tag3']`), the system will return all channels that have all the specified tags."

excludeTags:
  name: "excludeTags"
  in: "query"
  schema:
    type: "array"
    maxItems: 10
    items:
      type: "string"
      maxLength: 100
  description: "Used for querying channels by excluding all specified tags. When a query includes multiple tags (e.g., `excludeTags=['tag1', 'tag2', 'tag3']`), the system will return all channels that do not have any of the specified tags."

excludeArchives:
  name: "excludeArchives"
  in: "query"
  schema:
    type: "boolean"
    default: false
  description: "excludeArchives:\n  * `false(default)` - Show all channels.\n  * `true` - Show channels that are not archived only.\n"

filter:
  name: "filter"
  in: "query"
  schema:
    type: "string"
    enum:
      - "all"
      - "member"
      - "notMember"
      - "flagged"
    default: "all"

users-filter:
  name: "filter"
  in: "query"
  schema:
    type: "string"
    enum:
      - "all"
      - "muted"
      - "banned"
      - "member&banned"
    default: "all"

types:
  name: "types"
  in: "query"
  schema:
    type: "array"
    maxItems: 10
    items:
      type: "string"
      enum:
        - "standard"
        - "private"
        - "conversation"
        - "broadcast"
        - "live"
        - "community"

userId:
  name: "userId"
  in: "query"
  schema:
    type: "string"
    maxLength: 100

userIds:
  in: query
  name: userIds
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      minLength: 1
      maxLength: 50
  description: list of user id

sortBy:
  name: "sortBy"
  in: "query"
  schema:
    type: "string"
    enum:
      - "lastActivity"
      - "lastCreated"
      - "firstCreated"
      - "displayName"
    default: "lastActivity"

users-sortBy:
  name: "sortBy"
  in: "query"
  schema:
    type: "string"
    enum:
      - "lastCreated"
      - "firstCreated"
      - "displayName"
    default: "lastCreated"

options:
  name: "options"
  in: "query"
  style: "deepObject"
  schema:
    type: "object"
    properties:
      limit:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 10
      token:
        type: "string"
        maxLength: 100

channelId:
  name: "channelId"
  in: "path"
  required: true
  schema:
    type: "string"

channelIds:
  name: "channelIds"
  in: "query"
  required: true
  schema:
    type: "array"
    maxItems: 10
    items:
      type: "string"
      maxLength: 50

role:
  in: query
  name: role
  schema:
    type: string
    minLength: 1
    maxLength: 900
  description: User id for revocation

roles:
  name: "roles"
  in: "query"
  schema:
    type: "array"
    minItems: 1
    maxItems: 20
    items:
      type: "string"
      minLength: 1
      maxLength: 900
  description: "Role to filter"
