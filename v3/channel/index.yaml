root:
  get:
    summary: "Query channel"
    tags:
      - "Channel"
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/keyword"
      - $ref: "./parameter.yaml#/isDeleted"
      - $ref: "./parameter.yaml#/tags"
      - $ref: "./parameter.yaml#/excludeTags"
      - $ref: "./parameter.yaml#/excludeArchives"
      - $ref: "./parameter.yaml#/filter"
      - $ref: "./parameter.yaml#/types"
      - $ref: "./parameter.yaml#/userId"
      - $ref: "./parameter.yaml#/sortBy"
      - $ref: "./parameter.yaml#/options"
    responses:
      200:
        $ref: "./response.yaml#/root-get-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/PermissionDeniedError"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  post:
    summary: "Create channel"
    tags:
      - "Channel"
    security:
      - BearerAuth: []
    requestBody:
      $ref: "./request.yaml#/root-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-channels-response-200"
      403:
        description: Error Response
        content:
          application/json:
            examples:
              ForbiddenAvatarError:
                $ref: "../../global/error-example.yaml#/ForbiddenAvatarError"
              PermissionDeniedError:
                $ref: "../../global/error-example.yaml#/PermissionDeniedError"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

