root-post-request-payload:
  description: "Information of channel to be created\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          channelId:
            type: "string"
            maxLength: 100
            description: "A unique identifier for the channel. Maximum length is 100 characters."
          type:
            type: "string"
            enum:
              - "community"
              - "live"
              - "broadcast"
            default: "community"
            description: "Type of the channel. Options are 'community', 'live', or 'broadcast'. Default is 'community'."
          displayName:
            type: "string"
            maxLength: 100
            description: "The display name for the channel. Maximum length is 100 characters."
          avatarFileId:
            type: "string"
            maxLength: 50
            description: "The ID of the file to be used as the channel's avatar. Maximum length is 50 characters."
          metadata:
            type: "object"
            description: "Additional metadata associated with the channel. Can include custom properties."
          tags:
            type: "array"
            maxItems: 10
            items:
              type: "string"
              maxLength: 100
            description: "List of tags associated with the channel. Maximum of 10 tags, each up to 100 characters long."
          userIds:
            type: "array"
            maxItems: 1000
            items:
              type: "string"
              maxLength: 50
            description: "List of user IDs to be added to the channel. Maximum of 1000 user IDs, each up to 50 characters long."
          isMuted:
            type: "boolean"
            description: "Indicates whether the channel is muted by default for all users."
          messageAutoDeleteEnabled:
            type: "boolean"
            description: "Indicates whether automatic deletion of messages is enabled for the channel."
          autoDeleteMessageByFlagLimit:
            type: "number"
            minimum: 1
            maximum: 1000
            description: "The number of flags required to automatically delete a message. Must be between 1 and 1000."
          isPublic:
            type: "boolean"
            description: "Indicates whether the channel is public and visible to all users."
          notificationMode:
            type: "string"
            enum:
              - default
              - silent
              - subscribe
            description: >
              The notification mode for the channel:
                * `default` - Automatically register push notifications.
                * `silent` - Do not send notifications.
                * `subscribe` - Send notifications only to subscribed users.
          videoStreamId:
            type: "string"
            description: "The ID of the live video stream. This is required when `postId` is provided. When provided, the channel will be associated with this live stream so that users can perform live chat and live reaction."
          postId:
            type: "string"
            description: "The ID of the post that `videoStreamId` belongs to. This required when `videoStreamId` is provided."

seen-post-request-payload:
  description: "Information of read sengment to be updated\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          channels:
            type: "array"
            items:
              type: "object"
              properties:
                channelId:
                  type: "string"
                  maxLength: 128
                  description: >
                    The unique identifier for the channel. This public ID is used to identify the specific channel
                    for which the readToSegment value is being updated.
                readToSegment:
                  type: "number"
                  minimum: 1
                  description: >
                    The readToSegment value indicates the last segment that has been read by the user in that channel.
                    This is used to track the user's progress in reading messages within the channel.
              required:
                - "channelId"
                - "readToSegment"
            description: >
              List of channels with their respective readToSegment values.
              Each channel object must include a channelId and the readToSegment value.
            example:
              - channelId: "67cfbbe1c5dbdcb2909935e5"
                readToSegment: 4
              - channelId: "67cfbbd7c5dbdcb2909935d0"
                readToSegment: 10
              - channelId: "67cfbbd7c5dbdcb2909935d1"
                readToSegment: 10

_channelId-post-request-payload:
  description: "Information of channel to be updated\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          displayName:
            type: "string"
            maxLength: 100
          avatarFileId:
            type: "string"
            maxLength: 50
          metadata:
            type: "object"
          tags:
            type: "array"
            maxItems: 10
            items:
              type: "string"
              maxLength: 100
          messageAutoDeleteEnabled:
            type: "boolean"
          autoDeleteMessageByFlagLimit:
            type: "number"
            minimum: 1
            maximum: 1000
          notificationMode:
            type: string
            enum:
              - default
              - silent
              - subscribe
            description: >
              Notification Mode:
                * `default` - Auto register push notification.
                * `silent` - Do not send notification.
                * `subscribe` - Send notification to subscribed users only.

_channelId-users-post-request-payload:
  description: "Information of channel\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userIds:
            type: "array"
            minItems: 1
            maxItems: 100
            items:
              type: "string"
              minLength: 1
              maxLength: 50
        required:
          - "userIds"

_channelId-users-roles-post-request-payload:
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          role:
            type: "string"
            minLength: 1
            maxLength: 100
          userIds:
            type: "array"
            minItems: 1
            maxItems: 100
            items:
              type: "string"
              minLength: 1
              maxLength: 50
        required:
          - "userIds"
          - "role"

conversation-post-request-payload:
  description: "Information of conversation channel to be created\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userIds:
            type: "array"
            maxItems: 10
            items:
              type: "string"
              maxLength: 50
          isDistinct:
            type: "boolean"
            default: true
          displayName:
            type: "string"
            maxLength: 100
          avatarFileId:
            type: "string"
            maxLength: 50
          metadata:
            type: "object"
          tags:
            type: "array"
            maxItems: 10
            items:
              type: "string"
              maxLength: 100
        required:
          - "userIds"

_channelId-seen-post-request-payload:
  description: "Segment of the message\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          readToSegment:
            type: "number"
        required:
          - "readToSegment"
