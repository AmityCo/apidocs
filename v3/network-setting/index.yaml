moderation:
  get:
    summary: "Get moderation configuration."
    tags:
      - "Network Setting"
    security:
      - BearerAuth: []
    description: "Using for get network moderation configuration.\n"
    responses:
      200:
        $ref: "./response.yaml#/moderation-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  put:
    summary: "Update moderation configuration."
    tags:
      - "Network Setting"
    security:
      - BearerAuth: []
    description: "Update moderation configuration.\n"
    requestBody:
      description: "information for a network setting\n"
      required: true
      content:
        application/json:
          schema:
            type: "object"
            properties:
              isWhitelistEnabled:
                type: "boolean"
                description: "`true` - Enabled whitelist validation.\n`false` - Disabled whitelist validation.\n"
              isReportEnabled:
                type: "boolean"
                description: "`true` - Enabled moderation activity report feature.\n`false` - Disabled moderation activity report feature.\n"
    responses:
      200:
        $ref: "./response.yaml#/moderation-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

