root-put-request-payload:
  description: "information for a network setting\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          networkId:
            type: "string"
          tierHandler:
            type: "string"
            maxLength: 200
          socialEnabled:
            type: "boolean"
          videoStreamingEnabled:
            type: "boolean"
          chatEnabled:
            type: "boolean"
          isWhitelistEnabled:
            type: "boolean"

chat-put-request-payload:
  description: "information for a network setting\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          isAllowMentionedChannelEnabled:
            type: "boolean"
            default: false
          messagePreviewSetting:
            type: object
            description: "Message preview setting"
            properties:
              enabled:
                type: boolean
                default: false
                description: "message preview feature enable or disable"
              isIncludeDeleted:
                type: boolean
                default: false
                description: "message preview can be a deleted message, if false return message preview without a deleted message"
            required:
              - enabled
          isAllowAdminViewConversationMessage:
            type: "boolean"
            default: true
          isAllowAdminManageConversationMessage:
            type: "boolean"
            default: true
          allowMemberToUpdateConversationChannel:
            type: "boolean"
            default: false
            description: "Allow conversation channel that has more than 2 member wide edit rights"

prehook-put-request-payload:
  description: >
    Information of a prehook to be updated.
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          enabled:
            type: boolean
          callbackUrl:
            type: string
            maxLength: 900
          defaultAction:
            type: string
            enum:
              - allow
              - deny
          regenerateKey:
            type: boolean
            description: An option for regenerating the secret key.

social-put-request-payload:
  description: "information for a network setting\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userPrivacySetting:
            type: "string"
            enum:
              - "public"
              - "private"
          isFollowWithRequestEnabled:
            type: "boolean"
            default: false
          isAllowEditPostWhenReviewingEnabled:
            type: "boolean"
          showOnlyMyFeed:
            type: "boolean"
            default: false
          showMyPost:
            type: "boolean"
          showEveryonePost:
            type: "boolean"
          showCommunityPost:
            type: "boolean"
          showFollowingPost:
            type: "boolean"
          isAllowMentionedChannelEnabled:
            type: "boolean"
          disallowNonMemberInteractInCommunity:
            type: "boolean"
          storyExpiryTimeMinutes:
            type: "integer"
            minimum: 60
            maximum: 1440
            default: 1440
          allowAllUserToCreateStory:
            type: "boolean"
            description: "Allow all user to create story (default will allow only user that have permission to create story)"
          allowJoinPrivateCommunity:
            type: "boolean"
            deprecated: true
            description: |
              Controls whether users can join private communities directly or need to be added by moderators.

              - `true` - Allow users to join private communities by themselves
              - `false` - Users need to be added to join private communities

              **⚠️ DEPRECATED NOTICE**

              Community moderators are now be able to respond whether to allow users to become members of private communities.
          maxGlobalPinnedPost:
            description: "Maximum number of global pinned post (only super admin)"
            type: "integer"
            minimum: 1
            maximum: 20
            default: 1

semantic-search-put-request-payload:
  description: "information for a network setting\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          postMinScore:
            type: "number"
            minimum: 0
            maximum: 1
          communityMinScore:
            type: "number"
            minimum: 0
            maximum: 1

users-put-request-payload:
  description: >
    Information of a users to be updated.
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          isAllowUpdateDisplayName:
            type: boolean
          fallbackRoleIds:
            type: array
            items:
              type: string
              maxLength: 10
            description: "When fallback role is enabled, these roles will be assigned to users who don't have any role in the network."

webhook-put-request-payload:
  description: "information for a network setting\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          webhookEnabled:
            type: "boolean"
            description: "`true` - User can register webhook for network and will receive a webhook.\n`false` - User won't be able to register webhook and won't receive a webhook.\n"

uikit-put-request-payload:
  description: UIKit config in json
  required: true
  content:
    application/json:
      schema:
        type: object
      example:
        config:
          preferred_theme: "default"
          theme:
            light:
              primary_color: "#1054DF"
              secondary_color: "#292B32"
              base_color: "#292B32"
              base_shade1_color: "#636878"
              base_shade2_color: "#898E9E"
              base_shade3_color: "#A5A9b5"
              base_shade4_color: "#EBECEF"
              alert_color: "#FA4D30"
              background_color: "#FFFFFF"
              base_inverse_color: "#000000"
              background_shade1_color: "#F6F7F8"
              highlight_color: "#1054DE"
            dark:
              primary_color: "#1054DE"
              secondary_color: "#292B32"
              base_color: "#EBECEF"
              base_shade1_color: "#A5A9B5"
              base_shade2_color: "#6E7487"
              base_shade3_color: "#40434E"
              base_shade4_color: "#292B32"
              alert_color: "#FA4D30"
              background_color: "#191919"
              base_inverse_color: "#FFFFFF"
              background_shade1_color: "#40434E"
              highlight_color: "#1054DE"

shareable-deep-links-post-request-payload:
  description: "Configuration for shareable deep links"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        required:
          - domain
          - patterns
        properties:
          domain:
            type: "string"
            maxLength: 100
            description: "The domain for the shareable deep links"
            example: "myapp.com"
          patterns:
            type: "object"
            properties:
              posts:
                type: "string"
                maxLength: 100
                description: "URL path for posts, {postId} is required (e.g., /posts/{postId})"
                example: "/posts/{postId}"
              communities:
                type: "string"
                maxLength: 100
                description: "URL path for communities, {communityId} is required (e.g., /communities/{communityId})"
                example: "/communities/{communityId}"
              users:
                type: "string"
                maxLength: 100
                description: "URL path for users, {userId} is required (e.g., /users/{userId})"
                example: "/users/{userId}"
              livestreams:
                type: "string"
                maxLength: 100
                description: "URL path for livestreams, {livestreamId} is required (e.g., /livestreams/{livestreamId})"
                example: "/livestreams/{livestreamId}"

