root-response-200:
  description: network setting configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/NetworkSetting"

social-response-200:
  description: Social configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/SocialNetworkSetting"

webhook-response-200:
  description: Webhook configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/WebhookNetworkSetting"

chat-response-200:
  description: Chat configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/ChatNetworkSetting"

moderation-response-200:
  description: Moderation configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/ModerationNetworkSetting"

feed-setting-response-200:
  description: Feed setting check configuration
  content:
    application/json:
      schema:
        description: The content
        type: object
        properties:
          feedSettings:
            type: array
            items:
              type: object
              properties:
                feedType:
                  type: string
                contentSettings:
                  type: array
                  items:
                    type: object
                    properties:
                      contentType:
                        type: string
                      allowed:
                        type: boolean
                      maxDurationSeconds:
                        type: number
                      transcodeConfig:
                        type: object
                        properties:
                          maxResolution:
                            type: string
                          minResolution:
                            type: string

prehook-get-response-200:
  description: Prehook configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/PrehookSetting"

prehook-put-response-200:
  description: Prehook configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/PrehookSettingWithSecretKey"

users-response-200:
  description: Users configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/UsersNetworkSetting"

public-users-response-200:
  description: Public users configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/PublicUsersNetworkSetting"

video-streaming-response-200:
  description: Video Streaming setting check configuration
  content:
    application/json:
      schema:
        description: Response for video streaming setting
        type: object
        properties:
          enabled:
            type: boolean
            description: This field is for enabling or disabling the video streaming feature.
          moderation:
            type: object
            description: This field is for moderation configuration.
            properties:
              enabled:
                type: boolean
                description: This field is for enabling or disabling the moderation feature.
              categories:
                type: array
                description: This field is for list of moderation categories.
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      description: This field is for moderation category names.
                      enum:
                        [
                          pornography,
                          violence,
                          prohibited,
                          inappropriate,
                          profanity,
                        ]
                    flagThreshold:
                      type: number
                      description: This field is for flag threshold.
                      minimum: 0
                      maximum: 1
                    terminateThreshold:
                      type: number
                      description: This field is for terminate threshold.
                      minimum: 0
                      maximum: 1

semantic-search-response-200:
  description: Semantic Search configuration
  content:
    application/json:
      schema:
        $ref: "../../schema/network-setting.yaml#/SemanticSearchNetworkSetting"

uikit-response-200:
  description: UIKit configuration
  content:
    application/json:
      schema:
        description: UIKit config json
        type: object
      example:
        config:
          preferred_theme: "default"
          theme:
            light:
              primary_color: "#1054DF"
              secondary_color: "#292B32"
              base_color: "#292B32"
              base_shade1_color: "#636878"
              base_shade2_color: "#898E9E"
              base_shade3_color: "#A5A9b5"
              base_shade4_color: "#EBECEF"
              alert_color: "#FA4D30"
              background_color: "#FFFFFF"
              base_inverse_color: "#000000"
              background_shade1_color: "#F6F7F8"
              highlight_color: "#1054DE"
            dark:
              primary_color: "#1054DE"
              secondary_color: "#292B32"
              base_color: "#EBECEF"
              base_shade1_color: "#A5A9B5"
              base_shade2_color: "#6E7487"
              base_shade3_color: "#40434E"
              base_shade4_color: "#292B32"
              alert_color: "#FA4D30"
              background_color: "#191919"
              base_inverse_color: "#FFFFFF"
              background_shade1_color: "#40434E"
              highlight_color: "#1054DE"

shareable-deep-links-response-200:
  description: Shareable deep links configuration
  content:
    application/json:
      schema:
        type: "object"
        required:
          - domain
          - patterns
        properties:
          domain:
            type: "string"
            maxLength: 100
            description: "The domain for the shareable deep links"
            example: "myapp.com"
          patterns:
            type: "object"
            properties:
              posts:
                type: "string"
                maxLength: 100
                description: "URL path for posts, {postId} is required (e.g., /posts/{postId})"
                example: "/posts/{postId}"
              communities:
                type: "string"
                maxLength: 100
                description: "URL path for communities, {communityId} is required (e.g., /communities/{communityId})"
                example: "/communities/{communityId}"
              users:
                type: "string"
                maxLength: 100
                description: "URL path for users, {userId} is required (e.g., /users/{userId})"
                example: "/users/{userId}"
              livestreams:
                type: "string"
                maxLength: 100
                description: "URL path for livestreams, {livestreamId} is required (e.g., /livestreams/{livestreamId})"
                example: "/livestreams/{livestreamId}"

security-configs-response-200:
  description: Security configuration
  content:
    application/json:
      schema:
        type: "object"
        properties:
          securityConfigs:
            type: "object"
            properties:
              serverKey:
                type: "object"
                properties:
                  expiresInHours:
                    type: "number"
                    description: "Server key expiration time in hours"
                  apiScopeEnabled:
                    type: "boolean"
                    description: "Whether API scope is enabled for server key"
              adminToken:
                type: "object"
                properties:
                  expiresInHours:
                    type: "number"
                    description: "Admin token expiration time in hours"
        example:
          securityConfigs:
            serverKey:
              expiresInHours: 168
              apiScopeEnabled: true
            adminToken:
              expiresInHours: 24

push-notification-response-200:
  description: Push notification configuration
  content:
    application/json:
      schema:
        type: object
        properties:
          iOSMutableContent:
            type: boolean
            description: Enable or disable iOS mutable content for push notifications
          notifyWhenLiveStart:
            type: boolean
            description: "Whether to immedieatly sent a push notification when the stream is started (true), or sent a push notificaiton when the stream is attached to a post (false)"


