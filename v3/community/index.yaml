root:
  get:
    summary: "query communities."
    tags:
      - "Community"
    security:
      - BearerAuth: []
    description: "query communities.\n"
    parameters:
      - $ref: "./parameter.yaml#/keyword"
      - $ref: "./parameter.yaml#/tags"
      - $ref: "./parameter.yaml#/filter"
      - $ref: "./parameter.yaml#/categoryId"
      - $ref: "./parameter.yaml#/sortBy"
      - $ref: "./parameter.yaml#/isDeleted"
      - $ref: "./parameter.yaml#/hasFlag"
      - $ref: "./parameter.yaml#/options"
    responses:
      200:
        $ref: "./response.yaml#/common-get-response-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  post:
    summary: "create a community."
    tags:
      - "Community"
    security:
      - BearerAuth: []
    requestBody:
      $ref: "./request.yaml#/root-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      403:
        description: Error Response
        content:
          application/json:
            examples:
              ForbiddenError:
                $ref: "../../global/error-example.yaml#/ForbiddenError"
              DuplicateEntryError:
                $ref: "../../global/error-example.yaml#/DuplicateEntryError"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

