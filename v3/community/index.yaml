recommended:
  get:
    summary: "get list of recommended community"
    tags:
      - "Community"
    security:
      - BearerAuth: []
    description: "Get list of recommended community\n"
    parameters:
      - $ref: "./parameter.yaml#/content-type"
      - name: "options"
        in: "query"
        style: "deepObject"
        schema:
          type: "object"
          properties:
            limit:
              type: "integer"
              minimum: 1
              maximum: 100
              default: 5
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

