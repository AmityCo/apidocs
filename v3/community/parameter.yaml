keyword:
  name: "keyword"
  in: "query"
  schema:
    type: "string"
    minLength: 0
    maxLength: 100

tags:
  name: "tags"
  in: "query"
  schema:
    type: "array"
    maxItems: 10
    items:
      type: "string"
      minLength: 1
      maxLength: 1000
  description: "Used for querying communities by matching all specified tags. When a query includes multiple tags (e.g., `tags=['tag1', 'tag2', 'tag3']`), the system will return all communities that have all the specified tags."

filter:
  name: "filter"
  in: "query"
  schema:
    type: "string"
    enum:
      - "all"
      - "member"
      - "notMember"
    default: "all"

categoryId:
  name: "categoryId"
  in: "query"
  schema:
    type: "string"
    minLength: 50
    maxLength: 50

sortBy:
  name: "sortBy"
  in: "query"
  description: >
    The default value depends on the 'search' parameter.
      * If 'search' parameter is not set, the default value is 'lastCreated'.
      * If 'search' parameter is set, the default value is 'displayName'.
  schema:
    type: "string"
    enum:
      - "firstCreated"
      - "lastCreated"
      - "displayName"
    default: "lastCreated"

isDeleted:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "isDeleted:\n  * `null(default)` - Show both community is actived and community is inactived.\n  * `true` - Show community is inactived only.\n  * `false` - Show community is actived only.\n"

isDeleted-users:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "filter deleted members if isDeleted is null, will return both deleted and non-deleted members"

isBrand:
  name: "isBrand"
  in: "query"
  schema:
    type: "boolean"
  description: |
    Filter brand user <br>
    ```undefined``` - return all user <br>
    ```true``` - return only brand user <br>
    ```false``` - return only non-brand user

hasFlag:
  name: "hasFlag"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "hasFlag:\n    * `null(default)` - Show all communities.\n    * `true` - Show only community has flagged post(or children post) or has flagged comment.\n    * `false` - Show only community has no flagged post(and children post) and has no flagged comment.\n"

options:
  name: "options"
  in: "query"
  style: "deepObject"
  schema:
    type: "object"
    properties:
      limit:
        type: "integer"
        minimum: 1
        maximum: 100
      token:
        type: "string"
        maxLength: 1000

communityId:
  name: "communityId"
  in: "path"
  required: true
  schema:
    type: "string"
    minLength: 1
    maxLength: 900

communityIds:
  name: "communityIds"
  in: "query"
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      maxLength: 50

type:
  name: "type"
  in: "query"
  schema:
    type: "string"
    enum:
      - "public"
      - "internal"
    default: "public"
  description: "type of communityId"

memberships:
  name: "memberships"
  in: "query"
  schema:
    type: "array"
    description: "Membership type to filter (If not filter will return both banned user and member)"
    minItems: 1
    maxItems: 2
    items:
      type: "string"
      enum:
        - "banned"
        - "member"

role:
  in: query
  name: role
  required: true
  schema:
    type: string
    minLength: 1
    maxLength: 900

roles:
  name: "roles"
  in: "query"
  description: "Role to filter"
  schema:
    type: "array"
    minItems: 1
    maxItems: 20
    items:
      type: "string"
      minLength: 1
      maxLength: 100

search:
  name: "search"
  description: "Input text for searching display name and user id"
  in: "query"
  schema:
    type: "string"
    maxLength: 10000

userIds:
  in: query
  name: userIds
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      minLength: 1
      maxLength: 50
  description: list of user id

content-type:
  name: "Content-Type"
  in: "header"
  required: true
  schema:
    type: "string"
