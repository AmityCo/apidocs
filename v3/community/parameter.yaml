keyword:
  name: "keyword"
  in: "query"
  schema:
    type: "string"
    minLength: 0
    maxLength: 100

tags:
  name: "tags"
  in: "query"
  schema:
    type: "array"
    maxItems: 10
    items:
      type: "string"
      minLength: 1
      maxLength: 1000
  description: "Used for querying communities by matching all specified tags. When a query includes multiple tags (e.g., `tags=['tag1', 'tag2', 'tag3']`), the system will return all communities that have all the specified tags."

filter:
  name: "filter"
  in: "query"
  schema:
    type: "string"
    enum:
      - "all"
      - "member"
      - "notMember"
    default: "all"
  description: |

categoryId:
  name: "categoryId"
  in: "query"
  schema:
    type: "string"
    minLength: 50
    maxLength: 50

sortBy-communities:
  name: "sortBy"
  in: "query"
  description: >
    The default value depends on the 'search' parameter.
      * If 'search' parameter is not set, the default value is 'lastCreated'.
      * If 'search' parameter is set, the default value is 'displayName'.
  schema:
    type: "string"
    enum:
      - "firstCreated"
      - "lastCreated"
      - "displayName"
    default: "lastCreated"

sortBy-comm-users:
  name: "sortBy"
  in: "query"
  description: >
    The default value depends on the `search` parameter. <br>
      * If `search` parameter is not set, the default value is `lastCreated`.
      * If `search` parameter is set, the default value is `displayName`.
  schema:
    type: "string"
    enum:
      - "firstCreated"
      - "lastCreated"
      - "displayName"
      - "profileHandle"
      - "lastJoin"
      - "firstJoin"
    default: "lastCreated"
  examples:
    lastCreated:
      summary: Sort by creation date (newest first)
      value: lastCreated
    displayName:
      summary: Sort by display name (alphabetical order)
      value: displayName

isDeleted:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "isDeleted:\n  * `null(default)` - Show both community is actived and community is inactived.\n  * `true` - Show community is inactived only.\n  * `false` - Show community is actived only.\n"

isDeleted-users:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "filter deleted members if isDeleted is null, will return both deleted and non-deleted members"

isBrand:
  name: "isBrand"
  in: "query"
  schema:
    type: "boolean"
  description: |
    Filter brand user <br>
    ```undefined``` - return all user <br>
    ```true``` - return only brand user <br>
    ```false``` - return only non-brand user

hasFlag:
  name: "hasFlag"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "hasFlag:\n    * `null(default)` - Show all communities.\n    * `true` - Show only community has flagged post(or children post) or has flagged comment.\n    * `false` - Show only community has no flagged post(and children post) and has no flagged comment.\n"

options.limit:
  name: options[limit]
  in: query
  description: Number of results per page (1-100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

options.token:
  name: options[token]
  in: query
  description: Pagination token for getting next/previous pages
  schema:
    type: string
    maxLength: 1000

communityId:
  name: "communityId"
  in: "path"
  required: true
  schema:
    type: "string"
    minLength: 1
    maxLength: 900

communityIds:
  name: "communityIds"
  in: "query"
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      maxLength: 50

type:
  name: "type"
  in: "query"
  schema:
    type: "string"
    enum:
      - "public"
      - "internal"
    default: "public"
  description: "type of communityId"

memberships:
  name: "memberships"
  in: "query"
  schema:
    type: "array"
    description: "Membership type to filter (If not filter will return both banned user and member)"
    minItems: 1
    maxItems: 2
    items:
      type: "string"
      enum:
        - "banned"
        - "member"

role:
  in: query
  name: role
  required: true
  schema:
    type: string
    minLength: 1
    maxLength: 900

roles:
  name: "roles"
  in: "query"
  description: "Filter users by their community roles"
  schema:
    type: "array"
    minItems: 1
    maxItems: 20
    items:
      type: "string"
      minLength: 1
      maxLength: 100

search:
  name: "search"
  description: "Keyword to search for in user information such as displayName, profileHandle, and userId. The search is case-insensitive and supports partial matches."
  in: "query"
  schema:
    type: "string"
    maxLength: 10000

searchBy:
  name: "searchBy"
  in: "query"
  schema:
    type: "array"
    maxItems: 3
    items:
      type: "string"
      enum:
        - "displayName"
        - "profileHandle"
        - "userId"
      default: ["displayName", "profileHandle", "userId"]
  examples:
    singleField:
      summary: Search by display name
      value: [displayName]
    multipleFields:
      summary: Search by userId and profileHandle
      value: [userId, profileHandle]
  description: |
    Fields to search community users for the search keyword **(must be used with a search parameter)**, Default is all three fields <br>
      * `displayName` - Search by display name. When using with `sortBy` parameter the applicable sort order is `displayName`, `lastCreated` or `firstCreated`. Default to `lastCreated`.<br>
      * `profileHandle` - Search by profile handle, when using with `sortBy` parameter the applicable sort order is `profileHandle`, `lastCreated` or `firstCreated`. Default to `lastCreated`.<br>
      * `userId` - Search by user id, when using with `sortBy` parameter the applicable sort order is `lastCreated`, `firstCreated` or `displayName`. Default to `lastCreated`.<br>

userIds:
  in: query
  name: userIds
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      minLength: 1
      maxLength: 50
  description: list of user id

content-type:
  name: "Content-Type"
  in: "header"
  required: true
  schema:
    type: "string"

includeDiscoverablePrivateCommunity:
  name: "includeDiscoverablePrivateCommunity"
  in: "query"
  description: "If true, include discoverable private communities in the response. Default is false."
  schema:
    type: "boolean"

isDiscoverable:
  name: "isDiscoverable"
  in: "query"
  # description: ""
  schema:
    type: "boolean"
    default: false
