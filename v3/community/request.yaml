root-post-request-payload:
  description: "information of a community to be created.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          displayName:
            type: "string"
            minLength: 1
            maxLength: 1000
          isPublic:
            type: "boolean"
            default: true
          isOfficial:
            type: "boolean"
            default: false
          onlyAdminCanPost:
            type: "boolean"
            default: false
          description:
            type: "string"
            minLength: 1
            maxLength: 5000
          tags:
            type: "array"
            minItems: 1
            maxItems: 10
            items:
              type: "string"
              minLength: 1
              maxLength: 100
          metadata:
            type: "object"
          avatarFileId:
            type: "string"
            maxLength: 50
            minLength: 1
          userIds:
            type: "array"
            minItems: 1
            maxItems: 1000
            items:
              type: "string"
              minLength: 1
              maxLength: 900
          categoryIds:
            type: "array"
            minItems: 1
            maxItems: 10
            items:
              type: "string"
              minLength: 1
              maxLength: 50
          isUniqueDisplayName:
            type: "boolean"
            default: false
          needApprovalOnPostCreation:
            type: "boolean"
            default: false
          allowCommentInStory:
            type: "boolean"
            default: true
          notificationMode:
            type: string
            enum:
              - default
              - silent
              - subscribe
            description: >
              Notification Mode:
                * `default` - Auto register push notification.
                * `silent` - Do not send notification.
                * `subscribe` - Send notification to subscribed users only.
        required:
          - "displayName"

_communityId-put-request-payload:
  description: "community information.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          communityId:
            type: "string"
            minLength: 1
            maxLength: 900
          displayName:
            type: "string"
            minLength: 1
            maxLength: 1000
          isPublic:
            type: "boolean"
          isOfficial:
            type: "boolean"
          onlyAdminCanPost:
            type: "boolean"
          description:
            type: "string"
            minLength: 0
            maxLength: 5000
          tags:
            type: "array"
            minItems: 1
            maxItems: 10
            items:
              type: "string"
              minLength: 1
              maxLength: 100
          metadata:
            type: "object"
          avatarFileId:
            type: "string"
            maxLength: 50
            minLength: 1
          categoryIds:
            type: "array"
            minItems: 1
            maxItems: 10
            items:
              type: "string"
              minLength: 1
              maxLength: 50
          isUniqueDisplayName:
            type: "boolean"
            default: false
          needApprovalOnPostCreation:
            type: "boolean"
            default: false
          allowCommentInStory:
            type: "boolean"
            default: true
          notificationMode:
            type: string
            enum:
              - default
              - silent
              - subscribe
            description: >
              Notification Mode:
                * `default` - Auto register push notification.
                * `silent` - Do not send notification.
                * `subscribe` - Send notification to subscribed users only.
        required:
          - "communityId"

_communityId-users-post-request-payload:
  description: "information of a community.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userIds:
            type: "array"
            minItems: 1
            maxItems: 100
            items:
              type: "string"
              minLength: 1
              maxLength: 50
        required:
          - "userIds"

_communityId-users-put-request-payload:
  description: "condition for querying\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userIds:
            type: "array"
            minItems: 1
            maxItems: 100
            items:
              type: "string"
              minLength: 1
              maxLength: 900
        required:
          - "userIds"

_communityId-users-roles-post-request-payload:
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          role:
            type: "string"
            minLength: 1
            maxLength: 100
          userIds:
            type: "array"
            minItems: 1
            maxItems: 100
            items:
              type: "string"
              minLength: 1
              maxLength: 50
        required:
          - "userIds"
          - "role"
