common-response-200:
  description: Communities Information
  content:
    application/json:
      schema:
        type: object
        properties:
          communities:
            type: array
            items:
              $ref: "../../schema/community.yaml#/Community"
          communityUsers:
            type: array
            items:
              $ref: "../../schema/community.yaml#/CommunityUser"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          categories:
            type: array
            items:
              $ref: "../../schema/community.yaml#/CommunityCategory"
          feeds:
            type: array
            items:
              $ref: "../../schema/feed.yaml#/Feed"

common-get-response-200:
  description: Community Users Information
  content:
    application/json:
      schema:
        type: object
        properties:
          communities:
            type: array
            items:
              $ref: "../../schema/community.yaml#/Community"
          communityUsers:
            type: array
            items:
              $ref: "../../schema/community.yaml#/CommunityUser"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          categories:
            type: array
            items:
              $ref: "../../schema/community.yaml#/CommunityCategory"
          feeds:
            type: array
            items:
              $ref: "../../schema/feed.yaml#/Feed"
          paging:
            type: object
            properties:
              next:
                type: string
              previous:
                type: string

_communityId-permissions-me-get-response-200:
  description: "Communities permission information for this user"
  content:
    application/json:
      schema:
        type: "object"
        properties:
          isCreator:
            type: "boolean"
            example: false
            description: "Is this person create this community?"
          permissions:
            type: "array"
            items:
              $ref: "../../schema/role.yaml#/PermissionEnum"

CommunityWebhookResponse:
  description: Community Information
  content:
    application/json:
      schema:
        type: object
        properties:
          event:
            type: string
          data:
            type: object
            properties:
              communities:
                type: array
                items:
                  $ref: "../../schema/community.yaml#/Community"
              communityUsers:
                type: array
                items:
                  $ref: "../../schema/community.yaml#/CommunityUser"
              files:
                type: array
                items:
                  $ref: "../../schema/file.yaml#/File"
              users:
                type: array
                items:
                  $ref: "../../schema/user.yaml#/UserV3"
              categories:
                type: array
                items:
                  $ref: "../../schema/community.yaml#/CommunityCategory"
              feeds:
                type: array
                items:
                  $ref: "../../schema/feed.yaml#/Feed"
