common-response-200:
  description: Messages Information
  content:
    application/json:
      schema:
        properties:
          messages:
            type: array
            items:
              $ref: "../../schema/message.yaml#/MessageV3"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"

root-get-response-200:
  description: Messages Information
  content:
    application/json:
      schema:
        properties:
          messages:
            type: array
            items:
              $ref: "../../schema/message.yaml#/MessageV3"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          paging:
            type: object
            properties:
              next:
                type: string
              prev:
                type: string

message-custom-notification-response:
  description: Messages Information
  type: object
  properties:
    messages:
      type: array
      items:
        $ref: "../../schema/message.yaml#/MessageV3"
    users:
      type: array
      items:
        $ref: "../../schema/user.yaml#/UserV3"
    files:
      type: array
      items:
        $ref: "../../schema/file.yaml#/File"

message-add-reaction-with-reactor-webhook-response:
  description: Messages Information
  content:
    application/json:
      schema:
        type: object
        properties:
          event:
            type: string
            enum:
              - "message.didAddReaction"
          data:
            type: object
            properties:
              messages:
                type: array
                items:
                  $ref: "../../schema/message.yaml#/MessageV3"
              users:
                type: array
                items:
                  $ref: "../../schema/user.yaml#/UserV3"
              files:
                type: array
                items:
                  $ref: "../../schema/file.yaml#/File"
              reactor:
                $ref: "../../schema/reaction.yaml#/Reactor"

message-remove-reaction-with-reactor-webhook-response:
  description: Messages Information
  content:
    application/json:
      schema:
        type: object
        properties:
          event:
            type: string
            enum:
              - "message.didRemoveReaction"
          data:
            type: object
            properties:
              messages:
                type: array
                items:
                  $ref: "../../schema/message.yaml#/MessageV3"
              users:
                type: array
                items:
                  $ref: "../../schema/user.yaml#/UserV3"
              files:
                type: array
                items:
                  $ref: "../../schema/file.yaml#/File"
              reactor:
                $ref: "../../schema/reaction.yaml#/Reactor"
