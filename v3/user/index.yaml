root:
  get:
    summary: "Query Users"
    tags:
      - "User"
    security:
      - BearerAuth: []
    description: |
      Retrieves a paginated list of users with advanced filtering capabilities. <br>
      Supports searching by userId, displayName, or profileHandle with different matching strategies.
    parameters:
      - $ref: "./parameter.yaml#/keyword"
      - $ref: "./parameter.yaml#/exactMatchKeyword"
      - $ref: "./parameter.yaml#/filter"
      - $ref: "./parameter.yaml#/sortBy"
      - $ref: "./parameter.yaml#/searchBy"
      - $ref: "./parameter.yaml#/options.limit"
      - $ref: "./parameter.yaml#/options.token"
      - $ref: "./parameter.yaml#/isDeleted"
      #- $ref: "./parameter.yaml#/isBrand"
    responses:
      200:
        $ref: "./response.yaml#/root-get-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  put:
    summary: "Update a User"
    tags:
      - "User"
    security:
      - BearerAuth: []
    description: "Update user such as displayName, roles, avatar and metadata\n"
    requestBody:
      $ref: "./request.yaml#/root-put-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

list:
  get:
    summary: "Get Users"
    tags:
      - "User"
    security:
      - BearerAuth: []
    description: "Get list of users by user ids.\n"
    parameters:
      - $ref: "./parameter.yaml#/userIds"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_userId:
  get:
    summary: "Get a User"
    tags:
      - "User"
    security:
      - BearerAuth: []
    description: "Get a User.\n"
    parameters:
      - $ref: "./parameter.yaml#/_userId"
      - $ref: "./parameter.yaml#/type"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_userId-isFlagByMe:
  get:
    summary: "Check whether User Flagged a given User"
    description: "Check whether User flagged a given User."
    tags:
      - "User"
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/_userId"
    responses:
      200:
        description: "Is flag by me response."
        content:
          application/json:
            schema:
              type: "object"
              properties:
                isFlagByMe:
                  type: "boolean"
      404:
        $ref: "../../global/error.yaml#/UserNotFoundError"
