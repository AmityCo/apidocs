keyword:
  name: "keyword"
  in: "query"
  schema:
    type: "string"
    maxLength: 100
  description: Keyword to search for in user information such as displayName, profileHandle, and userId. The search is case-insensitive and supports partial matches.

searchBy:
  name: "searchBy"
  in: "query"
  schema:
    type: "array"
    maxItems: 3
    items:
      type: "string"
      enum:
        - "displayName"
        - "profileHandle"
        - "userId"
      default: ["displayName", "profileHandle", "userId"]
  examples:
    singleField:
      summary: Search by display name
      value: [displayName]
    multipleFields:
      summary: Search by userId and profileHandle
      value: [userId, profileHandle]
  description: |
    Fields to search users for the keyword **(must be used with a keyword parameter)**, Default is all three fields <br>
      * `displayName` - Search by display name. When using with `sortBy` parameter the applicable sort order is `displayName`, `lastCreated` or `firstCreated`. Default to `displayName`.<br>
      * `profileHandle` - Search by profile handle, when using with `sortBy` parameter the applicable sort order is `profileHandle`, `lastCreated` or `firstCreated`. Default to `profileHandle`.  <br>
      * `userId` - Search by user id, when using with `sortBy` parameter the applicable sort order is `lastCreated`, `firstCreated` or `displayName`. Default to `displayName`.<br>
      Default is all three fields

exactMatchKeyword:
  name: "exactMatchKeyword"
  in: "query"
  schema:
    type: "boolean"
    default: false
  description: Return exact match search result when true

filter:
  name: "filter"
  in: "query"
  schema:
    type: "string"
    enum:
      - "all"
      - "flagged"
    default: "all"
  description: Filter users either by all users or only flagged users

sortBy:
  name: "sortBy"
  in: "query"
  schema:
    type: "string"
    enum:
      - "firstCreated"
      - "lastCreated"
      - "displayName"
      - "profileHandle"
    default: "displayName"
  examples:
    lastCreated:
      summary: Sort by creation date (newest first)
      value: lastCreated
    displayName:
      summary: Sort by display name (alphabetical order)
      value: displayName
  description: |
    Sort users by specified criteria default to `displayName`.

options.limit:
  name: options[limit]
  in: query
  description: Number of results per page (1-100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

options.token:
  name: options[token]
  in: query
  description: Pagination token for getting next/previous pages
  schema:
    type: string
    maxLength: 100

isDeleted:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: false
  description: "filter only deleted users when true"

isBrand:
  name: "isBrand"
  in: "query"
  schema:
    type: "boolean"
  description: |
    Filter brand user <br>
    ```undefined``` - return all user <br>
    ```true``` - return only brand user <br>
    ```false``` - return only non-brand user

userIds:
  name: "userIds"
  in: "query"
  required: true
  schema:
    type: "array"
    maxItems: 100
    items:
      type: "string"
      maxLength: 900

_userId:
  name: "userId"
  in: "path"
  required: true
  schema:
    type: "string"
    minLength: 1
    maxLength: 900

type:
  name: "type"
  in: "query"
  schema:
    type: "string"
    enum:
      - "public"
      - "internal"
    default: "public"
