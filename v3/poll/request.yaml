root-post-request-payload:
  description: "Information of a poll to be created.\n### Required\n- at least 2 options\n- dataType supports `text` and `image`\n- fileId is required when dataType is `image`\n- closedIn unit must be `milliseconds`\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          text:
            type: "string"
          question:
            type: "string"
            description: "question."
          answers:
            type: "array"
            minimum: 2
            maxItems: 10
            items:
              type: "object"
              properties:
                dataType:
                  description: "Datatype of answer (text or image)."
                  type: "string"
                  enum:
                    - "text"
                    - "image"
                  default: "text"
                data:
                  type: "string"
                  maxLength: 200
                fileId:
                  type: "string"
                  maxLength: 100
                  description: "Required when dataType is 'image'. File ID of the uploaded image."
              required:
                - "dataType"
                - "data"
          answerType:
            description: "single or multiple."
            type: "string"
            enum:
              - single
              - multiple
            nullable: true
            default: null
          closedIn:
            type: "number"
            description: "Countdown time to close vote (milliseconds)"
        required:
          - "data"

_pollId-put-request-payload:
  description: "Information of a poll to be updated.\n### Required\n- currently support only `closed`\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          text:
            type: "string"
          status:
            description: "poll status"
            type: "string"
            default: "closed"
        required:
          - "data"

_pollId-votes-post-request-payload:
  description: "Information of a poll to be voted.\n### Required\n- answerIds for vote the poll\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          answerIds:
            description: "poll id"
            type: "array"
            items:
              type: "string"
        required:
          - "data"
