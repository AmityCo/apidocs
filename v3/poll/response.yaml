common-response-200:
  description: Poll Information
  content:
    application/json:
      schema:
        type: object
        properties:
          polls:
            type: array
            items:
              $ref: "../../schema/poll.yaml#/Poll"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          roles:
            type: array
            items:
              $ref: "../../schema/role.yaml#/RoleV3"
          files:
            type: array
            description: "File objects referenced by image answers"
            items:
              $ref: "../../schema/file.yaml#/File"

poll-pagination-response-200:
  description: Poll Information and users respondent.
  content:
    application/json:
      schema:
        type: object
        properties:
          polls:
            type: array
            items:
              $ref: "../../schema/poll.yaml#/Poll"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          UsersAnswered:
            type: array
            items:
              $ref: "../../schema/poll.yaml#/UsersAnswered"
          files:
            type: array
            description: "File objects referenced by image answers"
            items:
              $ref: "../../schema/file.yaml#/File"
          paging:
            type: object
            properties:
              next:
                type: string
              previous:
                type: string

poll-webhook-response:
  description: Poll Information
  content:
    application/json:
      schema:
        type: "object"
        properties:
          event:
            type: "string"
          data:
            type: object
            properties:
              polls:
                type: array
                items:
                  $ref: "../../schema/poll.yaml#/Poll"
              users:
                type: array
                items:
                  $ref: "../../schema/user.yaml#/UserV3"
              files:
                type: array
                description: "File objects referenced by image answers"
                items:
                  $ref: "../../schema/file.yaml#/File"
