showOnlyMyFeed:
  name: "showOnlyMyFeed"
  in: "query"
  schema:
    type: "boolean"

dataTypes:
  name: "dataTypes"
  in: "query"
  schema:
    type: "array"
    minItems: 1
    maxItems: 4
    items:
      type: "string"
      enum:
        - "video"
        - "image"
        - "file"
        - "liveStream"
    description: "post data type to filter"

options:
  name: "options"
  in: "query"
  style: "deepObject"
  schema:
    type: "object"
    properties:
      limit:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 10
      token:
        type: "string"
        maxLength: 1000
