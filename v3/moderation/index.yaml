allowlists:
  get:
    summary: "Get list of allowed words"
    security:
      - BearerAuth: []
    tags:
      - "Moderation"
    parameters:
      - $ref: "./parameter.yaml#/regex"
      - $ref: "./parameter.yaml#/sortBy"
      - $ref: "./parameter.yaml#/options"
    responses:
      200:
        $ref: "./response.yaml#/allowlists-get-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  post:
    summary: "Add rules of allowlist V3"
    tags:
      - "Moderation"
    security:
      - BearerAuth: []
    description: "Add rules of allowlist.\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
    requestBody:
      $ref: "./request.yaml#/allowlists-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

allowlists-verify:
  post:
    tags:
      - Moderation
    security:
      - BearerAuth: []
    summary: Verify allowlist
    description: Verify URLs with the allowlist rules.
    operationId: verifyAllowlist
    requestBody:
      $ref: "./request.yaml#/verify-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        description: Some URLs are not valid
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 400000
              message: Some URLs are not valid
      403:
        description: Some URLs are not in the allow list
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 400309
              message: Some URLs are not in the allow list
      500:
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"

blocklists:
  get:
    summary: "Get list of banned words"
    security:
      - BearerAuth: []
    tags:
      - "Moderation"
    parameters:
      - $ref: "./parameter.yaml#/regex"
      - $ref: "./parameter.yaml#/sortBy"
      - $ref: "./parameter.yaml#/options"
    responses:
      200:
        $ref: "./response.yaml#/blocklists-get-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  post:
    summary: "Add rules of blocklist V3"
    tags:
      - "Moderation"
    security:
      - BearerAuth: []
    description: "Add rules of blocklist.\n"
    parameters:
      - $ref: "./parameter.yaml#/authorization"
      - $ref: "./parameter.yaml#/content-type"
    requestBody:
      $ref: "./request.yaml#/blocklists-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

blocklists-verify:
  post:
    tags:
      - Moderation
    security:
      - BearerAuth: []
    summary: Verify blocklist
    description: Verify texts with the blocklist rules.
    operationId: verifyBlocklist
    requestBody:
      $ref: "./request.yaml#/verify-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      403:
        description: Some texts contain blocked words
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 400308
              message: Some texts contain blocked words
      500:
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
