blocklists-post-request-payload:
  description: >
    Rules information to be added.
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          regexs:
            type: "array"
            minItems: 0
            maxItems: 100
            items:
              type: "string"
              minLength: 1
              maxLength: 500
          isMatchExactWord:
            type: "boolean"
            default: false
        required:
          - regexs

allowlists-post-request-payload:
  description: >
    Rules information to be added.
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          regexs:
            type: "array"
            minItems: 0
            maxItems: 100
            items:
              type: "string"
              minLength: 1
              maxLength: 500
        required:
          - regexs

verify-request-payload:
  content:
    application/json:
      schema:
        type: object
        properties:
          data:
            description: A list of URLs to be verified
            type: array
            items:
              type: string
              maxLength: 500
            maxItems: 10
            minItems: 1
