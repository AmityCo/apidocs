blocklists-get-response-200:
  description: Criteria info
  content:
    application/json:
      schema:
        type: object
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                ruleId:
                  type: string
                regex:
                  type: string
                isMatchExactWord:
                  type: boolean
                  description: word have to be equally match
                isDeleted:
                  type: boolean
                isEnabled:
                  type: boolean
                createdAt:
                  type: string
                updatedAt:
                  type: string
          paging:
            type: object
            properties:
              next:
                type: string
              previous:
                type: string

