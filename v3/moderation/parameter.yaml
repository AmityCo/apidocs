regex:
  name: "regex"
  in: "query"
  schema:
    type: "string"
  description: "search keyword from start"

sortBy:
  name: "sortBy"
  in: "query"
  schema:
    type: "string"
    enum:
      - "firstCreated"
      - "lastCreated"

options:
  name: "options"
  in: "query"
  style: "deepObject"
  explode: true
  schema:
    type: "object"
    properties:
      after:
        type: "number"
      before:
        type: "number"
      limit:
        type: "number"
        description: "limit amount of result"
      token:
        type: "string"
        description: "pagination token"

authorization:
  name: "Authorization"
  in: "header"
  required: true
  schema:
    type: "string"

content-type:
  name: "Content-Type"
  in: "header"
  required: true
  schema:
    type: "string"
