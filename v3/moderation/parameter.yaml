regex:
  name: "regex"
  in: "query"
  schema:
    type: "string"
    maxLength: 100
  description: "search keyword from start"

category:
  name: "category"
  in: "query"
  description: >
    Which rule set to read. `content` rules are matched against user-generated
    content, `user` rules are matched against user profile fields.
  schema:
    type: "string"
    enum:
      - "content"
      - "user"
    default: "content"

sortBy:
  name: "sortBy"
  in: "query"
  schema:
    type: "string"
    enum:
      - "firstCreated"
      - "lastCreated"
    default: "lastCreated"

options:
  name: "options"
  in: "query"
  style: "deepObject"
  explode: true
  schema:
    type: "object"
    properties:
      after:
        type: "string"
        maxLength: 24
      before:
        type: "string"
        maxLength: 24
      limit:
        type: "number"
        description: "limit amount of result"
      token:
        type: "string"
        maxLength: 1000
        description: "pagination token"

authorization:
  name: "Authorization"
  in: "header"
  required: true
  schema:
    type: "string"

content-type:
  name: "Content-Type"
  in: "header"
  required: true
  schema:
    type: "string"
