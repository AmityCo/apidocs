role-request-payload:
  description: "information of a role to be created.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          roleId:
            type: "string"
            description: "role id"
            minLength: 1
            maxLength: 100
          displayName:
            type: "string"
            description: "display name of role"
            minLength: 0
            maxLength: 100
          permissions:
            type: "array"
            items:
              type: "string"
            description: "The list of permission for this role. https://docs.amity.co/amity-sdk/core-concepts/user/user-permission#permissions"
        required:
          - "roleId"
          - "permissions"
