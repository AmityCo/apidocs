level:
  name: "level"
  required: true
  in: "query"
  schema:
    type: "string"
    enum:
      - "user"
      - "channel"
      - "community"

channelId:
  name: "channelId"
  in: "query"
  schema:
    type: "string"
    minLength: 1
    maxLength: 900

communityId:
  name: "communityId"
  in: "query"
  schema:
    type: "string"
    minLength: 1
    maxLength: 900
