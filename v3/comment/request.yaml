root-post-request-payload:
  description: "information of a comment to be created.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          referenceId:
            type: "string"
            maxLength: 900
          referenceType:
            type: "string"
            enum:
              - "post"
              - "content"
              - "story"
            default: "post"
          data:
            type: "object"
            properties:
              text:
                type: "string"
                maxLength: 50000
          metadata:
            type: "object"
          commentId:
            type: "string"
            maxLength: 900
          parentId:
            type: "string"
            maxLength: 900
          mentionees:
            type: "array"
            description: "The object of the mentions type and user who get a notification from the post."
            items:
              type: "object"
              properties:
                type:
                  type: "string"
                  example: "user"
                  description: "type: * `user` - need to specific userIds and notification mentions individual user\n"
                  enum:
                    - "user"
                userIds:
                  type: "array"
                  example:
                    - "userId1"
                    - "userId2"
                  description: "Array of UserId. if the mention type is a channel, doesn't send userIds"
                  items:
                    type: "string"
          createdAt:
            type: "string"
            description: "The date/time when a comment is created."
            format: "date-time"
            example: "2022-07-07T04:24:20.444Z"
          attachments:
            type: "array"
            description: "The attachments/medias to be included in the comment"
            items:
              $ref: "../../schema/comment.yaml#/CommentAttachment"
        required:
          - "referenceId"

_commentId-put-request-payload:
  description: "comment information.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          data:
            type: "object"
            properties:
              text:
                type: "string"
                maxLength: 50000
          metadata:
            type: "object"
          mentionees:
            type: "array"
            description: "The object of the mentions type and user who get a notification from the post."
            items:
              type: "object"
              properties:
                type:
                  type: "string"
                  example: "user"
                  description: "type: * `user` - need to specific userIds and notification mentions individual user\n"
                  enum:
                    - "user"
                userIds:
                  type: "array"
                  example:
                    - "userId1"
                    - "userId2"
                  description: "Array of UserId. if the mention type is a channel, doesn't send userIds"
                  items:
                    type: "string"
          attachments:
            type: "array"
            description: "The attachments/medias to be included in the comment"
            items:
              $ref: "../../schema/comment.yaml#/CommentAttachment"
          reason:
            type: "string"
            maxLength: 300
            description: "Optional reason for the edit (admin only, ignored for regular users)"

_commentId-flag-request-payload:
  description: "information of a comment to be flagged.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          commentId:
            type: "string"
            maxLength: 900
          reason:
            type: "string"
            maxLength: 300
            default: "Others"
            description: "The reason for flagging this comment"
          detail:
            type: "string"
            maxLength: 300
            description: "Additional details about the flag"
        required:
          - "commentId"
