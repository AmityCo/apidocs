<!doctype html>
<html>
  <head>
    <title>Social+ API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="custom-header scalar-app">
      <div class="logo-container">
        <img src="logo-light.png" alt="Logo" class="logo logo-light" />
        <img src="logo-dark.png" alt="Logo" class="logo logo-dark" />
      </div>
      <b>Server API Reference</b>
      <nav>
        <a href="https://social.plus">Home</a>
      </nav>
    </header>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.31.8"></script>
    <script>
      Scalar.createApiReference('#app', {
        // The URL of the OpenAPI/Swagger document
        url: 'https://raw.githubusercontent.com/AmityCo/apidocs/$branch/bundled.json',
        theme: 'kepler',
        layout: 'modern',
        hideModels: true,
        favicon: './favicon-scp.ico',
      })
    </script>
  </body>
</html>
