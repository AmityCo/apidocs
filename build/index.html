<!DOCTYPE html>
<html>
  <head>
    <title>Social+ API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="custom-header scalar-app">
      <div class="logo-container">
        <img src="logo-light.png" alt="Logo" class="logo logo-light" />
        <img src="logo-dark.png" alt="Logo" class="logo logo-dark" />
      </div>
      <b>Server API Reference</b>
      <nav>
        <a href="https://social.plus">Home</a>
      </nav>
    </header>
    <script
      id="api-reference"
      data-url="https://raw.githubusercontent.com/AmityCo/apidocs/$branch/bundled.yaml"
    ></script>

    <!-- Optional: You can set a full configuration object like this: -->
    <script>
      var configuration = {
        theme: "kepler",
        layout: "modern",
        hideModels: true,
        favicon: "./favicon-scp.ico",
      };

      document.getElementById("api-reference").dataset.configuration =
        JSON.stringify(configuration);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
