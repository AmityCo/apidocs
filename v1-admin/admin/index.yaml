roles:
  get:
    summary: "Query admin roles"
    description: "Retrieve a list of admin roles based on query parameters."
    tags:
      - "Admin"
    security:
      - cookieAuth: []
    responses:
      200:
        $ref: "./response.yaml#/roles-post-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      401:
        $ref: "../../global/error.yaml#/UnAuthorizedError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  post:
    summary: "Create a new admin role"
    description: "Creates a new admin role with the specified details and permissions. Role create from this API will have type as 'consoleAdmin'."
    tags:
      - "Admin"
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
