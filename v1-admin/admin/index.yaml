_roleId:
  get:
    summary: "Get admin role details"
    description: "Retrieve details of a specific admin role by its ID."
    tags:
      - "Admin"
    security:
      - cookieAuth: []
    parameters:
      - name: roleId
        in: path
        required: true
        description: "The ID of the role to retrieve."
        schema:
          type: string
          example: "f74c96f3-eab5-4cda-b7a9-5d8e9402a43c"
    responses:
      200:
        $ref: "./response.yaml#/roles-post-response-200"
