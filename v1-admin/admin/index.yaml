root:
  post:
    summary: "Create a new admin user"
    description: "Creates a new admin user with the specified details and permissions."
    tags:
      - "Admin"
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              username:
                type: string
                description: "The username for the new admin."
                example: "newadmin"
              displayName:
                type: string
                description: "The display name for the new admin."
                example: "New Admin"
              password:
                type: string
                description: "The password for the new admin."
                example: "securepassword123"
              firstname:
                type: string
                description: "The first name of the new admin."
                example: "John"
              lastname:
                type: string
                description: "The last name of the new admin."
                example: "Doe"
              permissions:
                type: array
                items:
                  type: string
                description: "List of permissions assigned to the new admin."
                example:
                  - "VIEW_DYNAMIC_UI"
                  - "VIEW_CHANNEL_MANAGEMENT"
                  - "MANAGE_CHANNEL"
                  - "MODERATE_CHANNEL"
                  - "VIEW_STORY_MANAGEMENT"
                  - "MANAGE_STORY"
                  - "VIEW_POST_AND_COMMENT_MANAGEMENT"
                  - "MODERATE_POST_AND_COMMENT"
                  - "MANAGE_POST_AND_COMMENT"
                  - "CAN_USE_BRAND_USERS"
                  - "CAN_MANAGE_BRAND_USERS"
                  - "CAN_MANAGE_GLOBAL_PINNED_POST"
                  - "CAN_MANAGE_PINNED_POST"
                  - "CAN_MANAGE_FEATURED_POST"
                  - "VIEW_LIVE_STREAMING_MANAGEMENT"
                  - "MANAGE_LIVE_STREAMING"
                  - "MODERATE_LIVE_STREAMING"
                  - "VIEW_COMMUNITY_MANAGEMENT"
                  - "MANAGE_COMMUNITY"
                  - "MODERATE_COMMUNITY"
                  - "DELETE_COMMUNITY"
                  - "VIEW_COMMUNITY_CATEGORY_MANAGEMENT"
                  - "MANAGE_COMMUNITY_CATEGORY"
                  - "VIEW_SPONSORED_CONTENT_MANAGEMENT"
                  - "MANAGE_SPONSORED_CONTENT"
                  - "MANAGE_AD_SETTING"
                  - "VIEW_USAGE"
                  - "VIEW_MODERATION_FEED"
                  - "MANAGE_ALLOW_LIST"
                  - "MANAGE_BLOCK_LIST"
                  - "MANAGE_IMAGE_MODERATION_SETTING"
                  - "MANAGE_LIVE_STREAMING_MODERATION_SETTING"
                  - "VIEW_USER_MANAGEMENT"
                  - "MANAGE_USER"
                  - "MODERATE_USER"
                  - "VIEW_USER_ROLE_MANAGEMENT"
                  - "MANAGE_USER_ROLE"
                  - "VIEW_ADMIN_USER"
                  - "MANAGE_ADMIN"
                  - "VIEW_ADMIN_ROLE"
                  - "VIEW_SETTING"
                  - "MANAGE_SETTING"
                  - "MANAGE_SECURITY"
              avatarFileId:
                type: string
                description: "The file ID of the avatar for the new admin."
                example: "file-12345"
              roleAssignments:
                type: array
                maxLength: 10
                items:
                  type: object
                  properties:
                    roleId:
                      type: string
                      description: "The ID of the role to assign."
                    scope:
                      type: object
                      description: "The scope of the role assignment."
                      properties:
                        communityIds:
                          type: array
                          description: "Community internal id for the role assignment."
                          items:
                            type: string
                          maxLength: 250
                example:
                  - roleId: "role-12345"
                    scope:
                      communityIds:
                        - "community-67890"

                description: "List of role assignments for the new admin."
            required:
              - username
              - displayName
              - password
              - roleAssignments
    responses:
      200:
        $ref: "./response.yaml#/root-post-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      401:
        $ref: "../../global/error.yaml#/UnAuthorizedError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
