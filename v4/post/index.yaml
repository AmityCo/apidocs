root:
  get:
    summary: "query posts"
    tags:
      - "Post"
    security:
      - BearerAuth: []
    description: |
      Query posts.

      Event posts (`structureType: event`) are excluded from this endpoint — query them through
      `GET /api/v5/posts`.
    parameters:
      - $ref: "./parameter.yaml#/targetId"
      - $ref: "./parameter.yaml#/targetType"
      - $ref: "./parameter.yaml#/sortBy"
      - $ref: "./parameter.yaml#/hasFlag"
      - $ref: "./parameter.yaml#/isDeleted"
      - $ref: "./parameter.yaml#/options"
      - $ref: "./parameter.yaml#/feedType"
      - $ref: "./parameter.yaml#/dataTypes"
      - $ref: "./parameter.yaml#/tags"
      - $ref: "./parameter.yaml#/matchingOnlyParentPost"
      - $ref: "./parameter.yaml#/includeMixedStructure"
    responses:
      200:
        $ref: "./response.yaml#/post-pagination-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  post:
    summary: "create a post"
    tags:
      - "Post"
    security:
      - BearerAuth: []
    description: "Create a post\n"
    requestBody:
      description: |
        information of a post to be created.

        require text or at least 1 attachments

        ### Custom post
        - When `dataType` is set as the custom name (dot separated string format, see the `dataType` field section), `data` payload can be anything but it will not support normal data capability (ex. `text` data will not be created)
        and `data` payload size will be limit to `100kb`
        - `attachments` will be ignored, users need to keep them in `data` field and handle the file info by themselves

        ### Image, File, Video post
        - Put `type` with file id in `attachments`
        - Image and File data can be picked from `fileId` in `data` object in child post
        - Video fileId for each resolution will be in `videoFileId` in `data` object in child post

        ### Live streaming post
        - When put `dataType` as `liveStream` and `streamId` in `data`, post will be created as live streaming post
        - `attachments` will be ignored
        - Video streaming info will be in `videoStreamings` object in response

        ### Poll post
        - When put `dataType` as `poll` and `pollId` in `data`, post will be created as poll post
        - `attachments` will be ignored
        - Poll info will be in `polls` object in response

        ### Clip post
        - Put `type = clip` with `fileId` (from POST /v4/clips) in `attachments`
        - Optionally we can add `isMuted` on the attachment to set the clip to mute for displaying on UI.
        - Optionally we can add `displayMode` on the attachment to set the clip displayMode for displaying on UI.
        - `fileId`, `isMuted`, `displayMode` will be in `data` object in child post

        ### Room post
        - When `dataType` is `room` and `roomId` is in `data`, the post will be created as a room post

        ### Event post
        - When `dataType` is `event` and `eventId` is in `data`, the post will be created as an event post
        - `data.title` and `data.text` are optional and hold the author's own caption; the event's title,
          description, cover image and start time are read from the `events` object in the response and are
          never copied onto the post
        - The parent post gets `dataType: text` and `structureType: event`; a single child post carries
          `dataType: event` with `data.eventId`
        - An event created in a **private** community may only be posted into that same community; a `400`
          is returned for any other target
        - `attachments` and product tags are rejected with `400`
        - `data.eventId` is immutable — it cannot be changed with `PUT /api/v4/posts/{postId}`
        - Event posts are only returned by `GET /api/v5/posts`; v3 and v4 queries exclude them

        ### GIF post
        - Put `type = gif` with `url` (and optionally `width` and `height`) in `attachments`. A GIF is a link, not a file, so it has no `fileId`
        - GIFs can sit beside images, videos, files, clips and audio: 1 to 10 attachments in all, each GIF `url` once. `productTags` on a GIF is refused with `400`
        - Each GIF becomes a child post with `dataType: gif` and `data: { url, width, height }` (in `postChildren`); the parent has `dataType: text`
        - `structureType` is `gif` when every attachment is a GIF and `mixed` when other media sit beside them. A mixed post is left out of default feeds and post queries unless `includeMixedStructure=true` is sent
        - A GIF whose host the network's Allow list blocks answers `403` with code `400309`
        - Needs the `post-gif-attachment` release flag. The v3 post routes refuse a GIF with `400`; scheduled posts accept GIFs

      required: true
      content:
        $ref: "./request.yaml#/root-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/post-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_postId:
  put:
    summary: "update a post"
    tags:
      - "Post"
    security:
      - BearerAuth: []
    description: |
      Update a post.

      ### GIF attachments
      - `attachments` is the full list to keep. GIFs are matched by `url` alone; see the `attachments` field of the request body
      - `[]` removes every attachment and leaves a text post, and the answer can still show the old `structureType`
      - Needs the `post-gif-attachment` release flag when the list holds a GIF; the v3 post routes refuse GIFs
    parameters:
      - $ref: "./parameter.yaml#/_postId"
      - $ref: "./parameter.yaml#/preserve-edited-at"
    requestBody:
      $ref: "./request.yaml#/_postId-put-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/post-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  delete:
    summary: "delete a post"
    tags:
      - "Post"
    security:
      - BearerAuth: []
    description: |
      Delete a post.

      Delete a child post of `dataType: gif` to remove that one GIF: the parent and its other GIFs stay, the parent's `structureType` is
      recalculated, and no file is released because a GIF has none.
    parameters:
      - $ref: "./parameter.yaml#/_postId"
      - $ref: "./parameter.yaml#/permanent"
    responses:
      200:
        description: "post information"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                status:
                  type: "string"
                data:
                  type: "object"
                  properties:
                    success:
                      type: "boolean"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_postId-kv:
  patch:
    summary: "patch post data and metadata"
    tags:
      - "Post"
    security:
      - BearerAuth: []
    description: |
      Partially update post data and/or metadata fields using set/delete operations.

      ### Rules:
      - **Data patching**: Only allowed for custom posts (posts with custom dataType, not standard post types like `text`, `image`, `video`, etc.)
      - **Metadata patching**: Allowed for all post types
    parameters:
      - $ref: "./parameter.yaml#/_postId"
    requestBody:
      $ref: "./request.yaml#/_postId-patch-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/post-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      422:
        $ref: "../../global/error.yaml#/ParameterValidationError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
