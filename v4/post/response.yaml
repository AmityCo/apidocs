post-response-200:
  description: Post Information
  content:
    application/json:
      schema:
        type: object
        properties:
          posts:
            type: array
            items:
              $ref: "../../schema/post.yaml#/PostV5"
          postChildren:
            type: array
            items:
              $ref: "../../schema/post.yaml#/PostV4"
          comments:
            type: array
            items:
              $ref: "../../schema/comment.yaml#/Comment"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          roles:
            type: array
            items:
              $ref: "../../schema/role.yaml#/RoleV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          communities:
            type: array
            items:
              $ref: "../../schema/community.yaml#/Community"
          communityUsers:
            type: array
            items:
              $ref: "../../schema/community.yaml#/CommunityUser"
          categories:
            type: array
            items:
              $ref: "../../schema/community.yaml#/CommunityCategory"
          feeds:
            type: array
            items:
              $ref: "../../schema/feed.yaml#/Feed"
          videoStreamings:
            type: array
            items:
              $ref: "../../schema/video-streaming.yml#/VideoStreaming"
          videoStreamingChildren:
            type: array
            items:
              $ref: "../../schema/video-streaming.yml#/VideoStreaming"
          rooms: 
            type: array
            items:
              $ref: "../../schema/room.yaml#/Room"
          roomChildrens:
            type: array
            items:
              $ref: "../../schema/room.yaml#/Room"
          polls:
            type: array
            items:
              $ref: "../../schema/poll.yaml#/Poll"
          events:
            type: array
            description: >
              Events referenced by event posts, looked up by `postChildren[].data.eventId`. A deleted
              event is absent from this collection.
            items:
              $ref: "../../schema/event.yaml#/Event"

