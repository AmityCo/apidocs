root-post-request-payload:
  application/json:
    schema:
      $ref: "../../schema/post.yaml#/CreatePost"

_postId-put-request-payload:
  description: "information of a post to be updated.\n### Image, File, Video post update - Put `type` with file id in `attachments` - Image and File data can be picked from `fileId` in `data` object in child post - Video fileId for each resolution will be in `videoFileId` in `data` object in child post\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          text:
            type: "string"
            deprecated: true
          data:
            type: "object"
            properties:
              title:
                type: "string"
                maxLength: 150
                description: "Title of a post."
              text:
                type: "string"
                maximum: 50000
                description: "For updating text in the post"
              fileId:
                type: "string"
                maximum: 100
                description: "Put file id to update file,image inside file, image post (video is not supported yet)"
              streamId:
                type: "string"
                maximum: 100
                description: "Put stream id to update live streaming post with new streaming"
              thumbnailFileId:
                type: "string"
                maximum: 100
                description: "Put image file id to update video file thumbnail in video post"
          metadata:
            type: "object"
          links: 
            $ref: '../../schema/shared.yaml#/links'
          tags:
            type: "array"
            minItems: 0
            maxItems: 5
            items:
              type: "string"
              maximum: 24
              description: "tags"
          hashtags:
            type: "array"
            minItems: 0
            maxItems: 30
            items:
              type: "string"
              maxLength: 100
              example: "content_update"
            example:
              [
                "content_update",
                "revised_post",
                "community_feedback",
                "enhanced_version",
              ]
            description: "Hashtags for the post."
          mentionees:
            type: "array"
            description: "The object of the mentions type and user who get a notification from the post."
            items:
              type: "object"
              properties:
                type:
                  type: "string"
                  example: "user"
                  description: "type: * `user` - need to specific userIds and notification mentions individual user\n"
                  enum:
                    - "user"
                userIds:
                  type: "array"
                  example:
                    - "userId1"
                    - "userId2"
                  description: "Array of UserId. if the mention type is a channel, doesn't send userIds"
                  items:
                    type: "string"
          attachments:
            type: "array"
            items:
              type: "object"
              description: "attachment info"
              properties:
                fileId:
                  type: "string"
                  example: "57b916d38eaf8010caddfb7759a2d06c"
                  description: "file id for attachment"
                type:
                  type: "string"
                  description: "attachment type"
                  enum:
                    - "image"
                    - "file"
                    - "video"
                productTags:
                  type: "array"
                  maxItems: 5
                  description: "Array of product tags for attachments (maximum 5). Complete replacement of existing tags"
                  items:
                    type: "object"
                    required:
                      - productId
                    properties:
                      productId:
                        type: "string"
                        description: "ID of the tagged product"
                        example: "prod_001"
          reason:
            type: "string"
            maxLength: 300
            description: "Optional reason for the edit (admin only, ignored for regular users)"
          productTags:
            type: "array"
            maxItems: 20
            description: "Array of product tags for text posts (maximum 20). Complete replacement of existing tags. Each tag requires productId, text, index, and length fields."
            items:
              type: "object"
              required:
                - productId
                - text
                - index
                - length
              properties:
                productId:
                  type: "string"
                  description: "ID of the tagged product"
                  example: "prod_001"
                text:
                  type: "string"
                  description: "The actual text being tagged"
                  example: "Nike Air Max"
                index:
                  type: "integer"
                  description: "Starting character position in post text (0-based)"
                  example: 13
                length:
                  type: "integer"
                  description: "Length of the tagged text in characters"
                  example: 12

_postId-patch-request-payload:
  description: |
    Patch operations for post data and metadata fields.

    Use set/delete operations to partially update fields:
    - `set`: Add or update key-value pairs
    - `delete`: Remove keys

    At least one of `data` or `metadata` must be provided.
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          data:
            type: "object"
            description: "Patch operations for post data (custom posts only)"
            properties:
              set:
                type: "object"
                description: "Key-value pairs to set or update. Maximum 100 operations."
                additionalProperties:
                  oneOf:
                    - type: "string"
                    - type: "number"
                    - type: "boolean"
                example:
                  customField1: "value"
                  customField2: 123
                  customField3: true
                  nullableField: null
                  "config.api.endpoint": "https://api.example.com"
                  "key with spaces": "allowed"
              delete:
                type: "array"
                description: "Array of keys to delete. Maximum 100 operations."
                items:
                  type: "string"
                maxItems: 100
                example:
                  - "oldField1"
                  - "oldField2"
          metadata:
            type: "object"
            description: "Patch operations for post metadata (all post types)"
            properties:
              set:
                type: "object"
                description: "Key-value pairs to set or update. Maximum 100 operations."
                additionalProperties:
                  oneOf:
                    - type: "string"
                    - type: "number"
                    - type: "boolean"
                example:
                  category: "updated"
                  priority: 5
                  featured: true
              delete:
                type: "array"
                description: "Array of keys to delete. Maximum 100 operations."
                items:
                  type: "string"
                maxItems: 100
                example:
                  - "oldMeta1"
                  - "oldMeta2"
      examples:
        setDataFields:
          summary: "Set data fields (custom posts only)"
          value:
            data:
              set:
                customField1: "new value"
                customField2: 42
                customField3: true
        deleteDataFields:
          summary: "Delete data fields"
          value:
            data:
              delete:
                - "oldField1"
                - "oldField2"
        setAndDeleteData:
          summary: "Combine set and delete operations"
          value:
            data:
              set:
                newField: "value"
              delete:
                - "oldField"
        patchMetadata:
          summary: "Patch metadata (works for all post types)"
          value:
            metadata:
              set:
                category: "updated"
                version: 2
              delete:
                - "deprecatedField"
        patchBothDataAndMetadata:
          summary: "Patch both data and metadata"
          value:
            data:
              set:
                customData: "value"
            metadata:
              set:
                status: "active"
              delete:
                - "tempField"
