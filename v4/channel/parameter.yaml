_channelId:
  name: "channelId"
  in: "path"
  required: true
  description: "Channel ID to query users from"
  schema:
    type: "string"
    minLength: 1
    maxLength: 900

role:
  name: "role"
  in: "query"
  schema:
    type: "array"
    description: "Role to filter"
    minItems: 1
    maxItems: 20
    items:
      type: "string"
      minLength: 1
      maxLength: 900

sortBy:
  name: "sortBy"
  in: "query"
  description: |
    Sort channel users by createdAt or updatedAt, default is lastCreated
  schema:
    type: "string"
    enum:
      - "lastCreated"
      - "firstCreated"
    default: "lastCreated"

memberships:
  name: "memberships"
  in: "query"
  schema:
    type: "array"
    description: "Member type to filter - member type: User is member of channel - banned type: User is banned member of channel - muted type: User is member of channel but isMuted is true\n"
    minItems: 1
    maxItems: 3
    items:
      type: "string"
      enum:
        - "muted"
        - "banned"
        - "member"
    default:
      - "member"

options.limit:
  name: options[limit]
  in: query
  description: Number of results per page (1-100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

options.token:
  name: options[token]
  in: query
  description: Pagination token for getting next/previous pages
  schema:
    type: string
    maxLength: 1000

search:
  name: "search"
  in: "query"
  description: "Keyword to search for in user information such as displayName, profileHandle, and userId. The search is case-insensitive and supports partial matches."
  schema:
    type: "string"
    minLength: 0
    maxLength: 10000

searchBy:
  name: "searchBy"
  in: "query"
  schema:
    type: "array"
    maxItems: 3
    items:
      type: "string"
      enum:
        - "displayName"
        - "profileHandle"
        - "userId"
      default: ["displayName", "profileHandle", "userId"]
  examples:
    singleField:
      summary: Search by display name
      value: [displayName]
    multipleFields:
      summary: Search by userId and profileHandle
      value: [userId, profileHandle]
  description: |
    Fields to search channel users for the keyword **(up to 3 fields can be specified)** <br>
    `displayName` - search by display name <br>
    `profileHandle` - search by profile handle <br>
    `userId` - search by user id <br>
    Default is all three fields

isDeleted:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "filter deleted members if isDeleted is null, will return both deleted and non-deleted members"

isBrand:
  name: "isBrand"
  in: "query"
  schema:
    type: "boolean"
  description: |
    Filter brand user <br>
    ```undefined``` - return all user <br>
    ```true``` - return only brand user <br>
    ```false``` - return only non-brand user
