_channelId:
  name: "channelId"
  in: "path"
  required: true
  schema:
    type: "string"
    minLength: 1
    maxLength: 900

role:
  name: "role"
  in: "query"
  schema:
    type: "array"
    description: "Role to filter"
    minItems: 1
    maxItems: 20
    items:
      type: "string"
      minLength: 1
      maxLength: 900

sortBy:
  name: "sortBy"
  in: "query"
  schema:
    type: "string"
    enum:
      - "lastCreated"
      - "firstCreated"
    default: "lastCreated"

memberships:
  name: "memberships"
  in: "query"
  schema:
    type: "array"
    description: "Member type to filter - member type: User is member of channel - banned type: User is banned member of channel - muted type: User is member of channel but isMuted is true\n"
    minItems: 1
    maxItems: 3
    items:
      type: "string"
      enum:
        - "muted"
        - "banned"
        - "member"
    default:
      - "member"

options:
  name: "options"
  in: "query"
  style: "deepObject"
  schema:
    type: "object"
    properties:
      limit:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 10
      token:
        type: "string"
        maxLength: 1000
  description: "use updatedAt when sort by first/lastUpdated"

search:
  name: "search"
  in: "query"
  schema:
    type: "string"
    minLength: 0
    maxLength: 10000

isDeleted:
  name: "isDeleted"
  in: "query"
  schema:
    type: "boolean"
    default: null
  description: "filter deleted members if isDeleted is null, will return both deleted and non-deleted members"

isBrand:
  name: "isBrand"
  in: "query"
  schema:
    type: "boolean"
  description: |
    Filter brand user <br>
    ```undefined``` - return all user <br>
    ```true``` - return only brand user <br>
    ```false``` - return only non-brand user
