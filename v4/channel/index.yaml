q-channelId-users:
  get:
    summary: "query channel users"
    tags:
      - "Channel"
    security:
      - BearerAuth: []
    parameters:
      - name: "channelId"
        in: "path"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 900
      - name: "role"
        in: "query"
        schema:
          type: "array"
          description: "Role to filter"
          minItems: 1
          maxItems: 20
          items:
            type: "string"
            minLength: 1
            maxLength: 900
      - name: "sortBy"
        in: "query"
        schema:
          type: "string"
          enum:
            - "lastCreated"
            - "firstCreated"
          default: "lastCreated"
      - name: "memberships"
        in: "query"
        schema:
          type: "array"
          description: "Member type to filter - member type: User is member of channel - banned type: User is banned member of channel - muted type: User is member of channel but isMuted is true\n"
          minItems: 1
          maxItems: 3
          items:
            type: "string"
            enum:
              - "muted"
              - "banned"
              - "member"
          default:
            - "member"
      - name: "options"
        in: "query"
        style: "deepObject"
        schema:
          type: "object"
          properties:
            limit:
              type: "integer"
              minimum: 1
              maximum: 100
              default: 10
            token:
              type: "string"
              maxLength: 1000
        description: "use updatedAt when sort by first/lastUpdated"
      - name: "search"
        in: "query"
        schema:
          type: "string"
          minLength: 0
          maxLength: 10000
      - name: "isDeleted"
        in: "query"
        schema:
          type: "boolean"
          default: null
        description: "filter deleted members if isDeleted is null, will return both deleted and non-deleted members"
      - name: "isBrand"
        in: "query"
        schema:
          type: "boolean"
        description: |
          Filter brand user <br>
          ```undefined``` - return all user <br>
          ```true``` - return only brand user <br>
          ```false``` - return only non-brand user
    responses:
      "200":
        $ref: "./v4/channel/response.yaml#/ChannelPaginationApiResponse"
      "403":
        $ref: "./global/error.yaml#/ForbiddenError"
      "429":
        $ref: "./global/error.yaml#/RateLimitError"
      "404":
        $ref: "./global/error.yaml#/NotFoundError"
      "500":
        $ref: "./global/error.yaml#/UnexpectedError"
