_channelId-users:
  get:
    summary: "Query Channel Users"
    description: |
      Retrieves a paginated list of users associated with a specific channel. <br>
      Supports filtering by membership status, roles, and search criteria. <br>
      Results can be sorted using various options and searched by different user attributes. <br>
    tags:
      - "Channel"
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/_channelId"
      - $ref: "./parameter.yaml#/role"
      - $ref: "./parameter.yaml#/sortBy"
      - $ref: "./parameter.yaml#/memberships"
      - $ref: "./parameter.yaml#/options.limit"
      - $ref: "./parameter.yaml#/options.token"
      - $ref: "./parameter.yaml#/search"
      - $ref: "./parameter.yaml#/searchBy"
      - $ref: "./parameter.yaml#/isDeleted"
      - $ref: "./parameter.yaml#/isBrand"
    responses:
      200:
        $ref: "./response.yaml#/_channelId-users-response-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
