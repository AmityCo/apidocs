images:
  post:
    summary: "Upload image file."
    security:
      - BearerAuth: []
    tags:
      - "File"
    parameters:
      - $ref: "./parameter.yaml#/content-type"
    description: "Upload image to cloud storage\n\nImage size limit: 1,073,741,824 byte\n"
    requestBody:
      $ref: "./request.yaml#/common-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/images-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      413:
        $ref: "../../global/error.yaml#/PayloadTooLargeError"
      422:
        $ref: "../../global/error.yaml#/ValidationError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

files:
  post:
    summary: "Upload file."
    security:
      - BearerAuth: []
    tags:
      - "File"
    parameters:
      - $ref: "./parameter.yaml#/content-type"
    description: "Upload file to cloud storage\n\nFile size limit: 1,073,741,824 byte\n"
    requestBody:
      $ref: "./request.yaml#/upload-file-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/files-response-200"
      413:
        $ref: "../../global/error.yaml#/PayloadTooLargeError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

videos:
  post:
    summary: "Upload video file."
    security:
      - BearerAuth: []
    tags:
      - "File"
    parameters:
      - $ref: "./parameter.yaml#/content-type"
    description: "Upload video to cloud storage\n\nVideo size limit: 2,147,483,648 byte (2GB)\n"
    requestBody:
      $ref: "./request.yaml#/upload-video-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/videos-response-200"
      413:
        $ref: "../../global/error.yaml#/PayloadTooLargeError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

clips:
  post:
    summary: "Upload clip file."
    security:
      - BearerAuth: []
    tags:
      - "File"
    parameters:
      - $ref: "./parameter.yaml#/content-type"
    description: "Upload a clip to cloud storage
      \n\nVideo size limit: 2,147,483,648 byte (2GB)
      \n\nVideo duration limit: 15 minutes"
    requestBody:
      $ref: "./request.yaml#/upload-video-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/clips-response-200"
      413:
        $ref: "../../global/error.yaml#/PayloadTooLargeError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

images-from-url:
  post:
    summary: "Upload image from URL."
    security:
      - BearerAuth: []
    tags:
      - "File"
    parameters:
      - $ref: "./parameter.yaml#/content-type"
    description: "This endpoint allows you to upload an image from a URL to Social+ cloud storage.\n\nFile size limit: 1,073,741,824 byte\n"
    requestBody:
      $ref: "./request.yaml#/upload-image-from-url-payload"
    responses:
      200:
        $ref: "./response.yaml#/images-response-200"
      401:
        $ref: "../../global/error.yaml#/UnAuthorizedError"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      408:
        $ref: "../../global/error.yaml#/RequestTimeoutError"
      413:
        $ref: "../../global/error.yaml#/PayloadTooLargeError"
      422:
        $ref: "../../global/error.yaml#/UnProcessableError"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

