uploadVideo:
  summary: Upload video.
  security:
    - BearerAuth: []
  tags:
    - File
  parameters:
    - name: Content-Type
      in: header
      value: multipart/form-data
      required: true
      schema:
        type: string
  consumes:
    - multipart/form-data
  description: |
    Upload video to cloud storage

    Video size limit: 2,147,483,648 byte
  requestBody:
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            files:
              type: array
              items:
                type: string
                format: binary
                description: Video file data
            feedType:
              type: string
            accessType:
              type: string
              enum:
                - public
                - network
          required:
            - files
  responses:
    "200":
      $ref: "./response.yaml#/FileVideoUploadResponse"
    "400":
      $ref: "../../global/error.yaml#/BadRequestError"
    "413":
      $ref: "../../global/error.yaml#/PayloadTooLargeError"
    "500":
      $ref: "../../global/error.yaml#/UnexpectedError"

uploadImage:
  summary: Upload image.
  security:
    - BearerAuth: []
  tags:
    - File
  parameters:
    - name: Content-Type
      in: header
      value: multipart/form-data
      required: true
      schema:
        type: string
  consumes:
    - multipart/form-data
  description: |
    Upload image to cloud storage

    Image size limit: 1,073,741,824 byte
  requestBody:
    description: >
      `file` and `files` are required but must not provide both and `altText` required `file` to be provided.
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            files:
              type: array
              items:
                type: string
                format: binary
                description: Image file data
            accessType:
              type: string
              enum:
                - public
                - network
          required:
            - files
  responses:
    "200":
      $ref: "./response.yaml#/FileImageUploadResponse"
    "400":
      $ref: "../../global/error.yaml#/BadRequestError"
    "413":
      $ref: "../../global/error.yaml#/PayloadTooLargeError"
    "500":
      $ref: "../../global/error.yaml#/UnexpectedError"

uploadFile:
  summary: Upload file.
  security:
    - BearerAuth: []
  tags:
    - File
  parameters:
    - name: Content-Type
      in: header
      value: multipart/form-data
      required: true
      schema:
        type: string
  consumes:
    - multipart/form-data
  description: |
    Upload file to cloud storage

    File size limit: 1,073,741,824 byte
  requestBody:
    description: >
      `file` and `files` are required but must not provide both and `altText` required `file` to be provided.
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            files:
              type: array
              items:
                type: string
                format: binary
                description: file data
            accessType:
              type: string
              enum:
                - public
                - network
          required:
            - files
  responses:
    "200":
      $ref: "./response.yaml#/FileUploadResponse"
    "400":
      $ref: "../../global/error.yaml#/BadRequestError"
    "413":
      $ref: "../../global/error.yaml#/PayloadTooLargeError"
    "500":
      $ref: "../../global/error.yaml#/UnexpectedError"
