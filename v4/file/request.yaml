common-post-request-payload:
  description: >
      `file` and `files` are required but must not provide both. `altText` requires `file` to be provided.
  content:
    multipart/form-data:
      schema:
        type: "object"
        properties:
          files:
            type: "array"
            items:
              type: "string"
              format: "binary"
              description: "A list of file data, `file` is optional when this is provided."
          file:
            type: "array"
            items:
              type: "string"
              format: "binary"
              description: "A list of file data, `files` is optional when this is provided."
          altText:
            type: string
            description: Alternative text for the file.
          preferredFilename:
            type: "string"
            maxLength: 1024
          accessType:
            type: string
            description: File access type. `network` type requires authentication to download.
            enum:
              - public
              - network
            default: public
        required:
          - "files"
          - "file"
