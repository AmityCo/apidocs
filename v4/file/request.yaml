common-post-request-payload:
  content:
    multipart/form-data:
      schema:
        type: "object"
        properties:
          file:
            type: "array"
            items:
              type: "string"
              format: "binary"
            description: An array containing a single file.
          files:
            type: "array"
            items:
              type: "string"
              format: "binary"
            description: An array of files. Must not be provided at the same time as `file`.
            deprecated: true
          preferredFilename:
            type: "string"
            maxLength: 1024
          accessType:
            type: string
            description: File access type. `network` type requires authentication to download.
            enum:
              - public
              - network
            default: public
          altText:
            type: string
            description: Alternative text for the file. Not compatible with `files` property.
            maxLength: 180
        required:
          - "file"
