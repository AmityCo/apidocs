common-post-request-payload:
  content:
    multipart/form-data:
      schema:
        type: "object"
        properties:
          files:
            type: "array"
            items:
              type: "string"
              format: "binary"
              description: "file data"
          preferredFilename:
            type: "string"
            maxLength: 1024
          accessType:
            type: string
            description: File access type. `network` type requires authentication to download.
            enum:
              - public
              - network
            default: public
        required:
          - "files"
upload-from-url-payload:
  content:
    application/json:
      schema:
        type: "object"
        properties:
          fileUrl:
            type: "string"
            description: "A file URL to upload"
          preferredFilename:
            type: "string"
            maxLength: 1024
          accessType:
            type: string
            description: File access type. `network` type requires authentication to download.
            enum:
              - public
              - network
            default: public
        required:
          - "fileUrl"
