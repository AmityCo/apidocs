root-post-request-payload:
  description: "Information about user and devices that he/she use to connect to. If displayName is provide, that user display is updated as well.\n\nIf userId doesn't exists, new user will be created.\n\nauthToken need to pass when network option is set to secure\n\naccessToken expiry 30 days\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userId:
            type: "string"
            minLength: 1
            maxLength: 50
          deviceId:
            type: "string"
            minLength: 1
            maxLength: 150
          deviceInfo:
            type: "object"
            properties:
              kind:
                type: "string"
                enum:
                  - "ios"
                  - "android"
                  - "web"
                  - "node"
              model:
                type: "string"
                maxLength: 100
              sdkVersion:
                type: "string"
                maxLength: 30
          displayName:
            type: "string"
            maxLength: 100
          profileHandle:
            type: "string"
            maxLength: 100
          authToken:
            type: "string"
            description: "Authentication token from /api/v3/authentication/token"
            minLength: 1
            maxLength: 100
        required:
          - "userId"
          - "deviceId"
