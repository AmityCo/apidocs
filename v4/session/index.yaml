root:
  post:
    summary: "Register a session"
    tags:
      - "Session"
    security: []
    parameters:
      - $ref: "./parameter.yaml#/x-api-key"
    description: "Register a session in order receive access token to perform sdk operations.\n"
    requestBody:
      $ref: "./request.yaml#/root-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/session-response-200"
      401:
        $ref: "../../global/error.yaml#/UserIsSystemBanned"
      403:
        $ref: "../../global/error.yaml#/UserIsGlobalBanned"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  delete:
    summary: Revoke access token
    tags:
      - "Session"
    security:
      - BearerAuth: []
    description: Revoke an access token. If the userId is provided, this will revoke all access tokens of that user. Only admin can revoke all access tokens of a user.
    parameters:
      - $ref: "./parameter.yaml#/userId"
      - $ref: "./parameter.yaml#/isPublic"
    responses:
      200:
        description: "Revoke access token success"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                success:
                  type: "boolean"
                  default: true
      404:
        $ref: "../../global/error.yaml#/UserIdNotFoundError"
      403:
        $ref: "../../global/error.yaml#/UserIsGlobalBanned"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

users_userId:
  delete:
    summary: Revoke all user's access tokens by admin
    tags:
      - "Session"
    security:
      - BearerAuth: []
    description: Revoke all user's access tokens by admin
    parameters:
      - $ref: "./parameter.yaml#/_userId"
      - $ref: "./parameter.yaml#/isPublic"
    responses:
      200:
        description: "Revoke access token success"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                success:
                  type: "boolean"
                  default: true
      404:
        $ref: "../../global/error.yaml#/UserIdNotFoundError"
      403:
        $ref: "../../global/error.yaml#/UserIsGlobalBanned"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
