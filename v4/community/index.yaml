        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_communityId-join:
  post:
    summary: "Join a community"
    tags:
      - "Community"
    security:
      - BearerAuth: []
    description: |
      Creates a community membership request for the requesting user and once approved by moderators, that user will become a member of the community.

      **Key Features:**
      - If the community set property `requiresJoinApproval` to `false`, the user will be added to the community immediately with approved request created.
      - If the community set property `requiresJoinApproval` to `true`, the user will have pending request created, and the moderators will need to approve or decline.
      - If the user is already having a pending invitation from moderators, the request will be auto-approved.
    parameters:
      - $ref: "./parameter.yaml#/_communityId"
    responses:
      200:
        $ref: "./response.yaml#/join-response-200"
      403:
        description: Error Response
        content:
          application/json:
            examples:
              UserIsBannedError:
                $ref: "../../global/error-example.yaml#/UserIsBannedError"
              DuplicateEntryError:
                $ref: "../../global/error-example.yaml#/DuplicateEntryError"
              MaxRepetitionExceed:
                $ref: "../../global/error-example.yaml#/MaxRepetitionExceed"
      429:
        $ref: "../../global/error.yaml#/RateLimitError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      409:
        $ref: "../../global/error.yaml#/ConflictError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  get:
    summary: "Query join requests"
    tags:
      - "Community"
    security:
      - BearerAuth: []
    description: |
      Retrieves a paginated list of join requests associated with a specific community.
    parameters:
      - $ref: "./parameter.yaml#/_communityId"
      - $ref: "./parameter.yaml#/join-request-type-required"
      - $ref: "./parameter.yaml#/join-request-target-type-required"
      - $ref: "./parameter.yaml#/join-request-statuses"
      - $ref: "./parameter.yaml#/join-request-sort-by"
      - $ref: "./parameter.yaml#/join-request-sort-order"
      - $ref: "./parameter.yaml#/options.limit"
      - $ref: "./parameter.yaml#/options.token"
    responses:
      200:
        $ref: "./response.yaml#/query-join-request-response-200"
      403:
        description: You are not allowed to do this
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            examples:
              "Users do not have permission.":
                value:
                  status: error
                  code: 400300
                  message: You are not allowed to do this
      422:
        $ref: "../../global/error.yaml#/UnProcessableError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  delete:
      summary: "Cancel join requests"
      tags:
        - "Community"
      security:
        - BearerAuth: []
      description: |
        Cancels a user's pending join request to a specific community.
      parameters:
        - $ref: "./parameter.yaml#/_communityId"
      responses:
        200:
          description: Count of join requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        404:
          $ref: "../../global/error.yaml#/NotFoundError"
        422:
          $ref: "../../global/error.yaml#/UnProcessableError"
        500:
          $ref: "../../global/error.yaml#/UnexpectedError"

