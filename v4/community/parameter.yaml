_communityId:
  name: "communityId"
  in: "path"
  required: true
  schema:
    type: "string"
    minLength: 1
    maxLength: 900

authorization:
  name: "Authorization"
  in: "header"
  required: true
  schema:
    type: "string"

content-type:
  name: "Content-Type"
  in: "header"
  required: true
  schema:
    type: "string"

roles:
  in: query
  name: roles
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      description: "Role id"
      minLength: 1
      maxLength: 100
  description: list of role id

userIds:
  in: query
  name: userIds
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      minLength: 1
      maxLength: 50
  description: list of user id

join-request-type-required:
  name: "type"
  in: "query"
  required: true
  schema:
    type: "string"
    enum:
      - "communityJoinRequest"

join-request-target-type-required:
  name: "targetType"
  in: "query"
  required: true
  schema:
    type: "string"
    enum:
      - "community"

join-request-statuses:
  name: "statuses"
  in: "query"
  schema:
    type: "array"
    items:
      type: "string"
      enum:
        - "pending"
        - "approved"
        - "rejected"
        - "cancelled"


join-request-sort-by:
  name: "sortBy"
  in: "query"
  schema:
    type: "string"
    enum:
      - "_id"
      - "respondedAt"
    default: "_id"
      
join-request-sort-order:
  name: "sortOrder"
  in: "query"
  schema:
    type: "string"
    enum:
      - "asc"
      - "desc"
    default: "asc"

options.limit:
  name: options[limit]
  in: query
  description: Number of results per page (1-100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

options.token:
  name: options[token]
  in: query
  description: Pagination token for getting next/previous pages
  schema:
    type: string
    maxLength: 1000

communityIds:
  name: "communityIds"
  in: "query"
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      maxLength: 50