_communityId:
  name: "communityId"
  in: "path"
  required: true
  schema:
    type: "string"
    minLength: 1
    maxLength: 900

authorization:
  name: "Authorization"
  in: "header"
  required: true
  schema:
    type: "string"

content-type:
  name: "Content-Type"
  in: "header"
  required: true
  schema:
    type: "string"

roles:
  in: query
  name: roles
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      description: "Role id"
      minLength: 1
      maxLength: 100
  description: list of role id

userIds:
  in: query
  name: userIds
  required: true
  schema:
    type: "array"
    minItems: 1
    maxItems: 100
    items:
      type: "string"
      minLength: 1
      maxLength: 50
  description: list of user id
