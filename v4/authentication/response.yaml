createAuthenticationTokenResponsePayload200:
  description: "Response payload"
  content:
    text/plain:
      schema:
        type: "string"
        example: "s9qne0wEqVb2e05271177748659f574a4e8ab85e08"
        description: "Use this token when create sessions"

createAuthenticationTokenResponsePayload401:
  description: "Unauthorized. Server key is invalid."
  content:
    text/plain:
      schema:
        type: "string"
        example: "Unauthorized"
        description: "Server key is invalid"

createAuthenticationTokenResponsePayload403:
  description: "Forbidden. Possibly that secure mode is disabled"
  content:
    application/json:
      schema:
        type: "object"
        properties:
          status:
            type: "string"
          message:
            type: "string"
          code:
            type: "number"
          data:
            type: "object"
            description: "error detail"

createAuthenticationTokenResponsePayload422:
  description: "Parameters validation error"
  content:
    application/json:
      schema:
        type: "object"
        properties:
          status:
            type: "string"
          message:
            type: "string"
          code:
            type: "number"
          data:
            type: "object"
            description: "error detail"
