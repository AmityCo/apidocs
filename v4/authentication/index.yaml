token:
  post:
    summary: "Create authentication token for session creation API"
    tags:
      - "Authentication"
    security: []
    parameters:
      - $ref: "./parameter.yaml#/x-server-key"
    description: "Create authentication token for session creation API. Token userId need to match userId when using it\n"
    requestBody:
      content:
        application/json:
          schema:
            $ref: "./request.yaml#/token-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/token-post-response-200"
      401:
        $ref: "./response.yaml#/token-post-response-401"
      403:
        $ref: "./response.yaml#/token-post-response-403"
      422:
        $ref: "./response.yaml#/token-post-response-422"
