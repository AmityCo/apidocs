token:
  post:
    summary: "Create authentication token for session creation API"
    tags:
      - "Authentication"
    parameters:
      - $ref: "../../params/_index.yaml#/x-server-key"
    description: "Create authentication token for session creation API. Token userId need to match userId when using it\n"
    requestBody:
      content:
        application/json:
          schema:
            $ref: "./request.yaml#/createAuthenticationTokenRequestPayload"
    responses:
      200:
        $ref: "./response.yaml#/createAuthenticationTokenResponsePayload200"
      401:
        $ref: "./response.yaml#/createAuthenticationTokenResponsePayload401"
      403:
        $ref: "./response.yaml#/createAuthenticationTokenResponsePayload403"
      422:
        $ref: "./response.yaml#/createAuthenticationTokenResponsePayload422"
