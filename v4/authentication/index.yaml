token:
  post:
    summary: "Create authentication token"
    tags:
      - "Authentication"
    parameters:
      - $ref: "./parameter.yaml#/x-server-key"
    description: |
      Create authentication token for session creation API. Token userId needs to match userId when using it. <br><br>
      For example: <br> 
      You put userId: "123456" in the request body, <br> 
      then you need to use the same userId: "123456" and token from the response in the session creation API.
    requestBody:
      content:
        application/json:
          schema:
            $ref: "./request.yaml#/token-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/token-post-response-200"
      401:
        $ref: "./response.yaml#/token-post-response-401"
      403:
        $ref: "./response.yaml#/token-post-response-403"
      422:
        $ref: "./response.yaml#/token-post-response-422"
