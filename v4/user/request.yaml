me-flags_userId-post-request-payload:
  description: |
    Optional report details. Sending no body flags the target as a legacy/unspecified
    (typeless) report — fully backward compatible.

    **`reportType`** uses the internal field vocabulary; the client owns the display labels:

    | `reportType`   | Label to show |
    |----------------|---------------|
    | `displayName`  | Username      |
    | `description`  | Bio           |
    | `avatarFileId` | Avatar        |
    | `behavior`     | Behavior      |

    Send the internal values above, not the labels.

    **Validation** (failures are `422 ValidationError`):

    | Request                                                          | Result |
    |-----------------------------------------------------------------|--------|
    | `reportType: behavior` + `reason`                               | 200    |
    | `reportType: behavior`, no `reason`                             | 422    |
    | `reportType: displayName` / `description` / `avatarFileId`, no `reason` | 200 |
    | any of the three field types + `reason`                         | 422    |
    | no `reportType` + `reason`                                      | 422    |
    | `reportType` outside the enum                                   | 422    |
    | `reason` or `comment` > 300 chars                               | 422    |
    | `reason` or `comment` empty string (`""`)                        | 422    |
    | `comment` on any type, <= 300 chars                             | 200    |

    **Semantics — one report per (reporter, `reportType`):**
    - A reporter holds at most one report per `reportType` on a target (up to 4 typed + 1 typeless).
    - Same reporter + same `reportType` again is a merge-update: provided `reason`/`comment`
      overwrite; omitted fields keep their prior values.
    - Identical resubmission is a no-op — safe to retry, but does not re-alert moderators.
    - Same reporter + different `reportType` creates a new report.
    - Typeless requests (no `reportType`) dedup only against the reporter's existing typeless
      report; typed and typeless reports never block each other.
    - Reports are anonymous to the reported user; reporter identity is not exposed to them.

    The new fields are not echoed back in the response.
  required: false
  content:
    application/json:
      schema:
        type: "object"
        properties:
          reportType:
            type: "string"
            enum:
              - displayName
              - description
              - avatarFileId
              - behavior
            description: >
              Internal field being reported. Omit for a legacy/unspecified (typeless) report.
              Display labels: displayName=Username, description=Bio, avatarFileId=Avatar,
              behavior=Behavior.
          reason:
            type: "string"
            minLength: 1
            maxLength: 300
            description: >
              Required if and only if `reportType` is `behavior`; rejected on every other request
              (profile-field types and typeless). Use a value from the predefined `ReportReasons`
              taxonomy (the same list used by content flags); it is a free string on the wire, but
              off-list values make moderation grouping unreliable.
          comment:
            type: "string"
            minLength: 1
            maxLength: 300
            description: "Optional free-text note, allowed on all report types (including typeless)."
