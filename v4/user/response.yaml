_userId-delete-response-200:
  description: return success:'true' when deletion is successful
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true

me-flags_userId-post-response-200:
  description: Flag user response
  content:
    application/json:
      schema:
        type: object
        properties:
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"

me-flags_userId-delete-response-200:
  description: Unflag user response
  content:
    application/json:
      schema:
        type: object
        properties:
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"

me-user-blocks_userId-post-response-200:
  description: Block user response
  content:
    application/json:
      schema:
        type: object
        required:
          - follows
          - followCounts
        properties:
          follows:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/FollowV5"
          followCounts:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/FollowCount"

me-user-blocks_userId-delete-response-200:
  description: Unblock user response
  content:
    application/json:
      schema:
        type: object
        required:
          - follows
          - followCounts
        properties:
          follows:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/FollowV5"
          followCounts:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/FollowCount"

me-user-blocks-get-response-200:
  description: Get blockedU uer list response
  content:
    application/json:
      schema:
        type: object
        properties:
          follows:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/FollowV5"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          paging:
            type: object
            properties:
              next:
                type: string
                description: token for getting the next page of data
                maxLength: 100
              previous:
                type: string
                description: token for getting the previous page of data
                maxLength: 100
              total:
                type: number
                description: total number of blockers

me-blocked-by-get-response-200:
  description: Get blocking users list response
  content:
    application/json:
      schema:
        type: object
        properties:
          follows:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/FollowV5"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          paging:
            type: object
            properties:
              next:
                type: string
                description: token for getting the next page of data
                maxLength: 100
              previous:
                type: string
                description: token for getting the previous page of data
                maxLength: 100
              total:
                type: number
                description: total number of users who have blocked me
