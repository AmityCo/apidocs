me-flags_userId:
  post:
    summary: "Report a User"
    security:
      - BearerAuth: []
    tags:
      - "User"
    parameters:
      - $ref: "./parameter.yaml#/_userId"
    description: |
      Report a User by User ID (Flag User).

      Optionally include `reportType`, `reason`, and `comment` in the body to categorize the
      report. Sending no body flags the target as a legacy/unspecified (typeless) report and
      behaves exactly as before — fully backward compatible, no version bump.
    requestBody:
      $ref: "./request.yaml#/me-flags_userId-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/me-flags_userId-post-response-200"
      403:
        $ref: "../../global/error.yaml#/NumberOfFlagExceedError"
      404:
        $ref: "../../global/error.yaml#/UserNotFoundError"
      422:
        $ref: "../../global/error.yaml#/ValidationError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  delete:
    summary: "Unreported a User"
    security:
      - BearerAuth: []
    tags:
      - "User"
    parameters:
      - $ref: "./parameter.yaml#/_userId"
      - $ref: "./parameter.yaml#/unflagReportType"
    description: |
      Unreported a User by User ID (Unflag User).

      Without `reportType`, withdraws all of the caller's reports on that user (every typed report
      and the typeless one, hard delete). With `reportType`, withdraws only the caller's report of
      that type; `untyped` withdraws only the typeless one. Use
      `GET /api/v4/users/{userId}/isFlagByMe` to see which reports the caller holds.

      - Other users' reports on the same target are never touched.
      - If the caller holds no matching report, the call still answers 200 and changes nothing.
      - `untyped` is accepted here only. `POST /api/v4/me/flags/{userId}` rejects it.
      - `hashFlag` on the user lists reporters, not report types: the caller stays in it until
        their last report on the user is withdrawn.
    responses:
      200:
        $ref: "./response.yaml#/me-flags_userId-delete-response-200"
      404:
        $ref: "../../global/error.yaml#/UserNotFoundError"
      422:
        $ref: "../../global/error.yaml#/ValidationError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_userId-isFlagByMe:
  get:
    summary: "Get My Reports on a User"
    security:
      - BearerAuth: []
    tags:
      - "User"
    parameters:
      - $ref: "./parameter.yaml#/_userId"
    description: |
      Returns whether the caller reported the given user, with each of the caller's own reports
      on that user: the `reportType`, `reason` and `comment` sent to
      `POST /api/v4/me/flags/{userId}`, and when the report was first filed.

      - Only the caller's reports are returned. Other users' reports on the same target are never
        exposed.
      - The caller holds at most one report per `reportType`, plus one typeless report.
      - Every field is always present. A field the report does not carry is `null`:
        `reportType: null` is a typeless (legacy) report, and `createdAt: null` is a report filed
        before report types were introduced.
      - A caller with no reports on the user gets `isFlagByMe: false` and an empty `flags` array.

      Visitor users cannot call this endpoint.
    responses:
      200:
        $ref: "./response.yaml#/_userId-isFlagByMe-get-response-200"
      401:
        $ref: "../../global/error.yaml#/UnAuthorizedError"
      404:
        $ref: "../../global/error.yaml#/UserNotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

