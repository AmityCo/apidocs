root:
  post:
    summary: Create a story
    description: Create a story
    tags:
      - Story
    security:
      - BearerAuth: []
    requestBody:
      $ref: "./request.yaml#/root-post-request-payload"
    responses:
      200:
        description: Create Result
        content:
          application/json:
            schema:
              $ref: "./response.yaml#/CreateStoryResponsePayload"
      400:
        description: Bad request
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            examples:
              "User reaches daily quota":
                value:
                  status: error
                  code: 400000
                  message: You have reached your daily story creation quota. You can delete an existing story or wait for a story to expire before creating a new one
              "Target reaches quota":
                value:
                  status: error
                  code: 400000
                  message: This community has reached its daily story creation quota. Please try again later.
              "Text is required in story type text":
                value:
                  status: error
                  code: 400000
                  message: Text is required in data object.
              "File ID is required in story type media":
                value:
                  status: error
                  code: 400000
                  message: File is required in data object.
              "URL is required in hyperlink item.":
                value:
                  status: error
                  code: 400000
                  message: url is required in hyperlink item.
              "Invalid url format in hyperlink item (no TLD or else)":
                value:
                  status: error
                  code: 400000
                  message: Invalid url format in hyperlink item.
              "Target not found.":
                value:
                  status: error
                  code: 400000
                  message: Community not found.
              "Target is deleted.":
                value:
                  status: error
                  code: 400000
                  message: The community has been deleted.
      403:
        description: No permission to create story.
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            examples:
              "Have no permission in community to create a story":
                value:
                  status: error
                  code: 400300
                  message: You are not allowed to do this
              "URL provided in an item is not in the whitelist":
                value:
                  status: error
                  code: 400309
                  message: Link is not allowed
      422:
        description: Parameters Validation Error
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 500000
              message: Parameters Validation Error!
      500:
        description: Unexpected error.
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 500000
              message: Unexpected error
  get:
    summary: Query stories by target
    description: Query stories by target
    tags:
      - Story
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/targetId"
      - $ref: "./parameter.yaml#/targetType"
      - $ref: "./parameter.yaml#/dataType"
      - $ref: "./parameter.yaml#/isExpired"
      - $ref: "./parameter.yaml#/options"
    responses:
      200:
        description: Story Information
        content:
          application/json:
            schema:
              $ref: "./response.yaml#/StoryWithTargetPaginatedResponsePayload"
      403:
        description: Forbidden Error.
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 400301
              message: User xxx is not community xxx member
      404:
        description: Target not found
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 400400
              message: CommunityId xxx not found
      422:
        description: Parameters Validation Error
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 500000
              message: Parameters Validation Error!
      500:
        description: Unexpected error.
        content:
          application/json:
            schema:
              $ref: "../../global/error.yaml#/Error"
            example:
              status: error
              code: 500000
              message: Unexpected error

count:
  get:
    summary: Count stories by target
    description: Count stories by target which includes both active and expired stories. Only admin can use this API.
    tags:
      - Story
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/targetId"
      - $ref: "./parameter.yaml#/targetType"
    responses:
      200:
        description: Story Count
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  example: 10
      404:
