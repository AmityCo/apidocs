root:
  get:
    summary: "Get global feed."
    tags:
      - "Feed"
    security:
      - BearerAuth: []
    description: "Get paginable list of active posts (not deleted) from users and community.\n"
    parameters:
      - name: "limit"
        in: "query"
        schema:
          type: "integer"
          minimum: 1
          maximum: 100
          default: 10
      - name: "token"
        in: "query"
        schema:
          type: "string"
          minLength: 1
          maxLength: 100
      - name: "dataTypes"
        in: "query"
        schema:
          type: "array"
          minItems: 1
          maxItems: 4
          items:
            type: "string"
            enum:
              - "video"
              - "image"
              - "file"
              - "liveStream"
          description: "post data type to filter"
    responses:
      "200":
        $ref: "./v4/global-feed/response.yaml#/GlobalFeedResponse"
      "400":
        $ref: "./global/error.yaml#/BadRequestError"
      "500":
        $ref: "./global/error.yaml#/UnexpectedError"
