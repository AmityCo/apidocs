limit:
  name: "limit"
  in: "query"
  schema:
    type: "integer"
    minimum: 1
    maximum: 100
    default: 10

token:
  name: "token"
  in: "query"
  schema:
    type: "string"
    minLength: 1
    maxLength: 100

dataTypes:
  name: "dataTypes"
  in: "query"
  schema:
    type: "array"
    minItems: 1
    maxItems: 5
    items:
      type: "string"
      enum:
        - "video"
        - "image"
        - "file"
        - "liveStream"
        - "clip"
    description: "post data type to filter"
