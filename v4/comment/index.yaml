_commentId:
  delete:
    summary: "delete a comment."
    tags:
      - "Comment"
    security:
      - BearerAuth: []
    parameters:
      - name: "commentId"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "permanent"
        in: "query"
        schema:
          type: "boolean"
          description: "If permanent data will be hard deleted"
    responses:
      "200":
        description: "comment information"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                status:
                  type: "string"
                data:
                  type: "object"
                  properties:
                    success:
                      type: "boolean"
      "429":
        $ref: "./global/error.yaml#/RateLimitError"
      "404":
        $ref: "./global/error.yaml#/NotFoundError"
      "500":
        $ref: "./global/error.yaml#/UnexpectedError"
