follow-response-200:
  description: Follow Response Object
  content:
    application/json:
      schema:
        type: object
        properties:
          follows:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/Follow"

FollowCountResponse:
  description: Follow Count
  content:
    application/json:
      schema:
        type: object
        properties:
          followCounts:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/FollowCount"

FollowInformationResponse:
  description: Follow Information
  content:
    application/json:
      schema:
        type: object
        required: ["followCounts"]
        properties:
          follows:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/Follow"
          followCounts:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/FollowCount"

follow-pagination-response-200:
  description: Follows List
  content:
    application/json:
      schema:
        type: object
        properties:
          follows:
            type: array
            items:
              $ref: "../../schema/follow.yaml#/Follow"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          paging:
            type: object
            properties:
              next:
                type: string
              prev:
                type: string

follow-ids-response-200:
  description: The signed-in user's follows, as ids and statuses, the most recently changed first
  content:
    application/json:
      schema:
        type: object
        required:
          - follows
        properties:
          follows:
            type: array
            maxItems: 5000
            items:
              type: object
              required:
                - userId
                - status
              properties:
                userId:
                  type: string
                  description: The followed user's public id
                status:
                  type: string
                  enum:
                    - accepted
                    - pending
      example:
        follows:
          - userId: base
            status: accepted
          - userId: eve
            status: pending
          - userId: air
            status: accepted

follow-custom-notification-response:
  description: Follow Response Object
  type: object
  properties:
    follows:
      type: array
      items:
        $ref: "../../schema/follow.yaml#/Follow"
    users:
      type: array
      items:
        $ref: "../../schema/user.yaml#/UserV3"
    files:
      type: array
      items:
        $ref: "../../schema/file.yaml#/File"

follow-webhook-response:
  description: Follow webhook response
  content:
    application/json:
      schema:
        type: object
        properties:
          event:
            type: string
          data:
            type: object
            properties:
              from:
                type: "string"
              to:
                type: "string"
              status:
                type: "string"
                enum:
                  - "none"
              createdAt:
                type: "string"
                format: "date-time"
              updatedAt:
                type: "string"
                format: "date-time"
