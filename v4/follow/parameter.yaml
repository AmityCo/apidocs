status:
  name: "status"
  in: "query"
  schema:
    type: "string"
    enum:
      - "all"
      - "pending"
      - "accepted"
    default: "all"

limit:
  name: "limit"
  in: "query"
  schema:
    type: "integer"
    minimum: 1
    maximum: 100
    default: 10

token:
  name: "token"
  in: "query"
  schema:
    type: "string"
    minLength: 1
    maxLength: 100

_userId:
  name: "userId"
  in: "path"
  required: true
  schema:
    type: "string"
