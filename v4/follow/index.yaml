following:
  get:
    summary: "Get my following list"
    tags:
      - "Follow"
    security:
      - BearerAuth: []
    description: "Get following information (pagination supported)\n"
    parameters:
      - name: "status"
        in: "query"
        schema:
          type: "string"
          enum:
            - "all"
            - "pending"
            - "accepted"
          default: "all"
      - name: "limit"
        in: "query"
        schema:
          type: "integer"
          minimum: 1
          maximum: 100
          default: 10
      - name: "token"
        in: "query"
        schema:
          type: "string"
          minLength: 1
          maxLength: 100
    responses:
      "200":
        $ref: "./v4/follow/response.yaml#/FollowPaginationResponse"
      "400":
        $ref: "./global/error.yaml#/BadRequestError"
      "500":
        $ref: "./global/error.yaml#/UnexpectedError"

following_userId:
  post:
    summary: "Follow user."
    tags:
      - "Follow"
    security:
      - BearerAuth: []
    description: "Follow user\n"
    parameters:
      - name: "userId"
        in: "path"
        required: true
        schema:
          type: "string"
    responses:
      "200":
        $ref: "./v4/follow/response.yaml#/FollowResponse"
      "400":
        $ref: "./global/error.yaml#/BadRequestError"
      "404":
        $ref: "./global/error.yaml#/NotFoundError"
      "500":
        $ref: "./global/error.yaml#/UnexpectedError"
  delete:
    summary: "Unfollow or Cancel follow request"
    tags:
      - "Follow"
    security:
      - BearerAuth: []
    description: "Unfollow or Cancel follow request\n"
    parameters:
      - name: "userId"
        in: "path"
        required: true
        schema:
          type: "string"
    responses:
      "200":
        $ref: "./v4/follow/response.yaml#/FollowResponse"
      "400":
        $ref: "./global/error.yaml#/BadRequestError"
      "404":
        $ref: "./global/error.yaml#/NotFoundError"
      "500":
        $ref: "./global/error.yaml#/UnexpectedError"

