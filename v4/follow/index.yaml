following:
  get:
    summary: "Get my following list"
    tags:
      - "Follow"
    security:
      - BearerAuth: []
    description: "Get following information (pagination supported)\n"
    parameters:
      - $ref: "./parameter.yaml#/status"
      - $ref: "./parameter.yaml#/limit"
      - $ref: "./parameter.yaml#/token"
    responses:
      200:
        $ref: "./response.yaml#/follow-pagination-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

following_userId:
  post:
    summary: "Follow user."
    tags:
      - "Follow"
    security:
      - BearerAuth: []
    description: "Follow user\n"
    parameters:
      - $ref: "./parameter.yaml#/_userId"
    responses:
      200:
        $ref: "./response.yaml#/follow-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  delete:
    summary: "Unfollow or Cancel follow request"
    tags:
      - "Follow"
    security:
      - BearerAuth: []
    description: "Unfollow or Cancel follow request\n"
    parameters:
      - $ref: "./parameter.yaml#/_userId"
    responses:
      200:
        $ref: "./response.yaml#/follow-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_userId-following:
  get:
    summary: "Get other following list."
    tags:
      - "Follow"
    security:
      - BearerAuth: []
    description: "Get following information (pagination supported)\n"
    parameters:
      - $ref: "./parameter.yaml#/_userId"
      - $ref: "./parameter.yaml#/status"
      - $ref: "./parameter.yaml#/limit"
      - $ref: "./parameter.yaml#/token"
