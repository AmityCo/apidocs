premium-report:
  put:
    summary: "Update premium report settings"
    description: "Update premium report settings."
    tags:
      - "Premium Report"
    security:
      - basicAuth: []
    headers:
      x-caller-context:
        required: true
        schema:
          type: string
          description: |
            The caller context header is used to identify the caller context.
            Must be a JSON string.
          example: |
            {"networkId": "1234567890","apiKey": "xxxxxxxx"}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              enabled:
                type: boolean
                description: |
                  Whether the premium report is enabled or not.
                example: true
                default: false
    responses:
      200:
        $ref: "./response.yaml#/premium-reports-put-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
