premium-report:
  put:
    summary: "Update premium report settings"
    description: "Update premium report settings."
    tags:
      - "Premium Report"
    security:
      - basicAuth: []
    parameters:
      - name: x-internal-api-key
        in: header
        description: The internal API key of network to update
        required: true
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              enabled:
                type: boolean
                description: |
                  Whether the premium report is enabled or not.
                example: true
                default: false
    responses:
      200:
        $ref: "./response.yaml#/premium-reports-put-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
