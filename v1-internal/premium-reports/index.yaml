list-networks:
  get:
    summary: "List enabled networks"
    description: "List networks that have the premium report enabled."
    parameters:
      - name: x-caller-context
        in: header
        description: The caller context header is used to identify the caller context. Must be a JSON string.
        required: true
        type: string
        example: |
          {}
    tags:
      - "Premium Report"
    security:
      - basicAuth: []
    responses:
      200:
        $ref: "./response.yaml#/list-networks-get-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
