PlatformAppCertificateResponse:
  content:
    application/json:
      schema:
        description: Platform App Certificate Information
        type: object
        properties:
          _id:
            type: string
          networkId:
            type: string
          name:
            type: string
          platform:
            type: string
            enum:
              - ios
              - android
          isActive:
            type: boolean
          createdAt:
            type: string
            format: date-time
