options:
  name: "options"
  in: "query"
  style: "deepObject"
  schema:
    type: "object"
    properties:
      limit:
        type: "integer"
        description: "Maximum number of posts to return."
        minimum: 1
        maximum: 50
        default: 20
      token:
        type: "string"
        description: "Paging cursor from `paging.next` or `paging.previous` of a previous response."
        minLength: 1
        maxLength: 1000

dataTypes:
  name: "dataTypes"
  in: "query"
  description: "Return only posts with these structure types. Omit to return all types."
  schema:
    type: "array"
    minItems: 1
    maxItems: 10
    items:
      type: "string"
      enum:
        - "text"
        - "image"
        - "video"
        - "file"
        - "audio"
        - "liveStream"
        - "poll"
        - "clip"
        - "room"
        - "event"
        - "mixed"
