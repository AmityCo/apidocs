blacklist-records-put-request-payload:
  description: >
    Rules information to be refreshed. Replaces every rule of the given
    category with the list sent.
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          regexs:
            type: "array"
            maxItems: 20000
            items:
              type: "string"
          category:
            type: "string"
            enum:
              - "content"
              - "user"
            default: "content"
            description: >
              Which rule set the words belong to. `content` rules are matched
              against user-generated content, `user` rules are matched against
              user profile fields.
        required:
          - "regexs"

blacklist-records-post-request-payload:
  description: "Rules information to be added.\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          regexs:
            type: "array"
            minItems: 1
            maxItems: 20000
            items:
              type: "string"
          isMatchExactWord:
            type: "boolean"
          category:
            type: "string"
            enum:
              - "content"
              - "user"
            default: "content"
            description: >
              Which rule set the words are added to. `content` rules are matched
              against user-generated content, `user` rules are matched against
              user profile fields.
        required:
          - "regexs"
