root:
  get:
    summary: "Get shareable deep link"
    description: "Generate a shareable deep link for specific content"
    tags:
      - "Shareable Deep Links"
    security:
      - BearerAuth: []
    parameters:
      - name: contentType
        in: path
        required: true
        schema:
          type: string
          enum: ["posts", "communities", "users", "livestreams"]
        description: "Type of content to generate link for"
        example: "posts"
      - name: contentId
        in: path
        required: true
        schema:
          type: string
        description: "ID of the content to generate link for"
    responses:
      200:
        $ref: "./response.yaml#/root-get-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
