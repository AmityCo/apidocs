ArchiveChannelResponsePayload:
  description: Archive Channel Information
  type: object
  properties:
    channelId:
      type: string
      description: Channel ID
    archivedAt:
      type: string
      description: Date of the archive
      format: "date-time"
      example: "2022-07-07T04:24:20.444Z"

GetArchiveChannelResponsePayload:
  description: Archive Channel Information
  content:
    application/json:
      schema:
        type: object
        properties:
          archives:
            type: array
            items:
              $ref: "#/ArchiveChannelResponsePayload"
