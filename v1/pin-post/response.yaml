common-response-200:
  description: Pin Post Information
  content:
    application/json:
      schema:
        type: object
        properties:
          pinTargets:
            type: array
            items:
              $ref: "../../schema/pin-content.yaml#/PinTarget"
          pins:
            type: array
            items:
              $ref: "../../schema/pin-content.yaml#/Pin"
          posts:
            type: array
            items:
              $ref: "../../schema/post.yaml#/Post"
          postChildren:
            type: array
            items:
              $ref: "../../schema/post.yaml#/Post"
          comments:
            type: array
            items:
              $ref: "../../schema/comment.yaml#/Comment"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          communities:
            type: array
            items:
              $ref: "../../schema/community.yaml#/Community"
          communityUsers:
            type: array
            items:
              $ref: "../../schema/community.yaml#/CommunityUser"
          categories:
            type: array
            items:
              $ref: "../../schema/community.yaml#/CommunityCategory"
          feeds:
            type: array
            items:
              $ref: "../../schema/feed.yaml#/Feed"
          videoStreamings:
            type: array
            items:
              $ref: "../../schema/video-streaming.yml#/VideoStreaming"
          polls:
            type: array
            items:
              $ref: "../../schema/poll.yaml#/Poll"

common-delete-response-200:
  description: OK
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean

common-response-400:
  description: badRequest Error
  content:
    application/json:
      schema:
        $ref: "../../global/error.yaml#/Error"
      examples:
        "This post is already pinned.":
          value:
            status: error
            code: 400000
            message: Post ${postId} is already pinned
        "This post is not in community":
          value:
            status: error
            code: 400000
            message: Post ${postId} is not in community
        "This post is not in public community":
          value:
            status: error
            code: 400000
            message: Post ${postId} is not in public community
        "This post is not approved":
          value:
            status: error
            code: 400000
            message: Post ${postId} has to be approved
        "This post is deleted":
          value:
            status: error
            code: 400000
            message: Post ${postId} is deleted
        "Unable to pin child post ":
          value:
            status: error
            code: 400000
            message: Unable to pin child post
        "Pin post exceed the limit":
          value:
            status: error
            code: 400000
            message: "Pin post by placement: ${placement} exceed the limit"
