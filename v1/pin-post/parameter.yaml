options:
  name: options
  in: query
  schema:
    type: object
    properties:
      sortBy:
        type: string
        default: createdAt
        enum:
          - createdAt
      orderBy:
        type: string
        default: desc
        enum:
          - asc
          - desc

postId:
  name: "postId"
  required: true
  in: "path"
  schema:
    type: "string"
    maxLength: 900

communityId:
  name: "communityId"
  required: true
  in: "path"
  schema:
    type: "string"
    maxLength: 900

placement:
  name: "placement"
  required: true
  in: "path"
  schema:
    type: "string"
    enum:
      - "default"
      - "announcement"
