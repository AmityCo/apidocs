create-product-request-payload:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - productId
          - productName
          - productUrl
          - status
        properties:
          productId:
            type: string
            description: "Unique identifier for the product"
            minLength: 1
            maxLength: 100
            example: "prod-12345"
          productName:
            type: string
            description: "Name of the product"
            minLength: 1
            maxLength: 200
            example: "Premium Headphones"
          productUrl:
            type: string
            format: uri
            description: "URL to the product page"
            example: "https://example.com/products/premium-headphones"
          status:
            type: string
            description: "Product status"
            enum:
              - active
              - archived
            example: "active"
          price:
            type: number
            description: "Product price (must be positive)"
            minimum: 0
            exclusiveMinimum: true
            example: 99.99
          currency:
            type: string
            description: "ISO 4217 currency code (3 characters)"
            minLength: 3
            maxLength: 3
            example: "USD"
          thumbnailUrl:
            type: string
            format: uri
            description: "URL to the product thumbnail image"
            example: "https://example.com/images/headphones-thumb.jpg"
          thumbnailMode:
            type: string
            description: "How the thumbnail should be displayed"
            enum:
              - fit
              - fill
            example: "fit"

update-product-request-payload:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          productName:
            type: string
            description: "Name of the product"
            minLength: 1
            maxLength: 200
            example: "Premium Wireless Headphones"
          productUrl:
            type: string
            format: uri
            description: "URL to the product page"
            example: "https://example.com/products/premium-wireless-headphones"
          status:
            type: string
            description: "Product status"
            enum:
              - active
              - archived
            example: "active"
          price:
            type: number
            description: "Product price (must be positive)"
            minimum: 0
            exclusiveMinimum: true
            example: 149.99
          currency:
            type: string
            description: "ISO 4217 currency code (3 characters)"
            minLength: 3
            maxLength: 3
            example: "USD"
          thumbnailUrl:
            type: string
            format: uri
            description: "URL to the product thumbnail image"
            example: "https://example.com/images/headphones-new-thumb.jpg"
          thumbnailMode:
            type: string
            description: "How the thumbnail should be displayed"
            enum:
              - fit
              - fill
            example: "fill"

delete-products-request-payload:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - productIds
        properties:
          productIds:
            type: array
            description: "Array of product IDs to delete"
            minItems: 1
            maxItems: 100
            items:
              type: string
              minLength: 1
              maxLength: 100
            example: ["prod-12345", "prod-67890", "prod-11111"]

bulk-create-request-payload:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - fileId
        properties:
          fileId:
            type: string
            description: "ID of the uploaded CSV file containing product data"
            maxLength: 100
            example: "file-abc123xyz"

bulk-start-request-payload:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - operation
        properties:
          operation:
            type: string
            description: "Operation to perform on the products in the CSV file"
            enum:
              - insert
              - update
            example: "insert"

