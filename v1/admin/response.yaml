root-response-payload-200:
  description: Admin access token information
  content:
    application/json:
      schema:
        description: Admin access token response payload
        type: object
        properties:
          adminToken:
            type: string
            description: The generated admin access token
          issuedAt:
            type: string
            format: date-time
            description: The time when the token was issued
          expiresAt:
            type: string
            format: date-time
            description: The time when the token will expire
