root-post-request-payload:
  description: "Information of room to be created\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          title:
            type: "string"
            maxLength: 1000
            description: "Room title"
          description:
            type: "string"
            maxLength: 5000
            description: "Room description"
          thumbnailFileId:
            type: "string"
            maxLength: 50
            description: "Thumbnail file ID"
          metadata:
            type: "object"
            description: "Custom metadata"
          liveChatEnabled:
            type: "boolean"
            description: "Indicates whether the live channel (chat) is enabled for the room"
            default: true
          parentRoomId:
            type: "string"
            description: "Optional parent room ID for creating child streams"
            maxLength: 50
          type:
            type: "string"
            enum:
              - "directStreaming"
              - "coHosts"
            description: "Type of room: directStreaming for single participant streaming, coHosts for multiple participants"
            default: "directStreaming"
        required:
          - "title"

_roomId-request-payload:
  description: "Information of room to be updated\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          title:
            type: "string"
            maxLength: 1000
            description: "Room title"
          description:
            type: "string"
            maxLength: 5000
            description: "Room description"
          thumbnailFileId:
            type: "string"
            maxLength: 50
            description: "Thumbnail file ID"
          metadata:
            type: "object"
            description: "Custom metadata"
          channelEnabled:
            type: "boolean"
            description: "Enable or disable live channel"

_roomId-participants-delete-request-payload:
  description: "Information of participants to be removed from the room\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          participantUserId:
            type: "string"
            description: "User ID of the participant to be removed from the room"
            maxLength: 50
        required:
          - "participantUserId"

_roomId-viewer-bans-post-request-payload:
  description: "Information of viewers to be banned from the room\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userIds:
            type: "array"
            items:
              type: "string"
              maxLength: 50
            minItems: 1
            maxItems: 100
            description: "List of user IDs to ban from the room"
        required:
          - "userIds"

_roomId-viewer-bans-delete-request-payload:
  description: "Information of viewers to be unbanned from the room\n"
  required: true
  content:
    application/json:
      schema:
        type: "object"
        properties:
          userIds:
            type: "array"
            items:
              type: "string"
              maxLength: 50
            minItems: 1
            maxItems: 100
            description: "List of user IDs to unban from the room"
        required:
          - "userIds"

user-event-room-request-payload:
  description: A group of user activity on startTime, endTime and watchSeconds.
  required: true
  content:
    application/json:
      schema:
        required:
          - signature
          - nonceStr
          - timestamp
          - rooms
        properties:
          signature:
            description: |
              RSA-SHA256 signature for request validation. Generated by:
              1. Sort data object keys alphabetically for each room
              2. Create key=value pairs (use ISO 8601 format for timestamps)
              3. Join pairs with '&' within each room
              4. Join multiple rooms with ';'
              5. Create signing string: `nonceStr={nonceStr}&timestamp={timestamp}&data={dataStr}==`
              6. Sign with SHA256 using your RSA private key
              7. Base64 encode the signature
              
              Example data string: `endTime=2021-03-10T03:08:16.127Z&roomId=room123&sessionId=session1&startTime=2021-03-10T03:07:16.127Z&watchSeconds=60`
            type: string
          nonceStr:
            description: unique string for each request, max length 50
            type: string
          timestamp:
            description: timestamp string in UTC format
            type: string
            example: "2021-03-10T03:07:16.127Z"
          rooms:
            type: array
            items:
              type: object
              required:
                - roomId
                - startTime
                - endTime
                - watchSeconds
              properties:
                sessionId:
                  description: unique sessionId for each user event, max length 50
                  type: string
                roomId:
                  description: roomId of room instance, max length 50
                  type: string
                startTime:
                  description: timestamp string in UTC format
                  type: string
                  example: "2021-03-10T03:07:16.127Z"
                endTime:
                  description: timestamp string in UTC format
                  type: string
                  example: "2021-03-10T03:07:16.127Z"
                watchSeconds:
                  description: user's watching time in seconds
                  type: number
                  example: 120
