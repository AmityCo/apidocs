root:
  post:
    summary: "create room"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    requestBody:
      $ref: "./request.yaml#/root-post-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  get:
    summary: "get list of rooms"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/statuses"
      - $ref: "./parameter.yaml#/type"
      - $ref: "./parameter.yaml#/sortBy"
      - $ref: "./parameter.yaml#/isDeleted"
      - $ref: "./parameter.yaml#/options"
    responses:
      200:
        $ref: "./response.yaml#/root-get-response-200"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_roomId:
  get:
    summary: "get single room"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/_roomId"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  put:
    summary: "update room"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/_roomId"
    requestBody:
      $ref: "./request.yaml#/_roomId-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
  delete:
    summary: "delete room"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    description: "Delete a room\n"
    parameters:
      - $ref: "./parameter.yaml#/_roomId"
    responses:
      200:
        description: "room information"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                success:
                  type: "boolean"
                    
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_roomId-stop:
  post:
    summary: "stop room"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    description: "Stop a room and end the broadcasting\n"
    parameters:
      - $ref: "./parameter.yaml#/_roomId"
    responses:
      200:
        $ref: "./response.yaml#/common-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_roomId-token:
  get:
    summary: "get ingest data (stream key or livekit token)"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    description: "Get ingest data for broadcasting. Returns stream key for direct streaming or LiveKit token for co-hosts.\n"
    parameters:
      - $ref: "./parameter.yaml#/_roomId"
    responses:
      200:
        $ref: "./response.yaml#/token-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_roomId-recorded:
  get:
    summary: "get recorded url"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    description: "Get recorded playback URLs for a room\n"
    parameters:
      - $ref: "./parameter.yaml#/_roomId"
    responses:
      200:
        $ref: "./response.yaml#/recorded-response-200"
      400:
        $ref: "../../global/error.yaml#/BadRequestError"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

_roomId-participants: 
  delete: 
    summary: "remove participant from room"
    tags:
      - "Room"
    security:
      - BearerAuth: []
    description: "Remove a participant from the room\n"
    parameters:
      - $ref: "./parameter.yaml#/_roomId"
    requestBody:
      $ref: "./request.yaml#/_roomId-participants-delete-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/root-get-response-200"
      404:
        $ref: "../../global/error.yaml#/NotFoundError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
