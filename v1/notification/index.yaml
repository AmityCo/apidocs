root:
  post:
    summary: "register a device to get push notification"
    tags:
      - "Notification"
    security:
      - ApiKeyAuth: []
    description: "Register a device to a notification service provider.\n"
    requestBody:
      $ref: "./request.yaml#/root-post-request-payload"
    responses:
      200:
        $ref: "../../global/response.yaml#/SuccessResponse"
      400:
        $ref: "../../global/error.yaml#/BadRequestError400"
      404:
        $ref: "../../global/error.yaml#/NotFoundError404"
  delete:
    summary: "unregister a device from a notification service provider"
    tags:
      - "Notification"
    security:
      - ApiKeyAuth: []
    description: "Unregister a device from a notification service provider.\n"
    parameters:
      - $ref: "./parameter.yaml#/userId"
      - $ref: "./parameter.yaml#/deviceId"
    responses:
      200:
        $ref: "../../global/response.yaml#/SuccessResponse"
      400:
        $ref: "../../global/error.yaml#/BadRequestError400"
      404:
        $ref: "../../global/error.yaml#/NotFoundError404"

notification-tray:
  get:
    summary: Get list of notification tray items
    tags: 
      - Notification Tray
    security: 
      - BearerAuth: [] 
    description: Retrieves the notification tray items for the current user. Ordered by newest first as a default. 
    parameters:
      - $ref: "./parameter.yaml#/pathUserId"
      - $ref: "./parameter.yaml#/page"
      - $ref: "./parameter.yaml#/pageSize"
    responses: 
      200:
        $ref: "./response.yaml#/GetNotificationTrayResponse"
      400:
        $ref: "../../global/error.yaml#/BadRequestError400"

notification-tray-seen:
  get:
    summary: Get notification tray seen data
    tags:
      - Notification Tray
    security: 
      - BearerAuth: []
    description: Retrieves the notification tray seen data 
    parameters: 
      - $ref: "./parameter.yaml#/pathUserId"
    responses:
      200:
        $ref: "./response.yaml#/GetNotificationTraySeenResponse"
      400:
        $ref: "../../global/error.yaml#/BadRequestError400"
  post:
    summary: Mark all notifications as seen
    tags: 
      - Notification Tray
    security: 
      - BearerAuth: [] 
    description: Marks all notifications as seen for the specified user
    parameters:
      - $ref: "./parameter.yaml#/pathUserId"
    requestBody:
      $ref: "./request.yaml#/MarkAllSeenRequest"
    responses: 
      200:
        $ref: "./response.yaml#/MarkNotificationTraySeenResponse"
      400:
        $ref: "../../global/error.yaml#/BadRequestError400"

notification-tray-items-seen:
  post:
    summary: Mark specific notification items as seen
    tags: 
      - Notification Tray
    security: 
      - BearerAuth: [] 
    description: Marks specific notification tray items as seen for the specified user
    parameters:
      - $ref: "./parameter.yaml#/pathUserId"
    requestBody:
      $ref: './request.yaml#/MarkItemsSeenRequest'
    responses: 
      200:
        $ref: "./response.yaml#/MarkNotificationTrayItemsSeenResponse"
      400:
        $ref: "../../global/error.yaml#/BadRequestError400"
