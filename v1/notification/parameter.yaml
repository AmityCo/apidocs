userId:
  name: userId
  description: user id
  in: query
  schema:
    type: string
    minLength: 1
  deprecated: true

deviceId:
  name: deviceId
  description: device id
  in: query
  schema:
    type: string
    minLength: 1

pathUserId: 
  name: userId
  type: string
  in: path
  description: The ID of the user who is the owner of the notifications
  required: true

page:
  name: page
  in: query
  description: Page number to retrieve
  required: false
  schema:
    type: integer
    default: 1
    minimum: 1

pageSize: 
  name: pageSize
  in: query
  description: Number of items per page
  required: false
  schema:
    type: integer
    default: 20
    minimum: 1
    maximum: 100
