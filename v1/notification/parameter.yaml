userId:
  name: userId
  description: user id
  in: query
  schema:
    type: string
    minLength: 1
  deprecated: true

deviceId:
  name: deviceId
  description: device id
  in: query
  schema:
    type: string
    minLength: 1

options: 
  name: options
  description: pagination optins
  in: query
  optional: true
  schema: 
    type: object
    properties: 
      token:
        optional: true
        description: pagination token
        type: string
      limit: 
        optional: true
        description: pagination limit
        type: integer
        minimum: 1
        maximum: 100
        default: 20

