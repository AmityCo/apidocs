userId:
  name: userId
  description: user id
  in: query
  schema:
    type: string
    minLength: 1
  deprecated: true

deviceId:
  name: deviceId
  description: device id
  in: query
  schema:
    type: string
    minLength: 1

options: 
  name: options
  description: Pagination options for controlling result set size and navigation
  in: query
  required: false
  schema: 
    type: object
    properties: 
      token:
        type: string
        description: Token for pagination to retrieve the next or previous page of results
      limit: 
        type: integer
        description: Maximum number of items to return per page
        minimum: 1
        maximum: 100
        default: 20

