userId:
  name: userId
  description: user id
  in: query
  schema:
    type: string
    minLength: 1
  deprecated: true

deviceId:
  name: deviceId
  description: device id
  in: query
  schema:
    type: string
    minLength: 1

token:
  name: token
  description: pagination token
  in: query
  optional: true
  schema: 
    type: string

limit:
  name: limit
  description: pagination limit
  in: query
  optional: true
  schema: 
    type: integer
    minimum: 1
    maximum: 100
    default: 20
