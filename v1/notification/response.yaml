NotificationSettingApiResponse:
  description: Response containing notification setting information
  content:
    application/json:
      schema:
        $ref: "../../schema/notification.yaml#/NotificationSetting"

# Notification Tray Actor Schema
NotificationTrayItemActor:
  type: object
  description: Represents a user who performed an action that triggered a notification
  properties:
    _id: 
      type: string
      description: Unique identifier of the actor
    publicId: 
      type: string
      description: Public identifier of the actor
    lastActedAt: 
      type: string
      format: date-time
      description: Timestamp when the actor last performed the action

# Notification Tray Item Data Schema (Deprecated)
TrayItemData:
  oneOf:
    - type: object
      required:
        - communityName
      properties:
        communityName:
          type: string
          description: Name of the community where the action occurred
    - type: object
      required:
        - reactionName
      properties:
        reactionName:
          type: array
          items:
            type: string
          description: List of reaction names used

# Main Notification Tray Item Schema
NotificationTrayItem:
  type: object
  description: Represents a single notification item in the notification tray
  required:
    - _id
    - lastOccurredAt
    - lastSeenAt
    - actors
    - actorsCount
    - actionType
    - targetId
    - targetType
    - text
    - templatedText
    - daySegment
  properties:
    _id:
      type: string
      description: Unique identifier of the notification tray item
    daySegment:
      type: string
      format: date-time
      description: Timestamp indicating which day this notification belongs to for grouping purposes
    lastSeenAt:
      type: string
      format: date-time
      description: Timestamp when the user last saw this notification
    lastOccurredAt:
      type: string
      format: date-time
      description: Timestamp when the notification last occurred
    actors:
      type: array
      description: List of users who performed the action (limited to 3 most recent)
      items:
        $ref: '#/NotificationTrayItemActor'
    actorsCount:
      type: integer
      description: Total count of actors who performed the action
    actionType:
      type: string
      description: Type of action that triggered the notification
      enum:
        - post
        - poll
        - comment
        - reaction
        - mention
        - reply
    trayItemCategory:
      type: string
      description: More specific category for certain action types
      enum:
        - mention_in_poll
        - mention_in_post
        - mention_in_comment
        - mention_in_reply
        - reaction_on_post
        - reaction_on_comment
        - reaction_on_reply
    targetId:
      type: string
      description: Identifier of the content being acted upon
    targetType:
      type: string
      description: Type of content being acted upon
    referenceId:
      type: string
      description: Optional identifier of related content for context
    referenceType:
      type: string
      description: Optional type of the referenced content
    actionReferenceId:
      type: string
      description: Optional identifier of the specific action object
    parentId:
      type: string
      description: Optional identifier of parent content
    data:
      deprecated: true
      $ref: '#/TrayItemData'
    text:
      type: string
      description: Human-readable notification text
      example: "Alice and 5 others reacted to your post."
    templatedText:
      type: string
      description: Notification text with template variables for client-side processing
      example: "{{ userId: 67f4e40030a5dea19d8a187f }} replied to your comment in {{ communityId: 67f4e4c07af04a145b1e684a }}"

# Response Schemas
GetNotificationTrayResponse:
  description: Response containing a list of notification tray items and associated data
  content:
    application/json:
      schema: 
        type: object
        required:
          - notificationTrayItems
          - users
        properties:
          notificationTrayItems:
            type: array
            description: List of notification items to display
            items:
              $ref: '#/NotificationTrayItem'
          paging:
            type: object
            description: Pagination information for navigating through results
            required:
              - limit
            properties:
              next:
                type: string
                description: Token to retrieve the next page of results
              previous:
                type: string
                description: Token to retrieve the previous page of results
              limit:
                type: number
                description: Number of items per page
          users:
            type: array
            description: User information for actors referenced in the notifications
            items:
              $ref: '../../schema/user.yaml#/UserV3'
          files:
            type: array
            description: File information for any media referenced in notifications
            items:
              $ref: '../../schema/file.yaml#/File'

GetNotificationTraySeenResponse:
  description: Response containing the user's notification tray seen timestamps
  content:
    application/json:
      schema: 
        type: object
        required:
          - lastTraySeenAt
          - lastTrayOccurredAt
        properties:
          lastTraySeenAt:
            type: string
            format: date-time
            description: Timestamp when the user last viewed their notification tray
          lastTrayOccurredAt:
            type: string
            format: date-time
            description: Timestamp of the most recent notification in the tray

MarkNotificationTraySeenResponse:
  description: Response after successfully marking all notifications as seen
  content:
    application/json:
      schema: 
        type: object
        required:
          - lastSeenAt
        properties:
          lastSeenAt:
            type: string
            format: date-time
            description: Updated timestamp for when all notifications were marked as seen

MarkNotificationTrayItemsSeenResponse:
  description: Response after successfully marking specific notifications as seen
  content:
    application/json:
      schema: 
        type: object
        required:
          - trayItems
        properties:
          trayItems:
            type: array
            description: List of updated notification items with their new seen status
            items:
              type: object
              required:
                - id
                - lastSeenAt
              properties:
                id:
                  type: string
                  description: Identifier of the notification item
                lastSeenAt:
                  type: string
                  format: date-time
                  description: Updated timestamp when the notification was marked as seen
