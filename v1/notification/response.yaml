NotificationSettingApiResponse:
  description: Notification Setting Information
  content:
    application/json:
      schema:
        $ref: "../../schema/notification.yaml#/NotificationSetting"

TrayItemData:
  oneOf:
    - type: object
      required:
        - communityName
      properties:
        communityName:
          type: string
    - type: object
      required:
        - reactionName
      properties:
        reactionName:
          type: array
          items:
            type: string

NotificationTrayItemActor:
  type: object
  properties:
    _id: 
      type: string
    publicId: 
      type: string
    lastActedAt: 
      type: string
      format: date-time

NotificationTrayItem:
  type: object
  required:
    - _id
    - lastOccurredAt
    - lastSeenAt
    - actors
    - actorsCount
    - actionType
    - targetId
    - targetType
    - data
    - text
    - templatedText
  properties:
    _id:
      type: string
      description: ObjectId of the notification tray item
    lastSeenAt:
      type: string
      format: date-time
      description: Timestamp when the notification was last seen
    lastOccurredAt:
      type: string
      format: date-time
      description: Timestamp when the notification last occurred
    actors:
      type: array
      description: Cap at 3 items
      items:
        $ref: '#/NotificationTrayItemActor'
    actorsCount:
      type: integer
      description: No caps on the total number of actors
    actionType:
      type: string
      enum:
        - post
        - poll
        - comment
        - reaction
        - mention
        - reply
    trayItemCategory:
      type: string
      enum:
        - mention_in_post
        - mention_in_poll
        - mention_in_comment
        - mention_in_reply
        - react_to_post
        - react_to_poll
        - react_to_comment
        - react_to_reply
      description: Category for when action is either "mention" or "reply"
    targetId:
      type: string
      description: ObjectId of the target
    targetType:
      type: string
    referenceId:
      type: string
      description: Optional ObjectId of the reference
    referenceType:
      type: string
    actionReferenceId:
      type: string
      description: Optional ObjectId of the action object
    parentId:
      type: string
      description: Optional ObjectId of parent
    data:
      $ref: '#/TrayItemData'
    text:
      type: string
      description: Ready to render text without any templating
      example: "Alice and 5 others reacted to your post."
    templatedText:
      type: string
      description: Ready to render text with templating allow client to interpret
      example: "{{ userId: 67f4e40030a5dea19d8a187f }} replied to your comment in {{ communityId: 67f4e4c07af04a145b1e684a }}"

GetNotificationTrayResponse:
  description: Notification tray items list
  content:
    application/json:
      schema: 
        type: object
        required:
          - notificationTrayItems
          - users
        properties:
          notificationTrayItems:
            type: array
            items:
              $ref: '#/NotificationTrayItem'
          paging:
            type: object
            required:
              - next
              - previous
              - limit
            properties:
              next:
                type: string
              previous:
                type: string
              limit:
                type: number
          users:
            type: array
            description: Serialized user data
            items:
              $ref: '../../schema/user.yaml#/UserV3'
          files:
            type: array
            description: Serialize file data
            items:
              $ref: '../../schema/file.yaml#/File'

GetNotificationTraySeenResponse:
  description: Notification tray seen data
  content:
    application/json:
      schema: 
        type: object
        required:
          - lastTraySeenAt
          - lastTrayOccurredAt
        properties:
          lastTraySeenAt:
            type: string
            format: date-time
            description: Timestamp when the tray was last seen
          lastTrayOccurredAt:
            type: string
            format: date-time
            description: Timestamp when the last tray item occurred


MarkNotificationTraySeenResponse:
  description: Successfully marked all notifications as seen
  content:
    application/json:
      schema: 
        type: object
        required:
          - lastTraySeenAt
        properties:
          lastTraySeenAt:
            type: string
            format: date-time

MarkNotificationTrayItemsSeenResponse:
  description: Successfully marked specified notifications as seen
  content:
    application/json:
      schema: 
        type: object
        required:
          - lastTraySeenAt
        properties:
          lastSeenAt:
            type: string
            format: date-time
