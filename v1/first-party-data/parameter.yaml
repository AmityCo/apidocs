dataType:
  name: dataType
  in: query
  required: true
  description: |
    The type of first-party data to retrieve. Specifies which data export to download.
  schema:
    type: string
    enum:
      - comments_last_90d
      - communities
      - community_members
      - post_impressions_last_7d
      - post_sentiments_latest
      - posts_last_90d
      - reactions_last_90d
      - roles
      - users
  example: users
