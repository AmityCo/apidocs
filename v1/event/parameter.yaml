eventId:
  name: eventId
  in: path
  required: true
  schema:
    type: string
  description: ID of the event

originType:
  name: originType
  in: query
  schema:
    type: string
    enum:
      - community
      - user
    default: community
  description: |
    Origin type of the event
    * `community` - Event created in a community
    * `user` - Event created on a user profile

originId:
  name: originId
  in: query
  schema:
    type: string
  description: ID of the origin (community ID, or user ID when `originType` is `user`)

tags:
  name: tags
  in: query
  schema:
    type: array
    maxItems: 5
    items:
      type: string
      maxLength: 100
  description: Event tags for categorization

isLocationVisible:
  name: isLocationVisible
  in: query
  schema:
    type: boolean
    default: true
  description: Whether the location is visible to attendees

status:
  name: status
  in: query
  schema:
    type: string
    enum:
      - scheduled
      - live
      - ended
      - cancelled
  description: |
    Event status. When omitted, non-admin callers default to `scheduled`;
    admin callers get every status.
    * `scheduled` - Event is scheduled
    * `live` - Event is currently live
    * `ended` - Event has ended
    * `cancelled` - Event is cancelled

queryRsvpStatus:
  name: status
  in: query
  schema:
    type: array
    items:
      type: string
      enum:
        - going
        - interested
        - not_going
    default: [going, interested, not_going]
  description: Filter RSVPs by status

attendeeRsvpStatus:
  name: status
  in: query
  schema:
    type: string
    enum:
      - going
      - interested
      - not_going
  description: Filter attendees by a single RSVP status. When omitted, all statuses are returned.

sortBy:
  name: sortBy
  in: query
  schema:
    type: string
    enum:
      - startTime
      - createdAt
    default: startTime
  description: Sort order for events

orderBy:
  name: orderBy
  in: query
  schema:
    type: string
    enum:
      - asc
      - desc
    default: asc
  description: Sort direction (ascending or descending)

startTimeGte:
  name: startTimeGte
  in: query
  schema:
    type: string
    format: date-time
  description: Filter events with start time greater than or equal to this value

startTimeLte:
  name: startTimeLte
  in: query
  schema:
    type: string
    format: date-time
  description: Filter events with start time less than or equal to this value

userId:
  name: userId
  in: query
  schema:
    type: string
  description: Filter events by creator user ID (admin only or the user themselves)

onlyAttendee:
  name: onlyAttendee
  in: query
  schema:
    type: boolean
    default: false
  description: |
    Return only events the specified `userId` hosts or has RSVP'd to as `going` / `interested`.
    Requires the `userId` parameter — returns 400 without it.

excludeOwnEvents:
  name: excludeOwnEvents
  in: query
  schema:
    type: boolean
    default: false
  description: Exclude events created by the calling user

eventType:
  name: type
  in: query
  schema:
    type: string
    enum:
      - virtual
      - in_person
  description: Filter events by type

options.limit:
  name: options[limit]
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  description: Page size

options.after:
  name: options[after]
  in: query
  schema:
    type: string
  description: Cursor value to get records after

options.before:
  name: options[before]
  in: query
  schema:
    type: string
  description: Cursor value to get records before

options.token:
  name: options[token]
  in: query
  schema:
    type: string
  description: Pagination token
