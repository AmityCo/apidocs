event-create-response-200:
  description: Event created successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          events:
            type: array
            items:
              $ref: "../../schema/event.yaml#/Event"
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          communities:
            type: array
            items:
              $ref: "../../schema/community.yaml#/Community"
          discussionCommunities:
            type: array
            items:
              $ref: "../../schema/community.yaml#/Community"
          videoStreamings:
            type: array
            items:
              $ref: "../../schema/video-streaming.yml#/VideoStreaming"

event-get-response-200:
  description: Event details retrieved successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          events:
            type: array
            items:
              $ref: "../../schema/event.yaml#/Event"
          eventResponses:
            type: array
            items:
              $ref: "../../schema/event.yaml#/EventRSVP"
            description: Current user's RSVP for this event (if exists)
          users:
            type: array
            items:
              $ref: "../../schema/user.yaml#/UserV3"
          files:
            type: array
            items:
              $ref: "../../schema/file.yaml#/File"
          communities:
            type: array
            items:
              $ref: "../../schema/community.yaml#/Community"
          discussionCommunities:
            type: array
            items:
              $ref: "../../schema/community.yaml#/Community"
          videoStreamings:
            type: array
            items:
              $ref: "../../schema/video-streaming.yml#/VideoStreaming"

event-query-response-200:
