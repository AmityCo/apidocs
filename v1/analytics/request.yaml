activities-request-payload:
  description: ""
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          activities:
            type: array
            minItems: 1
            maxItems: 1000
            items:
              type: object
              properties:
                contentId:
                  type: string
                  pattern: '^[a-f\d]{24}$'
                  example: 60e4b1b4b3b2b5c4c4b3b2b5
                contentType:
                  type: string
                  enum: [post, story]
                activityType:
                  type: string
                  enum: [view, linkClicked]
                timestamp:
                  type: string
                  format: date-time
                  example: 2017-07-21T17:32:28Z
