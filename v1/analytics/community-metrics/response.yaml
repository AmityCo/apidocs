most-active-time-response-200:
  description: Successful most active time response
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/MostActiveTime"
      example:
        from: 2024-05-01
        to: 2024-05-07
        most_active_times:
          - hour: 0
            hour_display: "12:00 AM"
            sum_engagements: 0
            avg_engagements: 0
          - hour: 9
            hour_display: "9:00 AM"
            sum_engagements: 15
            avg_engagements: 5
          - hour: 20
            hour_display: "8:00 PM"
            sum_engagements: 10
            avg_engagements: 5
components:
  schemas:
    ActivitiesSeries:
      type: object
      required: [granularity, from, to, data]
      properties:
        granularity: { type: string, enum: [daily] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        data:
          type: array
          items:
            type: object
            required: [date]
            properties:
              date: { type: string, format: date }
              total_posts: { type: integer }
              total_comments: { type: integer }
              total_reactions: { type: integer }
    ActivitiesAggregate:
      type: object
      required: [granularity, from, to, value]
      properties:
        granularity: { type: string, enum: [aggregate] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        value:
          type: object
          properties:
            total_posts: { type: integer }
            total_comments: { type: integer }
            total_reactions: { type: integer }
    MembersSeries:
      type: object
      required: [granularity, from, to, data]
      properties:
        granularity: { type: string, enum: [daily] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        data:
          type: array
          items:
            type: object
            required: [date]
            properties:
              date: { type: string, format: date }
              total_members: { type: integer }
              new_members: { type: integer }
              lost_members: { type: integer }
    MembersAggregate:
      type: object
      required: [granularity, from, to, value]
      properties:
        granularity: { type: string, enum: [aggregate] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        value:
          type: object
          properties:
            total_members: { type: integer }
            new_members: { type: integer }
            lost_members: { type: integer }
    MostActiveDay:
      type: object
      required: [from, to, most_active_days]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        most_active_days:
          type: array
          items:
            type: object
            required: [weekday, sum_engagements, days_count, avg_engagements]
            properties:
              weekday: { type: string }
              sum_engagements: { type: integer }
              days_count: { type: integer }
              avg_engagements: { type: number }
    MostActiveTime:
      type: object
      required: [from, to, most_active_times]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        most_active_times:
          type: array
          items:
            type: object
            required: [hour, hour_display, sum_engagements, avg_engagements]
            properties:
              hour: { type: integer }
              hour_display: { type: string }
              sum_engagements: { type: integer }
              avg_engagements: { type: number }
