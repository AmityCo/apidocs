activities-response-200:
  description: Successful activities metrics response
  content:
    application/json:
      schema:
        oneOf:
          - $ref: "#/components/schemas/ActivitiesSeries"
          - $ref: "#/components/schemas/ActivitiesAggregate"
      examples:
        daily:
          value:
            granularity: daily
            from: 2024-05-01
            to: 2024-05-05
            data:
              - date: 2024-05-01
                total_posts: 1
                total_comments: 0
                total_reactions: 2
              - date: 2024-05-02
                total_posts: 0
                total_comments: 0
                total_reactions: 0
              - date: 2024-05-03
                total_posts: 5
                total_comments: 2
                total_reactions: 1
              - date: 2024-05-04
                total_posts: 0
                total_comments: 0
                total_reactions: 0
              - date: 2024-05-05
                total_posts: 2
                total_comments: 1
                total_reactions: 3
        aggregate:
          value:
            granularity: aggregate
            from: 2024-05-01
            to: 2024-05-31
            value:
              total_posts: 120
              total_comments: 340
              total_reactions: 560
