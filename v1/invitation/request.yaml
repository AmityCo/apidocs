create-invitation-request-payload:
  description: "Create invitation request payload"
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          type:
            type: string
            description: "Type of invitation to create"
            enum:
              - "communityMemberInvite"
            example: "communityMemberInvite"
          targetType:
            type: string
            description: "Type of target entity"
            enum:
              - "community"
            example: "community"
          targetId:
            type: string
            description: "ID of the target entity (community, group, etc.)"
            minLength: 1
            maxLength: 900
            example: "68583742eae5300158b6d144"
          userIds:
            type: array
            description: "Array of user IDs to invite"
            minItems: 1
            maxItems: 1000
            items:
              type: string
              minLength: 1
              maxLength: 50
              description: "User ID to invite"
            example: ["user123", "user456", "user789"]
        required:
          - type
          - targetType
          - targetId
          - userIds
      examples:
        community-invitation:
          summary: "Create community member invitations"
          value:
            type: "communityMemberInvite"
            targetType: "community"
            targetId: "68583742eae5300158b6d144"
            userIds: ["B user", "C user"]