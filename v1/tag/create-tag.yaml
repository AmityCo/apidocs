post:
  summary: "Create Tag"
  tags:
    - "Tag"
  security:
    - BearerAuth: []
  description: |
    Create a new tag for user categorization. Requires MANAGE_USER_TAG admin permission.
    
    **Validations:**
    - Maximum tags per network enforced (default: 100, configurable via network settings)
    - Tag name must be unique within the network
    - Colors must be valid hex format (#RRGGBB)
  requestBody:
    $ref: "./request.yaml#/create-tag-request-payload"
  responses:
    200:
      $ref: "./response.yaml#/tag-response-200"
    400:
      $ref: "../../global/error.yaml#/BadRequestError"
    403:
      $ref: "../../global/error.yaml#/ForbiddenError"
    409:
      $ref: "../../global/error.yaml#/ConflictError"
    500:
      $ref: "../../global/error.yaml#/UnexpectedError"
