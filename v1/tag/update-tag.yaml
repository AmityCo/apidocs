put:
  summary: "Update Tag"
  tags:
    - "Tag"
  security:
    - BearerAuth: []
  description: |
    Update an existing tag. Requires MANAGE_USER_TAG admin permission.
    
    **Validations:**
    - At least one field must be provided
    - Cannot update deleted tags
    - Name must be unique within network if changed
    - Colors must be valid hex format if provided
  parameters:
    - $ref: "./parameter.yaml#/_tagId"
  requestBody:
    $ref: "./request.yaml#/update-tag-request-payload"
  responses:
    200:
      $ref: "./response.yaml#/tag-response-200"
    400:
      $ref: "../../global/error.yaml#/BadRequestError"
    403:
      $ref: "../../global/error.yaml#/ForbiddenError"
    404:
      $ref: "../../global/error.yaml#/NotFoundError"
    409:
      $ref: "../../global/error.yaml#/ConflictError"
    500:
      $ref: "../../global/error.yaml#/UnexpectedError"
