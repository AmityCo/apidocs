type:
  name: type
  in: query
  description: Filter by tag type
  schema:
    type: string
    enum: [user]
    example: "user"

isDeleted:
  name: isDeleted
  in: query
  description: Filter by deletion status
  schema:
    type: boolean
    example: false

keyword:
  name: keyword
  in: query
  description: Search keyword for tag name (case-insensitive)
  schema:
    type: string
    example: "VIP"

sortBy:
  name: sortBy
  in: query
  description: Field to sort by
  schema:
    type: string
    enum: [createdAt, updatedAt, name]
    default: createdAt
    example: "createdAt"

sortOrder:
  name: sortOrder
  in: query
  description: Sort order
  schema:
    type: string
    enum: [asc, desc]
    default: desc
    example: "desc"

options.limit:
  name: options[limit]
  in: query
  description: Number of results per page (max 100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    example: 20

options.token:
  name: options[token]
  in: query
  description: Pagination token from previous response
  schema:
    type: string
    example: "20"

_tagId:
  name: tagId
  in: path
  required: true
  description: The tag's MongoDB ObjectId
  schema:
    type: string
    pattern: '^[a-f\d]{24}$'
    example: "507f1f77bcf86cd799439011"
