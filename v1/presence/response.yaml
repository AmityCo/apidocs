settings-response-payload-200:
  description: Get presence feature setting response
  content:
    application/json:
      schema:
        description: Presence feature setting
        type: object
        properties:
          user:
            $ref: "../../schema/presence.yaml#/PresenceUserSetting"
          network:
            $ref: "../../schema/presence.yaml#/PresenceNetworkSettingWithoutEnabled"
          room:
            $ref: "../../schema/presence.yaml#/PresenceRoomSetting"

settings-user-response-payload-200:
  description: Update presence user setting response
  content:
    application/json:
      schema:
        $ref: "../../schema/presence.yaml#/PresenceUserSetting"

users-list-response-payload-200:
  description: Get user presence list response
  content:
    application/json:
      schema:
        description: List of user presence
        type: object
        properties:
          presences:
            type: array
            items:
              $ref: "../../schema/presence.yaml#/Presence"

network-users-response-payload-200:
  description: Get online users presence response
  content:
    application/json:
      schema:
        description: List of user presence
        type: object
        properties:
          presences:
            type: array
            items:
              $ref: "../../schema/presence.yaml#/Presence"

network-users-count-response-payload-200:
  description: Get online users count response
  content:
    application/json:
      schema:
        description: Online users count
        type: object
        properties:
          count:
            type: integer
          referenceTimeStamp:
            type: string
        required:
          - count
          - referenceTimeStamp

heartbeat-response-payload-200:
  description: Send heartbeat response
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
        required:
          - success

room-heartbeat-response-payload-200:
  description: Send room heartbeat response
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
        required:
          - success

room-users-response-payload-200:
  description: Get room viewers response
  content:
    application/json:
      schema:
        description: List of room viewers
        type: object
        properties:
          viewers:
            type: array
            items:
              $ref: "../../schema/presence.yaml#/RoomViewer"
          total:
            description: Number of viewers returned in this response
            type: integer
          limit:
            description: Maximum number of viewers requested
            type: integer
        required:
          - viewers
          - total
          - limit

room-users-count-response-payload-200:
  description: Get room viewers count response
  content:
    application/json:
      schema:
        description: Room viewers count
        type: object
        properties:
          count:
            type: integer
          referenceTimestamp:
            type: string
            format: date-time
        required:
          - count
          - referenceTimestamp
