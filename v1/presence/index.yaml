settings:
  get:
    summary: Get presence feature setting on both network and user level
    description: Get presence feature setting on both network and user level
    tags:
      - "Presence"
    responses:
      200:
        $ref: "./response.yaml#/settings-response-payload-200"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
    security:
      - BearerAuth: []

settings-user:
  put:
    summary: Update presence feature setting on user level
    description: Update presence feature setting on user level.
    tags:
      - "Presence"
    requestBody:
      $ref: "./request.yaml#/settings-user-request-payload"
    responses:
      200:
        $ref: "./response.yaml#/settings-user-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
    security:
      - BearerAuth: []

users-list:
  get:
    summary: Get presence state of provided user list
    description: >
      Get presence state of provided user list
        - Max userIds list of 220 items
        - Each id max length up to 300
    tags:
      - Presence
    security:
      - BearerAuth: []
    parameters:
      - $ref: "./parameter.yaml#/userIds"
    responses:
      200:
        $ref: "./response.yaml#/users-list-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"

network-users:
  get:
    summary: Get online users in a network
    description: >
      Get online users in a network
       - Automatically sortedBy heartbeat time)
       - Return max 1000 users
    tags:
      - Presence
    parameters:
      - $ref: "./parameter.yaml#/orderBy"
    responses:
      200:
        $ref: "./response.yaml#/network-users-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
    security:
      - BearerAuth: []

network-users-count:
  get:
    summary: Get number of online users in a network
    description: Get number of online users in a network
    tags:
      - Presence
    responses:
      200:
        $ref: "./response.yaml#/network-users-count-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
    security:
      - BearerAuth: []

heartbeat:
  post:
    summary: Send a presence heartbeat
    description: Send a presence heartbeat
    tags:
      - Presence
    responses:
      202:
        $ref: "./response.yaml#/heartbeat-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
    security:
      - BearerAuth: []

rooms-roomId-heartbeat:
  post:
    summary: Send a room presence heartbeat
    description: >
      Send a presence heartbeat for the authenticated user in a given room.
      Requires the room presence feature to be enabled on the network.
    tags:
      - Presence
    parameters:
      - $ref: "./parameter.yaml#/roomId"
    responses:
      202:
        $ref: "./response.yaml#/room-heartbeat-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
    security:
      - BearerAuth: []

rooms-roomId-users:
  get:
    summary: Get active viewers in a room
    description: >
      Get the list of users currently present in a given room.
        - Sorted by latest heartbeat time
        - Returns at most 200 viewers per request
    tags:
      - Presence
    parameters:
      - $ref: "./parameter.yaml#/roomId"
      - $ref: "./parameter.yaml#/orderBy"
      - $ref: "./parameter.yaml#/limit"
    responses:
      200:
        $ref: "./response.yaml#/room-users-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
    security:
      - BearerAuth: []

rooms-roomId-users-count:
  get:
    summary: Get number of active viewers in a room
    description: Get the number of users currently present in a given room.
    tags:
      - Presence
    parameters:
      - $ref: "./parameter.yaml#/roomId"
    responses:
      200:
        $ref: "./response.yaml#/room-users-count-response-payload-200"
      403:
        $ref: "../../global/error.yaml#/ForbiddenError"
      500:
        $ref: "../../global/error.yaml#/UnexpectedError"
    security:
      - BearerAuth: []
