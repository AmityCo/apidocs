userIds:
  name: userIds
  in: query
  required: true
  schema:
    type: array
    description: A list of user ID
    maxItems: 220
    items:
      type: string
      maxLength: 300
    example: ["yama69", "yama420"]

orderBy:
  name: orderBy
  in: query
  schema:
    type: string
    enum:
      - asc
      - desc

roomId:
  name: roomId
  in: path
  required: true
  description: The ID of the room
  schema:
    type: string

limit:
  name: limit
  in: query
  description: Maximum number of viewers to return
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 200
